    <script>
        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allPackages = [];
        let activeTag = 'all';
        let currentImageUrls = [];

        // Theme Toggle
        const htmlElement = document.documentElement;
        const themeIcon = document.getElementById('themeIcon');
        if (localStorage.getItem('theme') === 'dark') {
            htmlElement.classList.add('dark');
            themeIcon.classList.replace('fa-moon', 'fa-sun');
        }
        document.getElementById('themeToggle').addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            const isDark = htmlElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeIcon.classList.replace(isDark ? 'fa-moon' : 'fa-sun', isDark ? 'fa-sun' : 'fa-moon');
        });

        async function initPage() {
            await fetchPackages();
        }

        async function fetchPackages() {
            const { data, error } = await mySupabase.from('course_packages').select('*').order('created_at', { ascending: false });
            if (error || !data) {
                document.getElementById('packagesGrid').innerHTML = `<div class="modern-card p-12 rounded-3xl text-center text-slate-400 col-span-full">ไม่สามารถโหลดข้อมูลแพ็กเกจได้</div>`;
                return;
            }
            allPackages = data;
            renderPackagesGrid();
        }

        // 🌟 ประกาศฟังก์ชัน filterByTag ไว้ใน Global Scope ป้องกัน Error ปลอม
        window.filterByTag = function(tag) {
            activeTag = tag;
            document.querySelectorAll('.tag-btn').forEach(btn => {
                btn.className = 'tag-btn px-4 py-2 bg-white dark:bg-darkinput border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 rounded-2xl text-xs font-bold shrink-0 transition hover:bg-sky-50';
            });
            const activeBtn = document.getElementById(`tag-${tag}`);
            if (activeBtn) {
                activeBtn.className = 'tag-btn px-4 py-2 bg-sky-600 text-white rounded-2xl text-xs font-bold shrink-0 transition shadow-md';
            }
            renderPackagesGrid();
        }

        function renderPackagesGrid() {
            const grid = document.getElementById('packagesGrid');
            const keyword = document.getElementById('searchInput').value.toLowerCase().trim();
            const countBadge = document.getElementById('packageCount');

            const filtered = allPackages.filter(p => {
                const title = (p.title || '').toLowerCase();
                const code = (p.code || '').toLowerCase();
                const tagsStr = Array.isArray(p.tags) ? p.tags.join(',').toLowerCase() : (p.tags || '').toLowerCase();
                
                const matchKeyword = title.includes(keyword) || code.includes(keyword) || tagsStr.includes(keyword);
                const matchTag = activeTag === 'all' || tagsStr.includes(activeTag.toLowerCase());

                return matchKeyword && matchTag;
            });

            if (countBadge) countBadge.textContent = `${filtered.length} รายการ`;

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="modern-card p-12 rounded-3xl text-center text-slate-400 col-span-full">
                        <i class="fas fa-box-open text-3xl mb-3 text-sky-500"></i>
                        <h4 class="text-base font-bold text-slate-700 dark:text-slate-200 mb-1">ไม่พบสินค้าในหมวดหมู่นี้</h4>
                        <p class="text-xs text-slate-400">ลองเปลี่ยนคำค้นหาหรือเลือกแท็กอื่น</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(p => {
                const title = p.title || 'แพ็กเกจคอร์ส';
                const code = p.code ? `รหัส: ${p.code}` : 'BUNDLE';
                const price = `฿${Number(p.price || 0).toLocaleString()}`;
                const origPrice = p.original_price ? `฿${Number(p.original_price).toLocaleString()}` : '';
                const badge = p.badge_tag ? `<span class="px-2 py-0.5 bg-rose-500/10 text-rose-500 rounded-lg text-[10px] font-bold">${p.badge_tag}</span>` : '';
                const promo = p.promo_details ? `<p class="text-[11px] text-amber-500 font-medium"><i class="fas fa-bolt mr-1"></i>${p.promo_details}</p>` : '';
                const freebies = p.freebies ? `<p class="text-[11px] text-emerald-600 dark:text-emerald-400 font-medium"><i class="fas fa-gift mr-1"></i>${p.freebies}</p>` : '';
                const rating = p.rating ? `<span class="text-xs font-bold text-amber-500"><i class="fas fa-star mr-1"></i>${p.rating} (${p.review_count || 10})</span>` : '';
                const desc = p.description || 'ไม่มีรายละเอียดเพิ่มเติม';
                
                let imgList = [];
                if (Array.isArray(p.images) && p.images.length > 0) {
                    imgList = p.images;
                } else if (p.image_url) {
                    imgList = [p.image_url];
                } else {
                    imgList = ['https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=600&auto=format&fit=crop&q=60'];
                }

                const mainImg = imgList[0];
                const moreImagesBtn = imgList.length > 1 ? `
                    <button onclick="openGalleryModal(${JSON.stringify(imgList).replace(/"/g, '&quot;')}, '${title}')" class="absolute bottom-3 right-3 bg-black/70 backdrop-blur-md text-white text-[10px] font-bold px-2.5 py-1 rounded-xl shadow hover:bg-black transition">
                        <i class="fas fa-images mr-1"></i> ดูอีก ${imgList.length - 1} รูป
                    </button>
                ` : '';

                return `
                    <div class="modern-card rounded-3xl overflow-hidden flex flex-col justify-between group">
                        <div>
                            <div class="relative h-48 overflow-hidden bg-slate-100 dark:bg-darkinput">
                                <img src="${mainImg}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                                <div class="absolute top-3 left-3 bg-black/60 backdrop-blur-md text-white text-[10px] font-bold px-3 py-1 rounded-xl">
                                    ${code}
                                </div>
                                <div class="absolute top-3 right-3">
                                    ${badge}
                                </div>
                                ${moreImagesBtn}
                            </div>
                            <div class="p-6 space-y-2.5">
                                <div class="flex justify-between items-center">
                                    <h4 class="font-bold text-base text-slate-900 dark:text-white line-clamp-1">${title}</h4>
                                    ${rating}
                                </div>
                                <div class="flex items-center gap-2">
                                    <span class="text-lg font-extrabold text-sky-600 dark:text-sky-400">${price}</span>
                                    ${origPrice ? `<span class="text-xs text-slate-400 line-through">${origPrice}</span>` : ''}
                                </div>
                                ${promo}
                                ${freebies}
                                <p class="text-xs text-slate-500 dark:text-slate-400 line-clamp-2 leading-relaxed">${desc}</p>
                            </div>
                        </div>
                        <div class="p-6 pt-0 flex items-center justify-between border-t border-slate-100 dark:border-slate-800 mt-4 gap-2">
                            <button onclick="editPackage('${p.id}')" class="flex-1 py-2.5 bg-sky-600 hover:bg-sky-700 text-white rounded-xl text-xs font-bold transition shadow-md shadow-sky-500/20">
                                <i class="fas fa-pen-to-square mr-1"></i> แก้ไข
                            </button>
                            <button onclick="deletePackage('${p.id}')" class="px-4 py-2.5 bg-rose-50 dark:bg-rose-950/40 text-rose-600 hover:bg-rose-100 rounded-xl text-xs font-bold transition">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.openPackageModal = function(pkgId = null) {
            document.getElementById('packageForm').reset();
            document.getElementById('editPackageId').value = '';
            document.getElementById('imagePreviewContainer').innerHTML = '';
            currentImageUrls = [];
            document.getElementById('modalTitle').textContent = 'เพิ่มแพ็กเกจคอร์สใหม่';

            if (pkgId) {
                const pkg = allPackages.find(p => p.id === pkgId);
                if (pkg) {
                    document.getElementById('editPackageId').value = pkg.id;
                    document.getElementById('pkgTitle').value = pkg.title || '';
                    document.getElementById('pkgCode').value = pkg.code || '';
                    document.getElementById('pkgBadge').value = pkg.badge_tag || '';
                    document.getElementById('pkgTags').value = Array.isArray(pkg.tags) ? pkg.tags.join(', ') : (pkg.tags || '');
                    document.getElementById('pkgOriginalPrice').value = pkg.original_price || '';
                    document.getElementById('pkgPrice').value = pkg.price || '';
                    document.getElementById('pkgFreebies').value = pkg.freebies || '';
                    document.getElementById('pkgRating').value = pkg.rating || 5.0;
                    document.getElementById('pkgPromo').value = pkg.promo_details || '';
                    document.getElementById('pkgDesc').value = pkg.description || '';
                    
                    if (Array.isArray(pkg.images) && pkg.images.length > 0) {
                        currentImageUrls = [...pkg.images];
                    } else if (pkg.image_url) {
                        currentImageUrls = [pkg.image_url];
                    }
                    renderImagePreviews();
                    document.getElementById('modalTitle').textContent = 'แก้ไขแพ็กเกจคอร์ส';
                }
            }

            document.getElementById('packageModal').classList.remove('hidden');
        }

        window.closePackageModal = function() {
            document.getElementById('packageModal').classList.add('hidden');
        }

        window.editPackage = function(id) {
            openPackageModal(id);
        }

        document.getElementById('pkgImagesInput').addEventListener('change', async (e) => {
            const files = e.target.files;
            if (!files || files.length === 0) return;

            Swal.fire({ title: 'กำลังอัปโหลดรูปภาพ...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            for (let file of files) {
                const fileName = `course_${Date.now()}_${Math.random().toString(36).substring(2, 7)}.${file.name.split('.').pop()}`;
                const { data, error } = await mySupabase.storage.from('course_images').upload(fileName, file);

                if (!error) {
                    const { data: publicUrlData } = mySupabase.storage.from('course_images').getPublicUrl(fileName);
                    if (publicUrlData?.publicUrl) {
                        currentImageUrls.push(publicUrlData.publicUrl);
                    }
                }
            }

            Swal.close();
            renderImagePreviews();
        });

        function renderImagePreviews() {
            const container = document.getElementById('imagePreviewContainer');
            container.innerHTML = currentImageUrls.map((url, index) => `
                <div class="relative w-16 h-16 rounded-xl overflow-hidden border border-slate-200 dark:border-slate-700 shadow-sm group">
                    <img src="${url}" class="w-full h-full object-cover">
                    <button type="button" onclick="removeImage(${index})" class="absolute inset-0 bg-black/50 text-white flex items-center justify-center opacity-0 group-hover:opacity-100 transition">
                        <i class="fas fa-trash text-xs"></i>
                    </button>
                </div>
            `).join('');
        }

        window.removeImage = function(index) {
            currentImageUrls.splice(index, 1);
            renderImagePreviews();
        }

        window.handlePackageSubmit = async function(e) {
            e.preventDefault();
            const id = document.getElementById('editPackageId').value;
            const tagsInput = document.getElementById('pkgTags').value;
            const tagsArray = tagsInput ? tagsInput.split(',').map(t => t.trim()).filter(t => t) : [];

            const payload = {
                title: document.getElementById('pkgTitle').value.trim(),
                code: document.getElementById('pkgCode').value.trim(),
                badge_tag: document.getElementById('pkgBadge').value,
                tags: tagsArray,
                original_price: document.getElementById('pkgOriginalPrice').value ? parseFloat(document.getElementById('pkgOriginalPrice').value) : null,
                price: parseFloat(document.getElementById('pkgPrice').value) || 0,
                freebies: document.getElementById('pkgFreebies').value.trim(),
                rating: parseFloat(document.getElementById('pkgRating').value) || 5.0,
                promo_details: document.getElementById('pkgPromo').value.trim(),
                images: currentImageUrls,
                image_url: currentImageUrls.length > 0 ? currentImageUrls[0] : null,
                description: document.getElementById('pkgDesc').value.trim()
            };

            Swal.fire({ title: 'กำลังบันทึกข้อมูล...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            let error;
            if (id) {
                const res = await mySupabase.from('course_packages').update(payload).eq('id', id);
                error = res.error;
            } else {
                const res = await mySupabase.from('course_packages').insert([payload]);
                error = res.error;
            }

            if (error) {
                Swal.fire('เกิดข้อผิดพลาด', error.message, 'error');
                return;
            }

            Swal.fire({ icon: 'success', title: 'บันทึกสำเร็จ!', timer: 1200, showConfirmButton: false });
            closePackageModal();
            fetchPackages();
        }

        window.deletePackage = async function(id) {
            const confirm = await Swal.fire({ title: 'ลบแพ็กเกจนี้?', text: 'การกระทำนี้จะไม่สามารถย้อนกลับได้', icon: 'warning', showCancelButton: true, confirmButtonColor: '#e11d48', confirmButtonText: 'ลบเลย', cancelButtonText: 'ยกเลิก' });
            if (confirm.isConfirmed) {
                Swal.fire({ title: 'กำลังลบ...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                const { error } = await mySupabase.from('course_packages').delete().eq('id', id);
                if (error) {
                    Swal.fire('เกิดข้อผิดพลาด', error.message, 'error');
                } else {
                    Swal.fire({ icon: 'success', title: 'ลบสำเร็จ', timer: 1000, showConfirmButton: false });
                    fetchPackages();
                }
            }
        }

        window.openGalleryModal = function(imgList, title) {
            document.getElementById('galleryTitle').textContent = `รูปภาพทั้งหมด: ${title}`;
            const grid = document.getElementById('galleryImagesGrid');
            grid.innerHTML = imgList.map(img => `
                <div class="rounded-2xl overflow-hidden h-40 border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-darkinput">
                    <img src="${img}" class="w-full h-full object-cover">
                </div>
            `).join('');
            document.getElementById('galleryModal').classList.remove('hidden');
        }

        window.closeGalleryModal = function() {
            document.getElementById('galleryModal').classList.add('hidden');
        }

        initPage();
    </script>
</body>
</html>
