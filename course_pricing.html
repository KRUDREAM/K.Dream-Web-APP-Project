<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <script src="lms_core.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRUDREAM LAND | จัดการรายละเอียดและราคาคอร์สเรียน</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- AUTH GUARD FOR ADMIN -->
    <script>
        (function() {
            const role = localStorage.getItem('role') || localStorage.getItem('user_role');
            if (role === 'student') {
                window.location.replace('student.html');
            }
        })();
    </script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { 
                extend: { 
                    fontFamily: { sans: ['Prompt', 'sans-serif'] }, 
                    colors: { primary: '#0284c7', darkbg: '#090d16', darkbox: '#0f172a', darkinput: '#1e293b', darkcard: '#0f172a' } 
                } 
            }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .glass-nav { background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(226, 232, 240, 0.8); }
        .dark .glass-nav { background: rgba(9, 13, 22, 0.92); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(30, 41, 59, 0.8); }
        .modern-card { background: #ffffff; border: 1px solid rgba(226, 232, 240, 1); box-shadow: 0 10px 25px -5px rgba(2, 132, 199, 0.08); }
        .dark .modern-card { background: #0f172a; border: 1px solid rgba(30, 41, 59, 1); }
    </style>
</head>
<body class="bg-slate-50 dark:bg-darkbg min-h-screen text-slate-900 dark:text-slate-100">

    <!-- Navigation -->
    <nav class="glass-nav fixed w-full top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <div class="flex items-center gap-4">
                    <button onclick="goBack()" class="w-11 h-11 flex items-center justify-center rounded-2xl bg-white dark:bg-darkinput text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 hover:bg-primary hover:text-white transition-all shadow-sm" title="กลับหน้า Admin">
                        <i class="fas fa-arrow-left text-lg"></i>
                    </button>
                    <div>
                        <h1 class="font-extrabold text-xl text-slate-900 dark:text-white flex items-center gap-2">
                            <span class="w-8 h-8 rounded-xl bg-sky-600 text-white flex items-center justify-center text-sm shadow-md"><i class="fas fa-tags"></i></span>
                            จัดการรายละเอียดและราคาคอร์สเรียน
                        </h1>
                        <p class="text-xs text-slate-500 dark:text-slate-400">กำหนดราคา ภาพปก และคำอธิบายเชิงลึกสำหรับหน้าขายคอร์ส</p>
                    </div>
                </div>
                <div>
                    <button id="themeToggle" class="w-11 h-11 flex items-center justify-center rounded-2xl bg-white dark:bg-darkinput text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700">
                        <i class="fas fa-moon text-lg" id="themeIcon"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-32 pb-20">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            
            <!-- ฟอร์มแก้ไขรายละเอียดคอร์ส (ซ้าย) -->
            <div class="lg:col-span-5 modern-card p-8 rounded-3xl sticky top-28">
                <div class="flex items-center gap-4 mb-6 pb-4 border-b border-slate-100 dark:border-slate-800">
                    <div class="w-12 h-12 bg-gradient-to-br from-sky-500 to-indigo-600 text-white rounded-2xl flex items-center justify-center text-xl shadow-lg shadow-sky-500/30">
                        <i class="fas fa-pen-to-square"></i>
                    </div>
                    <div>
                        <h2 class="text-lg font-bold text-slate-900 dark:text-white" id="formTitle">แก้ไขรายละเอียดคอร์ส</h2>
                        <p class="text-xs text-slate-500 dark:text-slate-400">เลือกคอร์สจากรายการด้านขวาเพื่อแก้ไข</p>
                    </div>
                </div>

                <form id="courseDetailForm" onsubmit="handleCourseDetailSubmit(event)" class="space-y-4">
                    <input type="hidden" id="editCourseId">

                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2">ชื่อคอร์สเรียน</label>
                        <input type="text" id="courseTitle" disabled class="w-full px-4 py-3 bg-slate-100 dark:bg-darkinput/50 border border-slate-200 dark:border-slate-700 rounded-2xl text-slate-500 dark:text-slate-400 text-sm outline-none cursor-not-allowed">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2">รหัสคอร์ส (Course Code)</label>
                            <input type="text" id="courseCode" placeholder="เช่น MATH101" class="w-full px-4 py-3 bg-slate-50 dark:bg-darkinput border border-slate-200 dark:border-slate-700 rounded-2xl dark:text-white text-sm outline-none focus:border-sky-500">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2">ราคา (บาท) <span class="text-red-500">*</span></label>
                            <input type="number" id="coursePrice" min="0" step="any" placeholder="0.00" class="w-full px-4 py-3 bg-slate-50 dark:bg-darkinput border border-slate-200 dark:border-slate-700 rounded-2xl dark:text-white text-sm outline-none focus:border-sky-500 font-bold">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2">ลิงก์รูปภาพปกคอร์ส (Cover Image URL)</label>
                        <input type="url" id="courseCoverImage" placeholder="https://example.com/image.jpg" class="w-full px-4 py-3 bg-slate-50 dark:bg-darkinput border border-slate-200 dark:border-slate-700 rounded-2xl dark:text-white text-xs outline-none focus:border-sky-500">
                    </div>

                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2">คำอธิบายรายละเอียดคอร์ส</label>
                        <textarea id="courseDescription" rows="5" placeholder="ระบุเนื้อหา สิ่งที่จะได้เรียนรู้ หรือรายละเอียดคอร์ส..." class="w-full px-4 py-3 bg-slate-50 dark:bg-darkinput border border-slate-200 dark:border-slate-700 rounded-2xl dark:text-white text-xs outline-none focus:border-sky-500 resize-none"></textarea>
                    </div>

                    <div class="flex gap-3 pt-2">
                        <button type="submit" id="submitBtn" disabled class="flex-1 bg-sky-600 hover:bg-sky-700 text-white py-3.5 rounded-2xl font-bold text-sm transition-all shadow-lg shadow-sky-500/20 flex items-center justify-center gap-2 opacity-50 cursor-not-allowed">
                            <i class="fas fa-floppy-disk"></i> บันทึกข้อมูลคอร์ส
                        </button>
                        <button type="button" onclick="resetForm()" class="px-5 py-3.5 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 rounded-2xl font-bold text-sm hover:bg-slate-200 transition-all">
                            ยกเลิก
                        </button>
                    </div>
                </form>
            </div>

            <!-- รายการคอร์สทั้งหมดที่มีในระบบ (ชา) -->
            <div class="lg:col-span-7 space-y-5">
                <div class="modern-card p-6 rounded-3xl flex justify-between items-center">
                    <h3 class="font-bold text-lg text-slate-900 dark:text-white flex items-center gap-3">
                        <span class="w-10 h-10 rounded-xl bg-slate-100 dark:bg-slate-800 text-sky-600 flex items-center justify-center text-sm"><i class="fas fa-list"></i></span>
                        รายการคอร์สทั้งหมดในระบบ
                    </h3>
                    <div class="relative w-48 sm:w-64">
                        <i class="fas fa-search absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                        <input type="text" id="searchInput" oninput="renderCoursesList()" placeholder="ค้นหาคอร์ส..." class="w-full pl-9 pr-4 py-2 bg-slate-50 dark:bg-darkinput border border-slate-200 dark:border-slate-700 rounded-xl text-xs text-slate-800 dark:text-white focus:outline-none focus:border-sky-500">
                    </div>
                </div>

                <div id="adminCoursesList" class="space-y-4">
                    <div class="modern-card p-12 rounded-3xl text-center text-slate-400">
                        <i class="fas fa-spinner fa-spin text-3xl mb-3 text-sky-600"></i>
                        <p class="text-sm font-medium">กำลังโหลดคอร์สเรียน...</p>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allCoursesData = [];

        // Theme Toggle
        const htmlElement = document.documentElement;
        const themeIcon = document.getElementById('themeIcon');
        if (localStorage.getItem('theme') === 'dark') {
            htmlElement.classList.add('dark');
            themeIcon.classList.replace('fa-moon', 'fa-sun');
        }
        document.getElementById('themeToggle').addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            const isDark = htmlElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeIcon.classList.replace(isDark ? 'fa-moon' : 'fa-sun', isDark ? 'fa-sun' : 'fa-moon');
        });

        async function initPage() {
            await fetchAllCourses();
        }

        async function fetchAllCourses() {
            const { data: courses, error } = await mySupabase.from('courses').select('*').order('created_at', { ascending: false });
            
            if (error || !courses) {
                document.getElementById('adminCoursesList').innerHTML = `<div class="modern-card p-12 rounded-3xl text-center text-slate-400">ไม่สามารถโหลดข้อมูลคอร์สได้</div>`;
                return;
            }

            allCoursesData = courses;
            renderCoursesList();
        }

        function renderCoursesList() {
            const container = document.getElementById('adminCoursesList');
            const keyword = document.getElementById('searchInput').value.toLowerCase().trim();

            const filtered = allCoursesData.filter(c => {
                const title = (c.title || c.name || '').toLowerCase();
                const code = (c.course_code || '').toLowerCase();
                return title.includes(keyword) || code.includes(keyword);
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="modern-card p-12 rounded-3xl text-center text-slate-400">
                        <i class="fas fa-folder-open text-3xl mb-3 text-sky-500"></i>
                        <h4 class="text-base font-bold text-slate-700 dark:text-slate-200 mb-1">ไม่พบคอร์สเรียน</h4>
                        <p class="text-xs text-slate-400">ยังไม่มีคอร์สเรียนในระบบ หรือไม่ตรงกับคำค้นหา</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(c => {
                const title = c.title || c.name || 'คอร์สเรียนไม่มีชื่อ';
                const code = c.course_code ? `รหัส: ${c.course_code}` : 'ไม่มีรหัสคอร์ส';
                const price = c.price !== null && c.price !== undefined ? `฿${Number(c.price).toLocaleString()}` : 'ยังไม่ระบุราคา';
                const desc = c.description || c.detail || 'ยังไม่มีคำอธิบายรายละเอียดคอร์ส...';
                const coverImg = c.cover_image || c.image_url || 'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=600&auto=format&fit=crop&q=60';

                return `
                    <div class="modern-card p-6 rounded-3xl flex flex-col sm:flex-row items-center gap-5 justify-between group hover:border-sky-500/50 transition-all">
                        <div class="flex items-center gap-4 w-full sm:w-auto">
                            <img src="${coverImg}" class="w-20 h-20 rounded-2xl object-cover shrink-0 border border-slate-200 dark:border-slate-700">
                            <div class="min-w-0 space-y-1">
                                <div class="flex items-center gap-2 flex-wrap">
                                    <span class="px-2.5 py-0.5 bg-sky-500/10 text-sky-600 dark:text-sky-400 rounded-lg text-[10px] font-bold">${code}</span>
                                    <span class="px-2.5 py-0.5 bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 rounded-lg text-[10px] font-bold">${price}</span>
                                </div>
                                <h4 class="font-bold text-base text-slate-900 dark:text-white truncate">${title}</h4>
                                <p class="text-xs text-slate-500 dark:text-slate-400 line-clamp-1">${desc}</p>
                            </div>
                        </div>
                        <button onclick="selectCourseToEdit('${c.id}')" class="w-full sm:w-auto px-5 py-2.5 bg-sky-600 hover:bg-sky-700 text-white rounded-xl text-xs font-bold transition shadow-md shadow-sky-500/20 shrink-0">
                            <i class="fas fa-pen-to-square mr-1"></i> จัดการราคาและรายละเอียด
                        </button>
                    </div>
                `;
            }).join('');
        }

        function selectCourseToEdit(courseId) {
            const course = allCoursesData.find(c => c.id === courseId);
            if (!course) return;

            document.getElementById('editCourseId').value = course.id;
            document.getElementById('courseTitle').value = course.title || course.name || '';
            document.getElementById('courseCode').value = course.course_code || '';
            document.getElementById('coursePrice').value = course.price !== null && course.price !== undefined ? course.price : '';
            document.getElementById('courseCoverImage').value = course.cover_image || course.image_url || '';
            document.getElementById('courseDescription').value = course.description || course.detail || '';
            
            document.getElementById('formTitle').textContent = `กำลังแก้ไข: ${course.title || course.name || 'คอร์ส'}`;
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = false;
            submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function handleCourseDetailSubmit(e) {
            e.preventDefault();
            const courseId = document.getElementById('editCourseId').value;
            if (!courseId) return;

            const courseCode = document.getElementById('courseCode').value.trim();
            const price = parseFloat(document.getElementById('coursePrice').value) || 0;
            const coverImage = document.getElementById('courseCoverImage').value.trim();
            const description = document.getElementById('courseDescription').value.trim();

            Swal.fire({ title: 'กำลังบันทึกข้อมูล...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            // อัปเดตข้อมูลลงตาราง courses (รองรับชื่อฟิลด์ทั้งแบบมาตรฐานและแบบสำรอง)
            const payload = {
                course_code: courseCode,
                price: price,
                cover_image: coverImage,
                description: description
            };

            const { error } = await mySupabase.from('courses').update(payload).eq('id', courseId);

            if (error) {
                Swal.fire('เกิดข้อผิดพลาด', error.message, 'error');
                return;
            }

            Swal.fire({
                icon: 'success',
                title: 'บันทึกสำเร็จ!',
                text: 'อัปเดตราคาและรายละเอียดคอร์สเรียบร้อยแล้ว',
                timer: 1500,
                showConfirmButton: false
            });

            resetForm();
            fetchAllCourses();
        }

        function resetForm() {
            document.getElementById('courseDetailForm').reset();
            document.getElementById('editCourseId').value = '';
            document.getElementById('courseTitle').value = '';
            document.getElementById('formTitle').textContent = 'แก้ไขรายละเอียดคอร์ส';
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
        }

        function goBack() {
            window.location.href = 'admin.html';
        }

        initPage();
    </script>
</body>
</html>
