name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ถ้าเป็นโปรเจกต์ HTML/JS/CSS ธรรมดา (ไม่มีขั้น build) ให้ชี้ path เป็น "."
      # ถ้ามีขั้น build (เช่น Vite/Next/Astro) ให้รัน npm run build แล้วชี้ path เป็น "./dist" หรือ "./out"
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
