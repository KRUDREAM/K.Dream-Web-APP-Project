name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ] # หรือ branch ที่คุณใช้ deploy

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 🪄 ขั้นตอนนี้สำคัญ: สร้างไฟล์ config.js จาก GitHub Secret อัตโนมัติก่อน Deploy!
      - name: Inject API Key from Secret
        run: |
          echo "const CONFIG = { GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}' };" > config.js

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        # (หรือ Action อื่นๆ ที่คุณใช้ deploy เว็บอยู่แล้ว)
