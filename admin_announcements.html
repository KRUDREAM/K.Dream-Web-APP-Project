    <!-- STRICT ADMIN AUTH GUARD -->
    <script>
        (function() {
            let hasSession = false;
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith('sb-') && key.endsWith('-auth-token')) {
                    const val = localStorage.getItem(key);
                    if (val && val.includes('access_token')) {
                        hasSession = true;
                        break;
                    }
                }
            }
            const userRole = localStorage.getItem('role') || localStorage.getItem('user_role');
            const fallbackId = localStorage.getItem('id') || localStorage.getItem('admin_id') || localStorage.getItem('user_id');
            
            if ((!hasSession && !fallbackId) || userRole === 'student') {
                localStorage.removeItem('role');
                window.location.replace('index.html');
            }
        })();
    </script>

                    <div>

                            <option value="specific">👤 รายบุคคล (ระบุรหัสหรือชื่อนักเรียน)</option>

                    <div class="flex gap-3 pt-2">

                            <i class="fas fa-paper-plane"></i> โพสต์ประกาศ
                        </button>
                        <button type="button" id="cancelEditBtn" onclick="resetForm()" class="hidden px-6 py-3.5 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 rounded-2xl font-bold text-sm hover:bg-slate-200 transition-all">
                            ยกเลิก
                        </button>
                    </div>
                </form>
            </div>

            <!-- ฝั่งขวา: Feed ประกาศทั้งหมด -->
            <div id="feedSection" class="lg:col-span-7 space-y-5">
                <div class="flex justify-between items-center modern-card p-6 rounded-3xl">
                    <h3 class="font-bold text-lg text-slate-900 dark:text-white flex items-center gap-3">
                        <span class="w-10 h-10 rounded-xl bg-slate-100 dark:bg-slate-800 text-sky-600 flex items-center justify-center text-sm"><i class="fas fa-history"></i></span>
                        ประวัติประกาศทั้งหมด
                    </h3>
                    <span id="annCount" class="text-xs bg-sky-50 dark:bg-sky-950/80 text-sky-600 dark:text-sky-300 px-4 py-2 rounded-xl font-bold border border-sky-100 dark:border-sky-900/50">0 รายการ</span>
                </div>

                <div id="announcementFeed" class="space-y-4">
                    <div class="modern-card p-12 rounded-3xl text-center text-slate-400">
                        <i class="fas fa-spinner fa-spin text-3xl mb-3 text-sky-600"></i>
                        <p class="text-sm font-medium">กำลังโหลดประวัติประกาศ...</p>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Modal สำหรับขยายดูรูปภาพ -->
    <div id="imageModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4" onclick="closeImageModal()">

    <script>
        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let userRole = 'admin';

        const htmlElement = document.documentElement;
        const themeIcon = document.getElementById('themeIcon');
        if (localStorage.getItem('theme') === 'dark') {
            htmlElement.classList.add('dark');
            themeIcon.classList.replace('fa-moon', 'fa-sun');
        }
        document.getElementById('themeToggle').addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            const isDark = htmlElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeIcon.classList.replace(isDark ? 'fa-moon' : 'fa-sun', isDark ? 'fa-sun' : 'fa-moon');
        });

        async function initPage() {
            userRole = localStorage.getItem('role') || localStorage.getItem('user_role') || 'admin';
            if (userRole === 'student') {
                window.location.replace('index.html');
                return;
            }
            loadAnnouncements();
        }

        function goBack() {
            window.location.href = 'admin.html';
        }

        function handleTargetTypeChange() {
            const val = document.getElementById('targetType').value;
            const container = document.getElementById('targetValueContainer');
            const input = document.getElementById('targetValue');
            const help = document.getElementById('targetHelpText');

            if (val === 'all') {
                container.classList.add('hidden');
                input.value = '';
            } else {
                container.classList.remove('hidden');
                if (val === 'level') {
                    input.placeholder = 'ระบุระดับชั้น เช่น ม.1, ม.2, ม.3';
                    help.textContent = 'ระบุชั้นที่ต้องการให้เห็นประกาศนี้';
                } else if (val === 'course') {
                    input.placeholder = 'ระบุชื่อหรือรหัสคอร์สเรียน';
                    help.textContent = 'ระบุคอร์สที่เกี่ยวข้องกับประกาศ';
                } else if (val === 'specific') {
                    input.placeholder = 'รหัสประจำตัวนักเรียน (คั่นด้วย , หากมีหลายคน)';
                    help.textContent = 'ระบุเฉพาะเจาะจงรายบุคคล';
                }
            }
        }

        async function loadAnnouncements() {
            const { data: anns, error } = await mySupabase.from('announcements').select('*').order('created_at', { ascending: false });
            
            const feed = document.getElementById('announcementFeed');
            if (error || !anns || anns.length === 0) {
                feed.innerHTML = `
                    <div class="modern-card p-12 rounded-3xl text-center text-slate-400">
                        <div class="w-16 h-16 bg-sky-50 dark:bg-slate-800 text-sky-500 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl">
                            <i class="fas fa-bullhorn"></i>
                        </div>
                        <h4 class="text-base font-bold text-slate-700 dark:text-slate-200 mb-1">ยังไม่มีประกาศในระบบ</h4>
                        <p class="text-xs text-slate-400">ประกาศใหม่จะแสดงขึ้นที่นี่ทันทีเมื่อมีการโพสต์</p>
                    </div>
                `;
                document.getElementById('annCount').textContent = '0 รายการ';
                return;
            }

            document.getElementById('annCount').textContent = `${anns.length} รายการ`;

            feed.innerHTML = anns.map(a => {
                const dateStr = new Date(a.created_at).toLocaleString('th-TH', { dateStyle: 'medium', timeStyle: 'short' });
                const titleText = a.title || 'ประกาศจากทางโรงเรียน';

                // ป้ายบอกกลุ่มเป้าหมาย
                let targetBadge = '';
                if (a.target_type === 'level') {
                    targetBadge = `<span class="bg-purple-50 dark:bg-purple-950/80 text-purple-600 dark:text-purple-300 text-[10px] font-bold px-2.5 py-1 rounded-lg border border-purple-200 dark:border-purple-900"><i class="fas fa-layer-group mr-1"></i> ชั้น: ${a.target_value || 'ระบุระดับชั้น'}</span>`;
                } else if (a.target_type === 'course') {
                    targetBadge = `<span class="bg-amber-50 dark:bg-amber-950/80 text-amber-600 dark:text-amber-300 text-[10px] font-bold px-2.5 py-1 rounded-lg border border-amber-200 dark:border-amber-900"><i class="fas fa-book mr-1"></i> คอร์ส: ${a.target_value || 'ระบุคอร์ส'}</span>`;
                } else if (a.target_type === 'specific') {
                    targetBadge = `<span class="bg-rose-50 dark:bg-rose-950/80 text-rose-600 dark:text-rose-300 text-[10px] font-bold px-2.5 py-1 rounded-lg border border-rose-200 dark:border-rose-900"><i class="fas fa-user mr-1"></i> รายบุคคล</span>`;
                } else {
                    targetBadge = `<span class="bg-sky-50 dark:bg-sky-950/80 text-sky-600 dark:text-sky-300 text-[10px] font-bold px-2.5 py-1 rounded-lg border border-sky-200 dark:border-sky-900"><i class="fas fa-globe mr-1"></i> ทุกคน</span>`;
                }

                let attachmentsHtml = '';
                if (a.attachments && Array.isArray(a.attachments) && a.attachments.length > 0) {
                    let filesList = a.attachments.map((url, idx) => {
                        const isImage = /\.(jpg|jpeg|png|gif|webp)$/i.test(url);
                        if (isImage) {
                            return `
                                <div class="relative group/img overflow-hidden rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-100 dark:bg-darkinput cursor-pointer shadow-sm" onclick="openImageModal('${url}')">
                                    <img src="${url}" class="w-full h-40 object-cover group-hover/img:scale-105 transition-transform duration-300">
                                    <div class="absolute inset-0 bg-black/40 opacity-0 group-hover/img:opacity-100 transition-opacity flex items-center justify-center text-white text-xs font-bold gap-1.5">
                                        <i class="fas fa-magnifying-glass-plus text-base"></i> คลิกเพื่อดูรูปใหญ่
                                    </div>
                                </div>`;
                        } else {
                            return `<a href="${url}" target="_blank" class="flex items-center gap-2 p-3.5 bg-slate-50 dark:bg-darkinput rounded-2xl border border-slate-200 dark:border-slate-700 text-xs font-semibold text-sky-600 hover:underline shadow-sm"><i class="fas fa-file-arrow-down text-base text-sky-500"></i> ไฟล์แนบ ${idx + 1}</a>`;
                        }
                    }).join('');
                    attachmentsHtml = `<div class="mt-4 grid grid-cols-1 sm:grid-cols-2 gap-3">${filesList}</div>`;
                }

                const safeTitle = (a.title || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
                const safeContent = (a.content || '').replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/\r?\n/g, '\\n');

                return `
                    <div class="modern-card p-7 rounded-3xl relative overflow-hidden group">
                        <div class="absolute top-0 left-0 w-2.5 h-full bg-gradient-to-b from-sky-500 to-indigo-600"></div>
                        <div class="flex justify-between items-start mb-4 pl-3">
                            <div>
                                <div class="flex items-center gap-2 mb-1">
                                    <h4 class="font-bold text-lg text-slate-900 dark:text-white">${titleText}</h4>
                                    ${targetBadge}
                                </div>
                                <span class="text-xs font-medium text-slate-400 flex items-center gap-1.5"><i class="far fa-clock"></i> ${dateStr}</span>
                            </div>
                            <div class="flex gap-2">
                                <button type="button" onclick="prepareEdit('${a.id}', '${safeTitle}', '${safeContent}', '${a.target_type || 'all'}', '${a.target_value || ''}')" class="action-btn-edit px-3.5 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-sm cursor-pointer">
                                    <i class="fas fa-pen-to-square"></i> แก้ไข
                                </button>
                                <button type="button" onclick="deleteAnnouncement('${a.id}')" class="action-btn-delete px-3.5 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-sm cursor-pointer">
                                    <i class="fas fa-trash-can"></i> ลบ
                                </button>
                            </div>
                        </div>
                        <div class="pl-3">
                            <div class="text-slate-700 dark:text-slate-200 text-sm whitespace-pre-line leading-relaxed bg-slate-50 dark:bg-darkinput/60 p-5 rounded-2xl border border-slate-200 dark:border-slate-800">${a.content}</div>
                            ${attachmentsHtml}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openImageModal(url) {
            document.getElementById('modalImg').src = url;
            document.getElementById('imageModal').classList.remove('hidden');
        }

        function closeImageModal() {
            document.getElementById('imageModal').classList.add('hidden');
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const editId = document.getElementById('editAnnouncementId').value;
            const title = document.getElementById('annTitle').value;
            const content = document.getElementById('annContent').value;
            const targetType = document.getElementById('targetType').value;
            const targetValue = document.getElementById('targetValue').value;
            const fileInput = document.getElementById('annFiles');

            if (fileInput.files.length > 5) {
                Swal.fire('จำกัดจำนวนไฟล์', 'แนบไฟล์ได้สูงสุดไม่เกิน 5 ไฟล์ครับ', 'warning');
                return;
            }

            Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            let attachmentUrls = [];
            if (fileInput.files.length > 0) {
                for (let i = 0; i < fileInput.files.length; i++) {
                    const file = fileInput.files[i];
                    const cleanFileName = file.name.replace(/[^a-zA-Z0-9_.-]/g, '_');
                    const fileName = `ann_${Date.now()}_${i}_${cleanFileName}`;
                    
                    const { error: uploadError } = await mySupabase.storage.from('announcement_files').upload(fileName, file);
                    if (!uploadError) {
                        const { data } = mySupabase.storage.from('announcement_files').getPublicUrl(fileName);
                        if (data && data.publicUrl) {
                            attachmentUrls.push(data.publicUrl);
                        }
                    }
                }
            }

            let payload = { title, content, target_type: targetType, target_value: targetValue };
            if (attachmentUrls.length > 0) {
                payload.attachments = attachmentUrls;
            }

            if (editId) {
                if (attachmentUrls.length === 0) {
                    delete payload.attachments; 
                }
                const { error } = await mySupabase.from('announcements').update(payload).eq('id', editId);
                if (error) {
                    Swal.fire('เกิดข้อผิดพลาด', error.message, 'error');
                    return;
                }
                Swal.fire({ icon: 'success', title: 'แก้ไขประกาศสำเร็จ', timer: 1500, showConfirmButton: false });
            } else {
                const { error } = await mySupabase.from('announcements').insert([payload]);
                if (error) {
                    Swal.fire('เกิดข้อผิดพลาด', error.message, 'error');
                    return;
                }
                await mySupabase.from('notifications').insert([{ type: 'announcement', message: `${title}: ${content.substring(0, 50)}...` }]);
                Swal.fire({ icon: 'success', title: 'โพสต์ประกาศสำเร็จ', timer: 1500, showConfirmButton: false });
            }

            resetForm();
            loadAnnouncements();
        }

        function prepareEdit(id, title, content, targetType, targetValue) {
            document.getElementById('editAnnouncementId').value = id;
            document.getElementById('annTitle').value = title;
            document.getElementById('annContent').value = content.replace(/\\n/g, '\n');
            document.getElementById('targetType').value = targetType;
            handleTargetTypeChange();
            document.getElementById('targetValue').value = targetValue !== 'undefined' ? targetValue : '';
            document.getElementById('formTitle').textContent = 'แก้ไขประกาศ';
            document.getElementById('cancelEditBtn').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('announcementForm').reset();
            document.getElementById('editAnnouncementId').value = '';
            document.getElementById('formTitle').textContent = 'สร้างประกาศใหม่';
            document.getElementById('cancelEditBtn').classList.add('hidden');
            handleTargetTypeChange();
        }

        async function deleteAnnouncement(id) {
            const res = await Swal.fire({
                title: 'ลบประกาศนี้?',
                text: 'การกระทำนี้จะไม่สามารถกู้คืนได้',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                confirmButtonText: 'ใช่, ลบเลย',
                cancelButtonText: 'ยกเลิก'
            });

            if (res.isConfirmed) {
                await mySupabase.from('announcements').delete().eq('id', id);
                Swal.fire({ icon: 'success', title: 'ลบเรียบร้อย', timer: 1200, showConfirmButton: false });
                loadAnnouncements();
            }
        }

        initPage();
    </script>
</body>
</html>
