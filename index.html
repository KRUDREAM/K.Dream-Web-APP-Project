<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <script src="lms_core.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRUDREAM LAND | เข้าสู่ระบบระบบการเรียนการสอน - ครูดรีม</title>
    
    <!-- เชื่อมโยง Web App Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- โลโก้ไอคอนสำหรับเว็บแอป (Favicon & Mobile App Icon) -->
    <link rel="icon" type="image/jpeg" sizes="512x512" href="logo.jpg">
    <link rel="apple-touch-icon" href="logo.jpg">
    
    <!-- แก้ไขตามคำเตือน Console เรื่อง Meta Tag -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="LMS ครูดรีม">

    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { 
                extend: { 
                    fontFamily: { sans: ['Prompt', 'sans-serif'] }, 
                    colors: { primary: '#1d4ed8', secondary: '#3b82f6', lightbg: '#f8fafc', darkbg: '#0f172a', darkbox: '#1e293b' } 
                } 
            }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(16px); border: 1px solid rgba(226, 232, 240, 0.8); }
        .dark .glass-card { background: rgba(30, 41, 59, 0.85); border: 1px solid rgba(51, 65, 85, 0.8); }
        div:where(.swal2-container) { font-family: 'Prompt', sans-serif; }
        .dark .swal2-popup { background-color: #1e293b !important; color: #f8fafc !important; border: 1px solid #334155 !important; }
    </style>
</head>
<body class="bg-lightbg dark:bg-darkbg min-h-screen flex flex-col justify-between transition-colors duration-300">

    <!-- แบนเนอร์จำลองปุ่ม GET ด้านบนสุดของหน้าเว็บ -->
    <div id="pwaBanner" class="hidden bg-blue-600 text-white px-4 py-2.5 flex items-center justify-between shadow-lg sticky top-0 z-50 transition-all">
        <div class="flex items-center gap-3">
            <img src="logo.jpg" alt="Logo" class="w-9 h-9 rounded-xl object-cover bg-white border border-white/20 shadow">
            <div>
                <p class="font-bold text-xs sm:text-sm">KRUDREAM Online Platform</p>
                <p class="text-[11px] text-blue-100">ติดตั้งแอปเพื่อการใช้งานที่รวดเร็วยิ่งขึ้น</p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <button id="bannerInstallBtn" class="bg-white text-blue-600 font-bold px-4 py-1.5 rounded-full shadow-md text-xs sm:text-sm hover:bg-blue-50 transition transform hover:scale-105">
                GET
            </button>
            <button id="closeBannerBtn" class="text-white/80 hover:text-white p-1 text-sm">
                <i class="fas fa-times"></i>
            </button>
        </div>
    </div>

    <!-- ส่วนเนื้อหาหลัก (จัดให้อยู่ตรงกลางหน้าจอ) -->
    <div class="flex-1 flex items-center justify-center p-4">
        <div class="glass-card w-full max-w-md p-8 rounded-3xl shadow-xl relative overflow-hidden">
            <div class="absolute -top-24 -right-24 w-48 h-48 bg-blue-400/20 rounded-full blur-2xl pointer-events-none"></div>

            <div class="text-center mb-8">
                <div class="w-20 h-20 mx-auto mb-4 rounded-2xl overflow-hidden shadow-lg shadow-blue-500/30 border-2 border-blue-500/30 flex items-center justify-center bg-white">
                    <img src="logo.jpg" alt="Logo ครูดรีม" class="w-full h-full object-cover">
                </div>
                <h1 class="text-2xl font-bold text-gray-800 dark:text-white">KRUDREAM Online Platform</h1>
                <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">เข้าสู่ระบบด้วย Username ของคุณ</p>
            </div>

            <form id="loginForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">Username</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-400"><i class="fas fa-user"></i></span>
                        <input type="text" id="username" required placeholder="กรอก username ของคุณ" class="w-full pl-11 pr-4 py-3 bg-slate-50 dark:bg-slate-800 border border-gray-200 dark:border-gray-700 rounded-xl dark:text-white focus:ring-2 focus:ring-primary outline-none transition-all text-sm font-bold">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">รหัสผ่าน (Password)</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-400"><i class="fas fa-lock"></i></span>
                        <input type="password" id="password" required placeholder="••••••••" class="w-full pl-11 pr-4 py-3 bg-slate-50 dark:bg-slate-800 border border-gray-200 dark:border-gray-700 rounded-xl dark:text-white focus:ring-2 focus:ring-primary outline-none transition-all text-sm">
                    </div>
                </div>

                <div class="flex items-center justify-between text-sm">
                    <label class="flex items-center gap-2 cursor-pointer text-gray-600 dark:text-gray-300 select-none">
                        <input type="checkbox" id="rememberMe" class="w-4 h-4 text-primary bg-slate-50 dark:bg-slate-800 border-gray-300 dark:border-gray-700 rounded focus:ring-primary">
                        <span>จดจำฉันไว้ในระบบ</span>
                    </label>
                </div>

                <button type="submit" class="w-full bg-primary hover:bg-blue-800 text-white py-3.5 rounded-xl font-bold text-base transition-all shadow-lg shadow-blue-600/20 hover:shadow-blue-600/40 transform hover:-translate-y-0.5">
                    เข้าสู่ระบบ <i class="fas fa-arrow-right ml-2"></i>
                </button>
            </form>

            <div class="mt-6 text-center space-y-2 text-xs text-gray-400">
                <div>
                    <a href="javascript:void(0);" onclick="openPrivacyPolicyModal()" class="text-blue-600 dark:text-blue-400 hover:underline font-semibold">
                        <i class="fas fa-shield-alt mr-1"></i> นโยบายความเป็นส่วนตัว (Privacy Policy)
                    </a>
                </div>
                <div>
                    ระบบบริหารจัดการการเรียนการสอนออนไลน์ &copy; 2026
                </div>
            </div>
        </div>
    </div>

    <!-- ปุ่มลอยสำหรับติดตั้งเว็บแอป (Install Web App) และเปลี่ยนธีม -->
    <div class="fixed bottom-6 right-6 flex flex-col gap-3 z-50">
        <button id="installAppBtn" class="w-12 h-12 rounded-full bg-blue-600 hover:bg-blue-700 text-white shadow-lg border border-blue-400 flex items-center justify-center hover:scale-110 transition-transform cursor-pointer hidden" title="ติดตั้งเว็บแอป">
            <i class="fas fa-download text-lg"></i>
        </button>
        
        <button id="themeToggle" class="w-12 h-12 rounded-full bg-white dark:bg-darkbox shadow-lg border border-gray-200 dark:border-gray-700 flex items-center justify-center text-gray-600 dark:text-gray-300 hover:scale-110 transition-transform cursor-pointer" title="สลับโหมดสว่าง/มืด">
            <i class="fas fa-moon text-lg" id="themeIcon"></i>
        </button>
    </div>

    <script>
        // ลงทะเบียน Service Worker เพื่อรองรับ PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker registered!', reg))
                    .catch(err => console.log('Service Worker registration failed', err));
            });
        }

        const htmlElement = document.documentElement;
        const themeIcon = document.getElementById('themeIcon');
        if (localStorage.getItem('theme') === 'dark') {
            htmlElement.classList.add('dark');
            themeIcon.classList.replace('fa-moon', 'fa-sun');
        }
        document.getElementById('themeToggle').addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            const isDark = htmlElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeIcon.classList.replace(isDark ? 'fa-moon' : 'fa-sun', isDark ? 'fa-sun' : 'fa-moon');
        });

        // เติม Username ที่จดจำไว้ (ถ้ามี)
        window.addEventListener('DOMContentLoaded', () => {
            const rememberedUser = localStorage.getItem('remembered_username');
            if (rememberedUser) {
                document.getElementById('username').value = rememberedUser;
                document.getElementById('rememberMe').checked = true;
            }
        });

        function openPrivacyPolicyModal() {
            const isDark = document.documentElement.classList.contains('dark');
            Swal.fire({
                title: `<span class="text-base sm:text-lg font-extrabold text-sky-700 dark:text-sky-400 flex items-center justify-center gap-2"><i class="fas fa-shield-alt"></i> นโยบายความเป็นส่วนตัว (Privacy Policy)</span>`,
                html: `
                    <div class="space-y-3 text-left text-xs sm:text-sm max-h-[60vh] overflow-y-auto pr-2">
                        <p class="text-slate-600 dark:text-slate-300 font-light">
                            เว็บไซต์ <strong>KRUDREAM LAND</strong> ให้ความสำคัญกับการคุ้มครองข้อมูลส่วนบุคคลของคุณ เพื่อความโปร่งใสในการใช้งานระบบการเรียนการสอนออนไลน์ เราจึงขอแจ้งนโยบายการเก็บรวบรวมและใช้ข้อมูลดังต่อไปนี้:
                        </p>
                        <div class="space-y-2">
                            <div class="p-3 bg-sky-50 dark:bg-darkinput rounded-xl border border-sky-500/20 space-y-1">
                                <h4 class="font-extrabold text-sky-600 dark:text-sky-400"><i class="fas fa-database mr-1"></i> 1. ข้อมูลที่เราจัดเก็บ</h4>
                                <p class="text-slate-600 dark:text-slate-300 font-light">ข้อมูลส่วนตัว (ชื่อ-นามสกุล, ชื่อเล่น, ระดับชั้น, โรงเรียน, LINE ID), ข้อมูลการเข้าสู่ระบบ, ผลคะแนนสอบ และประวัติการทำกิจกรรมในระบบ</p>
                            </div>
                            <div class="p-3 bg-sky-50 dark:bg-darkinput rounded-xl border border-sky-500/20 space-y-1">
                                <h4 class="font-extrabold text-sky-600 dark:text-sky-400"><i class="fas fa-bullseye mr-1"></i> 2. วัตถุประสงค์ในการเก็บข้อมูล</h4>
                                <p class="text-slate-600 dark:text-slate-300 font-light">ใช้สำหรับการจัดการเรียนการสอน, ตรวจสอบสิทธิ์เข้าคอร์ส, บันทึกผลคะแนนสอบ, ประมวลผลสถิติพัฒนาการการเรียนรู้ และการสะสม Token เพื่อแลกรางวัล</p>
                            </div>
                            <div class="p-3 bg-sky-50 dark:bg-darkinput rounded-xl border border-sky-500/20 space-y-1">
                                <h4 class="font-extrabold text-sky-600 dark:text-sky-400"><i class="fas fa-lock mr-1"></i> 3. ความปลอดภัยของข้อมูล</h4>
                                <p class="text-slate-600 dark:text-slate-300 font-light">ข้อมูลทั้งหมดถูกจัดเก็บไว้อย่างปลอดภัยผ่านระบบฐานข้อมูลที่มีมาตรฐาน (Supabase) และไม่มีการนำไปเผยแพร่หรือจำหน่ายให้แก่บุคคลภายนอกเด็ดขาด</p>
                            </div>
                        </div>
                    </div>
                `,
                confirmButtonText: 'รับทราบและปิด',
                confirmButtonColor: '#0284c7',
                width: '600px',
                background: isDark ? '#090d16' : '#ffffff',
                color: isDark ? '#f1f5f9' : '#1e293b',
                customClass: { popup: 'rounded-3xl shadow-2xl' }
            });
        }

        let deferredPrompt;
        const installBtn = document.getElementById('installAppBtn');
        const banner = document.getElementById('pwaBanner');
        const bannerInstallBtn = document.getElementById('bannerInstallBtn');
        const closeBannerBtn = document.getElementById('closeBannerBtn');

        window.addEventListener('DOMContentLoaded', () => {
            installBtn.classList.remove('hidden');
            if (!localStorage.getItem('closed_pwa_banner')) {
                banner.classList.remove('hidden');
            }
        });

        closeBannerBtn.addEventListener('click', () => {
            banner.classList.add('hidden');
            localStorage.setItem('closed_pwa_banner', 'true');
        });

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        function isIOS() {
            return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        }

        async function triggerInstall() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                deferredPrompt = null;
            } else if (isIOS()) {
                const isDark = document.documentElement.classList.contains('dark');
                Swal.fire({
                    title: '<span class="font-bold text-blue-600 dark:text-blue-400">📱 วิธีติดตั้งแอปบน iPhone / iPad</span>',
                    html: `
                        <div class="text-left text-xs sm:text-sm space-y-3 text-gray-600 dark:text-gray-300">
                            <p class="font-semibold text-primary">เนื่องจากข้อจำกัดของระบบ iOS ให้ทำตาม 2 ขั้นตอนง่ายๆ นี้ครับ:</p>
                            <div class="p-3 bg-blue-50 dark:bg-slate-800 rounded-xl border border-blue-500/25 space-y-2">
                                <p><strong>ขั้นตอนที่ 1:</strong> มองหาแถบเมนูด้านล่างของ Safari แล้วแตะปุ่ม <strong>แชร์ (Share <i class="fas fa-arrow-up-from-bracket"></i>)</strong></p>
                                <p><strong>ขั้นตอนที่ 2:</strong> เลื่อนหาเมนูแล้วเลือกคำว่า <strong>"เพิ่มไปยังหน้าจอโฮม" (Add to Home Screen <i class="fas fa-plus-square"></i>)</strong></p>
                            </div>
                            <p class="text-xs text-gray-400 text-center">เพียงเท่านี้ไอคอนแอปจะไปปรากฏบนหน้าจอหลักของคุณทันทีครับ!</p>
                        </div>
                    `,
                    confirmButtonText: 'เข้าใจแล้ว',
                    confirmButtonColor: '#1d4ed8',
                    background: isDark ? '#1e293b' : '#ffffff',
                    color: isDark ? '#f8fafc' : '#1e293b',
                    customClass: { popup: 'rounded-3xl shadow-2xl' }
                });
            } else {
                const isDark = document.documentElement.classList.contains('dark');
                Swal.fire({
                    title: '<span class="font-bold text-blue-600 dark:text-blue-400">📲 วิธีติดตั้งเว็บแอป</span>',
                    html: `
                        <div class="text-left text-xs sm:text-sm space-y-3 text-gray-600 dark:text-gray-300">
                            <p><strong>🤖 สำหรับ Android (Chrome):</strong> แตะเมนูจุดสามจุด (⋮) ที่มุมขวาบน แล้วเลือก <strong>"ติดตั้งแอป"</strong></p>
                            <p><strong>💻 สำหรับคอมพิวเตอร์:</strong> สังเกตไอคอนติดตั้งที่มุมขวาของช่องกรอก URL (Address Bar)</p>
                        </div>
                    `,
                    confirmButtonText: 'เข้าใจแล้ว',
                    confirmButtonColor: '#1d4ed8',
                    background: isDark ? '#1e293b' : '#ffffff',
                    color: isDark ? '#f8fafc' : '#1e293b',
                    customClass: { popup: 'rounded-3xl shadow-2xl' }
                });
            }
        }

        installBtn.addEventListener('click', triggerInstall);
        bannerInstallBtn.addEventListener('click', triggerInstall);

        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const userInput = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;

            Swal.fire({ title: 'กำลังตรวจสอบข้อมูล...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            const loginEmail = userInput.includes('@') ? userInput : `${userInput}@lms-system.com`;

            const { data: authData, error: authError } = await mySupabase.auth.signInWithPassword({ email: loginEmail, password });

            if (authError || !authData.user) {
                Swal.fire({ icon: 'error', title: 'เข้าสู่ระบบไม่สำเร็จ', text: 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง' });
                return;
            }

            const userId = authData.user.id;
            let { data: profile } = await mySupabase.from('profiles').select('*').eq('id', userId).maybeSingle();
            if (!profile) {
                const { data: studentData } = await mySupabase.from('students').select('*').eq('id', userId).maybeSingle();
                profile = studentData || { role: 'student' };
            }
            Swal.close();

            const userName = profile?.username || profile?.full_name || userInput;
            
            if (rememberMe) {
                localStorage.setItem('remembered_username', userInput);
            } else {
                localStorage.removeItem('remembered_username');
            }

            localStorage.setItem('id', userId);
            localStorage.setItem('student_id', userId);
            localStorage.setItem('user_id', userId);
            localStorage.setItem('student_username', userName);
            localStorage.setItem('full_name', userName);
            localStorage.setItem('profile', JSON.stringify(profile || {}));

            setTimeout(() => {
                const userRole = String(profile?.role || profile?.user_role || 'student').toLowerCase();
                if (userRole === 'teacher' || userRole === 'instructor') {
                    window.location.replace('teacher.html');
                } else if (userRole === 'admin' || userRole === 'exam_creator') {
                    window.location.replace('admin.html');
                } else {
                    window.location.replace('student.html');
                }
            }, 300);
        });
    </script>
</body>
</html>
