    <title>KRUDREAM LAND | เลือกดูคอร์สเรียนและแพ็กเกจทั้งหมด</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { 
                extend: { 
                    fontFamily: { sans: ['Prompt', 'sans-serif'] }, 
                    colors: { primary: '#0284c7', darkbg: '#090d16', darkbox: '#0f172a', darkinput: '#1e293b' } 
                } 
            }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .glass-nav { background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(226, 232, 240, 0.8); }

</head>
<body class="bg-slate-50 dark:bg-darkbg min-h-screen text-slate-900 dark:text-slate-100">

    <!-- Navigation -->
    <nav class="glass-nav fixed w-full top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-2xl bg-sky-600 text-white flex items-center justify-center font-black text-lg shadow-md">
                        <i class="fas fa-graduation-cap"></i>
                    </div>
                    <div>
                        <h1 class="font-extrabold text-lg text-slate-900 dark:text-white">KRUDREAM LAND</h1>
                        <p class="text-[10px] text-slate-500 dark:text-slate-400">คอร์สเรียนและแพ็กเกจคุณภาพ</p>
                    </div>
                </div>

                <div class="flex items-center gap-2 bg-slate-100 dark:bg-darkbox p-1.5 rounded-2xl border border-slate-200 dark:border-slate-800">
                    <a href="index2.html" class="px-4 py-1.5 rounded-xl text-xs font-bold text-slate-600 dark:text-slate-300 hover:text-sky-600 transition">
                        <i class="fas fa-home mr-1"></i> หน้าแรก
                    </a>
                    <a href="catalog.html" class="px-4 py-1.5 rounded-xl text-xs font-bold bg-sky-600 text-white shadow-sm">
                        <i class="fas fa-book-open mr-1"></i> แคตตาล็อกคอร์ส
                    </a>
                </div>

                <div class="flex items-center gap-3">
                    <button onclick="goToStudentPortal()" class="px-4 py-2 bg-sky-50 dark:bg-sky-950/50 text-sky-600 dark:text-sky-400 rounded-xl text-xs font-bold transition hover:bg-sky-100">
                        <i class="fas fa-user mr-1"></i> ระบบนักเรียน
                    </button>
                    <button id="themeToggle" class="w-10 h-10 flex items-center justify-center rounded-xl bg-white dark:bg-darkinput text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700">
                        <i class="fas fa-moon text-sm" id="themeIcon"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="pt-32 pb-8 px-4 text-center max-w-4xl mx-auto space-y-3">
        <span class="px-3 py-1 bg-sky-500/10 text-sky-600 dark:text-sky-400 rounded-full text-xs font-bold">📚 คอร์สเรียนทั้งหมด</span>
        <h2 class="text-3xl sm:text-4xl font-extrabold text-slate-900 dark:text-white">เลือกคอร์สที่ใช่ เพื่ออนาคตที่ดีกว่า</h2>
        <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400">รวบรวมคอร์สเรียนและแพ็กเกจคุณภาพ ออกแบบมาเพื่อการสอบเข้าและความเข้าใจที่แท้จริง</p>
    </header>

    <!-- Main Layout with Collapsible Left Announcement Sidebar -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-20 grid grid-cols-1 lg:grid-cols-12 gap-6 relative">
        
        <!-- Sidebar ซ้าย: ระบบประกาศ (ยุบ/ขยายได้) -->
        <aside id="announcementSidebar" class="lg:col-span-3 transition-sidebar space-y-4">
            <div class="modern-card p-5 rounded-3xl sticky top-28 space-y-4 shadow-xl border-amber-500/30 dark:border-amber-500/20 bg-gradient-to-b from-amber-500/[0.03] to-transparent">
                <div class="flex items-center justify-between border-b border-amber-500/20 pb-3">
                    <h3 class="font-extrabold text-sm text-slate-900 dark:text-white flex items-center gap-2">
                        <span class="w-7 h-7 rounded-xl bg-amber-500 text-white flex items-center justify-center text-xs shadow-md"><i class="fas fa-bullhorn"></i></span>
                        ประกาศสำคัญ
                        <span class="text-[10px] bg-amber-500 text-white px-2 py-0.5 rounded-full font-bold shadow-sm" id="announcementCount">0</span>
                    </h3>
                    <!-- ปุ่มหุบ/ซ่อน Sidebar -->
                    <button onclick="toggleAnnouncementSidebar()" class="w-8 h-8 rounded-xl bg-slate-100 dark:bg-darkinput text-slate-500 hover:text-amber-500 flex items-center justify-center transition shadow-sm" title="หุบช่องประกาศ">
                        <i class="fas fa-chevron-left text-xs" id="collapseIcon"></i>
                    </button>
                </div>
                
                <div id="announcementSidebarList" class="space-y-3 max-h-[60vh] overflow-y-auto pr-1">
                    <div class="text-center py-6 text-slate-400 text-xs">
                        <i class="fas fa-spinner fa-spin mr-1"></i> กำลังโหลดประกาศ...
                    </div>
                </div>
            </div>
        </aside>

        <!-- ปุ่มเปิด Sidebar กลับมา กรณีที่ถูกหุบไปแล้ว -->
        <button id="openSidebarBtn" onclick="toggleAnnouncementSidebar()" class="hidden fixed left-4 top-28 z-40 bg-amber-500 hover:bg-amber-600 text-white p-3 rounded-2xl shadow-xl transition items-center gap-2 font-bold text-xs">
            <i class="fas fa-bullhorn animate-bounce"></i> เปิดดูประกาศ (<span id="floatingAnnCount">0</span>)
        </button>

        <!-- Content ขวา: ค้นหา ตัวกรองราคา และรายการคอร์ส -->
        <section id="mainContentSection" class="lg:col-span-9 transition-sidebar space-y-6">
            
            <div class="modern-card p-4 rounded-3xl flex flex-col sm:flex-row gap-3 items-center justify-between shadow-sm">
                <div class="relative w-full sm:w-72">
                    <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="text" id="searchInput" oninput="renderCatalog()" placeholder="ค้นหาชื่อคอร์ส หรือรหัส..." class="w-full pl-11 pr-4 py-2.5 bg-white dark:bg-darkinput border border-slate-200 dark:border-slate-700 rounded-2xl text-xs text-slate-800 dark:text-white focus:outline-none focus:border-sky-500">
                </div>

                <div class="flex items-center gap-2 w-full sm:w-auto">
                    <select id="priceFilter" onchange="renderCatalog()" class="px-3 py-2.5 bg-white dark:bg-darkinput border border-slate-200 dark:border-slate-700 rounded-2xl text-xs font-bold text-slate-700 dark:text-slate-300 outline-none cursor-pointer flex-1 sm:flex-none">
                        <option value="all">ทุกช่วงราคา</option>
                        <option value="free">ฟรี</option>
                        <option value="under1000">ต่ำกว่า 1,000 บาท</option>
                        <option value="over1000">1,000 บาทขึ้นไป</option>
                    </select>

                    <select id="sortSelect" onchange="renderCatalog()" class="px-3 py-2.5 bg-white dark:bg-darkinput border border-slate-200 dark:border-slate-700 rounded-2xl text-xs font-bold text-slate-700 dark:text-slate-300 outline-none cursor-pointer flex-1 sm:flex-none">
                        <option value="newest">มาใหม่ล่าสุด</option>
                        <option value="price-asc">ราคา: ต่ำไปสูง</option>
                        <option value="price-desc">ราคา: สูงไปต่ำ</option>
                    </select>
                </div>
            </div>

            <!-- Tag Filters -->
            <div class="flex items-center gap-2 overflow-x-auto pb-2 scrollbar-none" id="tagFilterContainer">
                <button onclick="filterByTag('all')" id="tag-all" class="tag-btn px-4 py-2 bg-sky-600 text-white rounded-2xl text-xs font-bold shrink-0 transition shadow-md">✨ ทั้งหมด</button>
            </div>

            <!-- Catalog Grid -->
            <div id="catalogGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                <div class="modern-card p-12 rounded-3xl text-center text-slate-400 col-span-full">
                    <i class="fas fa-spinner fa-spin text-3xl mb-3 text-sky-600"></i>
                    <p class="text-sm font-medium">กำลังโหลดคอร์สเรียน...</p>
                </div>
            </div>

        </section>
    </main>

    <!-- Modal รายละเอียดประกาศ (เต็มจอ) -->
    <div id="announcementModal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="modern-card w-full max-w-xl rounded-3xl p-6 sm:p-8 shadow-2xl relative max-h-[90vh] overflow-y-auto space-y-4">
            <button onclick="closeAnnouncementModal()" class="absolute top-6 right-6 w-9 h-9 flex items-center justify-center rounded-xl bg-slate-100 dark:bg-darkinput text-slate-500 hover:text-red-500 transition z-10">
                <i class="fas fa-xmark"></i>
            </button>
            <div id="announcementModalContent" class="space-y-4"></div>
        </div>
    </div>

    <!-- Modal รายละเอียดคอร์ส -->
    <div id="courseModal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="modern-card w-full max-w-xl rounded-3xl p-6 sm:p-8 shadow-2xl relative max-h-[90vh] overflow-y-auto space-y-4">
            <button onclick="closeCourseModal()" class="absolute top-6 right-6 w-9 h-9 flex items-center justify-center rounded-xl bg-slate-100 dark:bg-darkinput text-slate-500 hover:text-red-500 transition z-10">
                <i class="fas fa-xmark"></i>
            </button>
            <div id="modalContent" class="space-y-4"></div>
        </div>
    </div>

    <!-- Gallery Modal -->
    <div id="galleryModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-darkbox w-full max-w-2xl rounded-3xl p-6 relative">
            <button onclick="closeGalleryModal()" class="absolute top-4 right-4 w-9 h-9 flex items-center justify-center rounded-xl bg-slate-100 dark:bg-darkinput text-slate-500 hover:text-red-500 transition z-10">
                <i class="fas fa-xmark"></i>
            </button>
            <h4 class="font-bold text-base mb-4 text-slate-900 dark:text-white" id="galleryTitle">รูปภาพทั้งหมดของคอร์ส</h4>
            <div id="galleryImagesGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-3 max-h-[70vh] overflow-y-auto"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allPackages = [];
        let allReviews = [];
        let siteAnnouncements = [];
        let enrolledCourseIds = [];
        let wishlistIds = JSON.parse(localStorage.getItem('wishlist_courses') || '[]');
        let activeTag = 'all';
        let currentStudentId = localStorage.getItem('student_id') || localStorage.getItem('id');
        let currentStudentName = 'นักเรียน';
        let isSidebarCollapsed = false;

        const htmlElement = document.documentElement;
        const themeIcon = document.getElementById('themeIcon');
        if (localStorage.getItem('theme') === 'dark') {
            htmlElement.classList.add('dark');
            themeIcon.classList.replace('fa-moon', 'fa-sun');
        }
        document.getElementById('themeToggle').addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            const isDark = htmlElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeIcon.classList.replace(isDark ? 'fa-moon' : 'fa-sun', isDark ? 'fa-sun' : 'fa-moon');
        });

        function toggleAnnouncementSidebar() {
            isSidebarCollapsed = !isSidebarCollapsed;
            const sidebar = document.getElementById('announcementSidebar');
            const mainSection = document.getElementById('mainContentSection');
            const openBtn = document.getElementById('openSidebarBtn');

            if (isSidebarCollapsed) {
                sidebar.classList.add('hidden');
                mainSection.className = 'lg:col-span-12 transition-sidebar space-y-6';
                openBtn.classList.remove('hidden');
                openBtn.classList.add('flex');
            } else {
                sidebar.classList.remove('hidden');
                mainSection.className = 'lg:col-span-9 transition-sidebar space-y-6';
                openBtn.classList.remove('flex');
                openBtn.classList.add('hidden');
            }
        }

        function goToStudentPortal() {
            window.location.href = currentStudentId ? `student_portal.html?student_id=${currentStudentId}` : 'student_portal.html';
        }

        async function fetchCatalogData() {
            if (currentStudentId) {
                const { data: profile } = await mySupabase.from('profiles').select('full_name, username').eq('id', currentStudentId).maybeSingle();
                if (profile) currentStudentName = profile.full_name || profile.username || 'นักเรียน';

                const { data: enData } = await mySupabase.from('course_enrollments').select('*').eq('student_id', currentStudentId);
                if (enData) {
                    enrolledCourseIds = enData.map(e => String(e.course_id || e.package_id || ''));
                }
            }

            const [pkgRes, reviewRes, annRes] = await Promise.all([
                mySupabase.from('course_packages').select('*').order('created_at', { ascending: false }),
                mySupabase.from('package_reviews').select('*'),
                mySupabase.from('site_announcements').select('*').eq('is_active', true).order('created_at', { ascending: false })
            ]);

            allPackages = pkgRes.data || [];
            allReviews = reviewRes.data || [];
            siteAnnouncements = annRes.data || [];

            renderAnnouncementsSidebar();
            generateDynamicTags();
            renderCatalog();
        }

        function renderAnnouncementsSidebar() {
            const container = document.getElementById('announcementSidebarList');
            document.getElementById('announcementCount').textContent = siteAnnouncements.length;
            document.getElementById('floatingAnnCount').textContent = siteAnnouncements.length;

            if (siteAnnouncements.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-400 text-center py-4">ยังไม่มีประกาศในขณะนี้</p>`;
                return;
            }

            container.innerHTML = siteAnnouncements.map(item => {
                const title = item.title || 'ประกาศสำคัญ';
                const content = item.content || '';
                const badge = item.badge_tag ? `<span class="px-2 py-0.5 bg-amber-500 text-white rounded-md text-[9px] font-bold shadow-sm">${item.badge_tag}</span>` : '<span class="px-2 py-0.5 bg-sky-500 text-white rounded-md text-[9px] font-bold shadow-sm">📢 ข่าวสาร</span>';
                const imgHtml = item.image_url ? `<div class="aspect-video w-full rounded-xl overflow-hidden bg-slate-900/5 dark:bg-slate-800/50 flex items-center justify-center p-1 mt-2 border border-amber-500/10"><img src="${item.image_url}" class="w-full h-full object-contain rounded-lg"></div>` : '';
                
                return `
                    <div onclick="openAnnouncementDetail('${item.id}')" class="p-4 bg-white dark:bg-darkinput rounded-2xl border-2 border-amber-500/30 hover:border-amber-500 hover:shadow-lg transition-all cursor-pointer space-y-2 group">
                        <div class="flex items-center justify-between gap-2">
                            <span class="font-extrabold text-xs text-slate-900 dark:text-white group-hover:text-amber-500 transition line-clamp-1">${title}</span>
                            ${badge}
                        </div>
                        <p class="text-[11px] text-slate-600 dark:text-slate-300 font-light leading-relaxed whitespace-pre-line line-clamp-3">${content}</p>
                        ${imgHtml}
                        <div class="text-[10px] text-amber-600 dark:text-amber-400 font-bold flex items-center gap-1 pt-1">
                            <span>คลิกเพื่ออ่านฉบับเต็ม</span> <i class="fas fa-arrow-right text-[9px]"></i>
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.openAnnouncementDetail = function(id) {
            const item = siteAnnouncements.find(x => x.id === id);
            if (!item) return;

            const badge = item.badge_tag ? `<span class="px-3 py-1 bg-amber-500 text-white rounded-xl text-xs font-bold shadow">${item.badge_tag}</span>` : '';
            const imgHtml = item.image_url ? `
                <div class="relative aspect-video rounded-2xl overflow-hidden bg-slate-900/5 dark:bg-slate-800/50 flex items-center justify-center p-2 shadow-inner border border-slate-200 dark:border-slate-800">
                    <img src="${item.image_url}" class="w-full h-full object-contain rounded-xl">
                </div>
            ` : '';

            document.getElementById('announcementModalContent').innerHTML = `
                <div class="space-y-4">
                    <div class="flex items-center justify-between">
                        ${badge}
                        <span class="text-[11px] text-slate-400 font-medium"><i class="far fa-clock mr-1"></i>${new Date(item.created_at).toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' })}</span>
                    </div>
                    <h3 class="text-xl font-bold text-slate-900 dark:text-white leading-snug">${item.title}</h3>
                    ${imgHtml}
                    <p class="text-xs sm:text-sm text-slate-600 dark:text-slate-300 leading-relaxed whitespace-pre-line">${item.content}</p>
                </div>
            `;
            document.getElementById('announcementModal').classList.remove('hidden');
        }

        window.closeAnnouncementModal = function() {
            document.getElementById('announcementModal').classList.add('hidden');
        }

        function generateDynamicTags() {
            const tagSet = new Set();
            allPackages.forEach(p => {
                if (Array.isArray(p.tags)) {
                    p.tags.forEach(t => tagSet.add(t.trim()));
                } else if (typeof p.tags === 'string' && p.tags.trim() !== '') {
                    p.tags.split(',').forEach(t => tagSet.add(t.trim()));
                }
            });

            const container = document.getElementById('tagFilterContainer');
            let html = `<button onclick="filterByTag('all')" id="tag-all" class="tag-btn px-4 py-2 bg-sky-600 text-white rounded-2xl text-xs font-bold shrink-0 transition shadow-md">✨ ทั้งหมด</button>`;
            
            tagSet.forEach(tag => {
                html += `<button onclick="filterByTag('${tag}')" id="tag-${tag}" class="tag-btn px-4 py-2 bg-white dark:bg-darkinput border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 rounded-2xl text-xs font-bold shrink-0 transition hover:bg-sky-50">${tag}</button>`;
            });

            container.innerHTML = html;
        }

        window.filterByTag = function(tag) {
            activeTag = tag;
            document.querySelectorAll('.tag-btn').forEach(btn => {
                btn.className = 'tag-btn px-4 py-2 bg-white dark:bg-darkinput border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 rounded-2xl text-xs font-bold shrink-0 transition hover:bg-sky-50';
            });
            const activeBtn = document.getElementById(`tag-${tag}`);
            if (activeBtn) activeBtn.className = 'tag-btn px-4 py-2 bg-sky-600 text-white rounded-2xl text-xs font-bold shrink-0 transition shadow-md';
            renderCatalog();
        }

        window.toggleWishlist = function(event, id) {
            event.stopPropagation();
            const index = wishlistIds.indexOf(id);
            if (index > -1) {
                wishlistIds.splice(index, 1);
            } else {
                wishlistIds.push(id);
            }
            localStorage.setItem('wishlist_courses', JSON.stringify(wishlistIds));
            renderCatalog();
        }

        function renderCatalog() {
            const grid = document.getElementById('catalogGrid');
            const keyword = document.getElementById('searchInput').value.toLowerCase().trim();
            const priceFilter = document.getElementById('priceFilter').value;
            const sortBy = document.getElementById('sortSelect').value;

            let filtered = allPackages.filter(p => {
                const title = (p.title || '').toLowerCase();
                const code = (p.code || '').toLowerCase();
                const tagsStr = Array.isArray(p.tags) ? p.tags.join(',').toLowerCase() : (p.tags || '').toLowerCase();
                const matchKeyword = title.includes(keyword) || code.includes(keyword) || tagsStr.includes(keyword);
                const matchTag = activeTag === 'all' || tagsStr.includes(activeTag.toLowerCase());

                const price = Number(p.price || 0);
                let matchPrice = true;
                if (priceFilter === 'free') matchPrice = price === 0;
                else if (priceFilter === 'under1000') matchPrice = price > 0 && price < 1000;
                else if (priceFilter === 'over1000') matchPrice = price >= 1000;

                return matchKeyword && matchTag && matchPrice;
            });

            if (sortBy === 'price-asc') {
                filtered.sort((a, b) => Number(a.price || 0) - Number(b.price || 0));
            } else if (sortBy === 'price-desc') {
                filtered.sort((a, b) => Number(b.price || 0) - Number(a.price || 0));
            }

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="modern-card p-12 rounded-3xl text-center text-slate-400 col-span-full"><h4 class="text-base font-bold text-slate-700 dark:text-slate-200 mb-1">ไม่พบคอร์สเรียนที่ค้นหา</h4></div>`;
                return;
            }

            grid.innerHTML = filtered.map(p => {
                const title = p.title || 'แพ็กเกจคอร์ส';
                const code = p.code ? `รหัส: ${p.code}` : 'BUNDLE';
                const priceNum = Number(p.price || 0);
                const origPriceNum = Number(p.original_price || 0);
                const price = `฿${priceNum.toLocaleString()}`;
                const origPrice = origPriceNum > priceNum ? `฿${origPriceNum.toLocaleString()}` : '';
                
                let discountBadge = '';
                if (origPriceNum > priceNum && priceNum > 0) {
                    const discountPct = Math.round(((origPriceNum - priceNum) / origPriceNum) * 100);
                    discountBadge = `<span class="px-2 py-0.5 bg-emerald-500 text-white rounded-lg text-[9px] font-black shadow">ลด ${discountPct}%</span>`;
                }

                const pkgReviews = allReviews.filter(r => String(r.package_id) === String(p.id));
                let avgRating = 5.0;
                if (pkgReviews.length > 0) {
                    const sum = pkgReviews.reduce((acc, r) => acc + Number(r.rating || 5), 0);
                    avgRating = (sum / pkgReviews.length).toFixed(1);
                }
                const ratingHtml = pkgReviews.length > 0 ? `<div class="flex items-center gap-1 text-amber-500 text-xs font-bold"><i class="fas fa-star"></i> <span>${avgRating}</span> <span class="text-slate-400 font-normal">(${pkgReviews.length})</span></div>` : `<div class="text-[11px] text-slate-400"><i class="far fa-star mr-1"></i> ยังไม่มีรีวิว</div>`;

                const badge = p.badge_tag ? `<span class="px-2.5 py-1 bg-rose-500 text-white rounded-xl text-[10px] font-bold shadow">${p.badge_tag}</span>` : '';
                const desc = p.description || 'ไม่มีรายละเอียดเพิ่มเติม';

                let tagsArray = [];
                if (Array.isArray(p.tags)) tagsArray = p.tags;
                else if (typeof p.tags === 'string' && p.tags.trim() !== '') tagsArray = p.tags.split(',');
                
                const tagsHtml = tagsArray.length > 0 ? `
                    <div class="flex flex-wrap gap-1.5 pt-1">
                        ${tagsArray.map(t => `<span class="px-2 py-0.5 bg-sky-500/10 text-sky-600 dark:text-sky-400 rounded-md text-[9px] font-bold">#${t.trim()}</span>`).join('')}
                    </div>
                ` : '';
                
                let imgList = Array.isArray(p.images) && p.images.length > 0 ? p.images : [p.image_url || 'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=600&auto=format&fit=crop&q=60'];
                const mainImg = imgList[0];
                const moreBtn = imgList.length > 1 ? `<button onclick="event.stopPropagation(); openGalleryModal(${JSON.stringify(imgList).replace(/"/g, '&quot;')}, '${title}')" class="absolute bottom-3 right-3 bg-black/70 backdrop-blur-md text-white text-[10px] font-bold px-2.5 py-1 rounded-xl"><i class="fas fa-images mr-1"></i> ${imgList.length} รูป</button>` : '';

                const isEnrolled = enrolledCourseIds.includes(String(p.id));
                const isWishlist = wishlistIds.includes(String(p.id));
                const actionBtn = isEnrolled 
                    ? `<button onclick="event.stopPropagation(); goToStudentPortal()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white rounded-2xl text-xs font-bold transition shadow-md shadow-emerald-500/20 flex items-center justify-center gap-2"><i class="fas fa-check-circle"></i> ลงทะเบียนแล้ว / เข้าสู่บทเรียน</button>`
                    : `<button class="w-full py-3 bg-sky-600 hover:bg-sky-700 text-white rounded-2xl text-xs font-bold transition shadow-md shadow-sky-500/20 flex items-center justify-center gap-2"><i class="fas fa-arrow-right"></i> ดูรายละเอียด & สมัครเรียน</button>`;

                return `
                    <div class="modern-card rounded-3xl overflow-hidden flex flex-col justify-between group cursor-pointer hover:border-sky-500 transition relative" onclick="openCourseDetail('${p.id}')">
                        <div>
                            <div class="relative aspect-video overflow-hidden bg-slate-900/5 dark:bg-slate-800/50 flex items-center justify-center p-2">
                                <img src="${mainImg}" class="w-full h-full object-contain rounded-xl group-hover:scale-105 transition-transform duration-500">
                                <div class="absolute top-3 left-3 bg-black/60 backdrop-blur-md text-white text-[10px] font-bold px-3 py-1 rounded-xl">${code}</div>
                                <div class="absolute top-3 right-3 flex items-center gap-1">${discountBadge}${badge}</div>
                                <button onclick="toggleWishlist(event, '${p.id}')" class="absolute bottom-3 left-3 w-8 h-8 rounded-xl bg-white/80 dark:bg-darkbox/80 backdrop-blur-md flex items-center justify-center text-xs shadow transition hover:scale-110 ${isWishlist ? 'text-rose-500' : 'text-slate-400'}">
                                    <i class="${isWishlist ? 'fas' : 'far'} fa-heart"></i>
                                </button>
                                ${moreBtn}
                            </div>
                            <div class="p-5 space-y-2.5">
                                <div class="flex justify-between items-center">${tagsHtml}${ratingHtml}</div>
                                <h4 class="font-bold text-base text-slate-900 dark:text-white line-clamp-1">${title}</h4>
                                <div class="flex items-center gap-2">
                                    <span class="text-lg font-extrabold text-sky-600 dark:text-sky-400">${price}</span>
                                    ${origPrice ? `<span class="text-xs text-slate-400 line-through">${origPrice}</span>` : ''}
                                </div>
                                <p class="text-xs text-slate-500 dark:text-slate-400 line-clamp-2 leading-relaxed">${desc}</p>
                            </div>
                        </div>
                        <div class="p-5 pt-0 border-t border-slate-100 dark:border-slate-800 mt-2">
                            ${actionBtn}
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.openCourseDetail = function(id) {
            const pkg = allPackages.find(x => x.id === id);
            if (!pkg) return;
            let imgList = Array.isArray(pkg.images) && pkg.images.length > 0 ? pkg.images : [pkg.image_url || 'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=600&auto=format&fit=crop&q=60'];
            
            const pkgReviews = allReviews.filter(r => String(r.package_id) === String(pkg.id));
            const isEnrolled = enrolledCourseIds.includes(String(pkg.id));

            let reviewsHtml = pkgReviews.length === 0 ? `<p class="text-xs text-slate-400 text-center py-4">ยังไม่มีรีวิวสำหรับคอร์สนี้ เป็นคนแรกที่รีวิวเลย!</p>` : pkgReviews.map(r => `
                <div class="p-3 bg-slate-50 dark:bg-darkinput rounded-2xl space-y-1">
                    <div class="flex justify-between items-center text-xs">
                        <span class="font-bold text-slate-800 dark:text-white"><i class="fas fa-user-circle mr-1 text-sky-500"></i> ${r.student_name || 'นักเรียน'}</span>
                        <span class="text-amber-500 font-bold">${'★'.repeat(r.rating || 5)}${'☆'.repeat(5 - (r.rating || 5))}</span>
                    </div>
                    <p class="text-xs text-slate-600 dark:text-slate-300 font-light">${r.comment || ''}</p>
                </div>
            `).join('');

            document.getElementById('modalContent').innerHTML = `
                <div class="relative aspect-video rounded-2xl overflow-hidden bg-slate-900/5 dark:bg-slate-800/50 flex items-center justify-center p-2 shadow-inner">
                    <img src="${imgList[0]}" class="w-full h-full object-contain rounded-xl" id="modalMainImg">
                </div>
                ${imgList.length > 1 ? `
                    <div class="flex gap-2 overflow-x-auto pb-1">
                        ${imgList.map(img => `<img src="${img}" onclick="document.getElementById('modalMainImg').src='${img}'" class="w-16 h-10 object-contain rounded-lg cursor-pointer border hover:border-sky-500 bg-slate-900/5 dark:bg-slate-800/50">`).join('')}
                    </div>
                ` : ''}
                <div class="space-y-2">
                    <h3 class="text-xl font-bold text-slate-900 dark:text-white">${pkg.title}</h3>
                    <div class="flex items-center gap-2">
                        <span class="text-2xl font-black text-sky-600 dark:text-sky-400">฿${Number(pkg.price || 0).toLocaleString()}</span>
                        ${pkg.original_price ? `<span class="text-sm text-slate-400 line-through">฿${Number(pkg.original_price).toLocaleString()}</span>` : ''}
                    </div>
                    ${pkg.promo_details ? `<p class="text-xs text-amber-500 font-medium"><i class="fas fa-bolt mr-1"></i>${pkg.promo_details}</p>` : ''}
                    ${pkg.freebies ? `<p class="text-xs text-emerald-600 font-medium"><i class="fas fa-gift mr-1"></i>${pkg.freebies}</p>` : ''}
                    <p class="text-xs text-slate-500 dark:text-slate-400 leading-relaxed">${pkg.description || 'ไม่มีรายละเอียดเพิ่มเติม'}</p>
                </div>

                <div class="pt-4 border-t border-slate-100 dark:border-slate-800 space-y-3">
                    <div class="flex justify-between items-center">
                        <h4 class="font-bold text-xs text-slate-800 dark:text-white">⭐ รีวิวจากผู้เรียน (${pkgReviews.length})</h4>
                        <button onclick="openReviewForm('${pkg.id}', '${pkg.title}')" class="px-3 py-1.5 bg-amber-500/10 text-amber-600 rounded-xl text-xs font-bold hover:bg-amber-500/20 transition"><i class="fas fa-pen mr-1"></i> เขียนรีวิว</button>
                    </div>
                    <div class="space-y-2 max-h-48 overflow-y-auto pr-1">${reviewsHtml}</div>
                </div>

                ${isEnrolled 
                    ? `<button onclick="goToStudentPortal()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl font-bold text-xs transition shadow-md shadow-emerald-500/20">เข้าสู่บทเรียน (ลงทะเบียนแล้ว)</button>`
                    : `<button onclick="handleEnroll('${pkg.id}', '${pkg.title}')" class="w-full py-3 bg-sky-600 hover:bg-sky-700 text-white rounded-xl font-bold text-xs transition shadow-md shadow-sky-500/20">ยืนยันสมัครเรียน / ติดต่อลงทะเบียน</button>`
                }
            `;
            document.getElementById('courseModal').classList.remove('hidden');
        }

        window.openReviewForm = async function(packageId, packageTitle) {
            const { value: formValues } = await Swal.fire({
                title: '✍️ เขียนรีวิวคอร์สเรียน',
                html: `
                    <div class="space-y-3 text-left text-xs">
                        <div>
                            <label class="block font-bold mb-1">ให้คะแนนความพึงพอใจ:</label>
                            <select id="swalRating" class="w-full px-3 py-2 bg-slate-50 dark:bg-darkinput border rounded-xl font-bold outline-none">
                                <option value="5">⭐⭐⭐⭐⭐ (5 ดาว - ดีเยี่ยม)</option>
                                <option value="4">⭐⭐⭐⭐ (4 ดาว - มาก)</option>
                                <option value="3">⭐⭐⭐ (3 ดาว - ปานกลาง)</option>
                                <option value="2">⭐⭐ (2 ดาว - ควรปรับปรุง)</option>
                                <option value="1">⭐ (1 ดาว - แย่มาก)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block font-bold mb-1">ความคิดเห็นของคุณ:</label>
                            <textarea id="swalComment" rows="3" class="w-full px-3 py-2 bg-slate-50 dark:bg-darkinput border rounded-xl outline-none" placeholder="บอกเล่าความประทับใจหรือประโยชน์ที่ได้รับจากคอร์สนี้..."></textarea>
                        </div>
                    </div>
                `,
                showCancelButton: true,
                confirmButtonText: 'ส่งรีวิว',
                cancelButtonText: 'ยกเลิก',
                confirmButtonColor: '#0284c7',
                preConfirm: () => {
                    const rating = document.getElementById('swalRating').value;
                    const comment = document.getElementById('swalComment').value.trim();
                    if (!comment) {
                        Swal.showValidationMessage('กรุณากรอกความคิดเห็น');
                        return false;
                    }
                    return { rating: Number(rating), comment };
                }
            });

            if (formValues) {
                Swal.fire({ title: 'กำลังบันทึกรีวิว...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                
                const { error } = await mySupabase.from('package_reviews').insert([{
                    package_id: packageId,
                    student_id: currentStudentId || 'guest',
                    student_name: currentStudentName,
                    rating: formValues.rating,
                    comment: formValues.comment
                }]);

                if (!error) {
                    const { data: reviewRes } = await mySupabase.from('package_reviews').select('*');
                    allReviews = reviewRes.data || [];
                    
                    Swal.fire({ icon: 'success', title: 'ขอบคุณสำหรับรีวิว!', timer: 1500, showConfirmButton: false });
                    openCourseDetail(packageId);
                    renderCatalog();
                } else {
                    Swal.fire('เกิดข้อผิดพลาด', error.message, 'error');
                }
            }
        }

        window.handleEnroll = function(packageId, packageTitle) {
            Swal.fire({
                title: 'สนใจสมัครเรียนคอร์สนี้?',
                text: `คุณต้องการสมัครแพ็กเกจ "${packageTitle}" ใช่หรือไม่`,
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: 'ใช่, แจ้งสมัครเรียน',
                cancelButtonText: 'ยกเลิก',
                confirmButtonColor: '#0284c7'
            }).then((result) => {
                if (result.isConfirmed) {
                    Swal.fire({
                        icon: 'success',
                        title: 'บันทึกความสนใจสำเร็จ!',
                        text: 'เจ้าหน้าที่หรือระบบจะทำการตรวจสอบและติดต่อกลับเพื่อยืนยันการลงทะเบียน',
                        confirmButtonColor: '#0284c7'
                    });
                    closeCourseModal();
                }
            });
        }

        window.closeCourseModal = function() { document.getElementById('courseModal').classList.add('hidden'); }
        window.openGalleryModal = function(imgList, title) {
            document.getElementById('galleryTitle').textContent = `รูปภาพ: ${title}`;
            document.getElementById('galleryImagesGrid').innerHTML = imgList.map(img => `<div class="rounded-2xl overflow-hidden aspect-video bg-slate-900/5 dark:bg-slate-800/50 flex items-center justify-center p-2"><img src="${img}" class="w-full h-full object-contain rounded-xl"></div>`).join('');
            document.getElementById('galleryModal').classList.remove('hidden');
        }
        window.closeGalleryModal = function() { document.getElementById('galleryModal').classList.add('hidden'); }

        fetchCatalogData();
    </script>
</body>
</html>
