    <script>
        (function() {
            let hasSession = false;
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith('sb-') && key.endsWith('-auth-token')) {
                    const val = localStorage.getItem(key);
                    if (val && val.includes('access_token')) {
                        hasSession = true;
                        break;
                    }
                }
            }
            const fallbackId = localStorage.getItem('id') || localStorage.getItem('admin_id') || localStorage.getItem('user_id');
            if (!hasSession && !fallbackId) {
                window.location.replace('index.html');
            }
        })();
    </script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Prompt', 'sans-serif'] },
                    colors: { primary: '#0284c7', darkbg: '#020617', darkbox: '#090d16', darkinput: '#0f172a' }
                }

        }
    </script>

    <script>
        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const filterCourseId = urlParams.get('course_id');

        let categoriesList = [];
        let allCoursesList = [];
        let coursesMap = {};
        let currentExamsData = [];
        let allAttemptsMap = {};
        let currentViewMode = localStorage.getItem('exam_view_mode') || 'grid';
        let isAllCollapsed = false;

        const htmlElement = document.documentElement;
        const themeIcon = document.getElementById('themeIcon');
        if (localStorage.getItem('theme') === 'dark') {
            htmlElement.classList.add('dark');
            themeIcon.classList.replace('fa-moon', 'fa-sun');
        }
        document.getElementById('themeToggle').addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            const isDark = htmlElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeIcon.classList.replace(isDark ? 'fa-moon' : 'fa-sun', isDark ? 'fa-sun' : 'fa-moon');
        });

        // ⚡ Helper สำหรับโพสต์ประกาศอัตโนมัติ (Exam Open Announcement)
        async function autoPostAnnouncement(category, title, content, targetType = 'all', targetValue = '') {
            try {
                const payload = {
                    category: category, // 'exam'
                    title: title,
                    content: content,
                    target_type: targetType, // 'course' หรือ 'all'
                    target_value: targetValue,
                    created_at: new Date().toISOString()
                };

                await mySupabase.from('announcements').insert([payload]);
                await mySupabase.from('notifications').insert([{
                    type: category,
                    message: `${title}: ${content.substring(0, 60)}...`,
                    created_at: new Date().toISOString()
                }]);
            } catch (err) {
                console.error('Failed to auto-create announcement:', err);
            }
        }

        function goBack() {
            if (filterCourseId) {
                window.location.href = `admin_course_detail.html?id=${filterCourseId}`;
            } else {
                window.location.href = 'admin.html';
            }
        }

        function clearCourseFilter() {
            if (filterCourseId) {
                window.location.href = `admin_course_detail.html?id=${filterCourseId}`;
            } else {
                window.location.href = 'admin_exams.html';
            }
        }

        async function initPage() {
            updateViewSwitcherButtons();
            await loadCategories();
            await loadCourses();
            await loadAttemptsData();
            await loadExams();

            if (filterCourseId) {
                const course = coursesMap[filterCourseId];
                if (course) {
                    document.getElementById('courseFilterBanner').classList.remove('hidden');
                    document.getElementById('filterCourseTitleName').textContent = course.title;
                    document.getElementById('navTitle').innerHTML = `<span class="w-7 h-7 rounded-lg bg-gradient-to-r from-purple-500 to-indigo-600 text-white flex items-center justify-center text-xs shadow-md"><i class="fas fa-file-signature"></i></span> ข้อสอบในคอร์ส: ${course.title}`;
                }
            }
        }

        function switchViewMode(mode) {
            currentViewMode = mode;
            localStorage.setItem('exam_view_mode', mode);
            updateViewSwitcherButtons();
            renderExamsContainer();
        }

        function updateViewSwitcherButtons() {
            const btnGrid = document.getElementById('viewBtnGrid');
            const btnList = document.getElementById('viewBtnList');
            if (currentViewMode === 'grid') {
                btnGrid.className = "px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 bg-white dark:bg-slate-900 shadow-sm text-sky-600 dark:text-sky-400";
                btnList.className = "px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 text-slate-500 hover:text-slate-800 dark:hover:text-slate-200";
            } else {
                btnList.className = "px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 bg-white dark:bg-slate-900 shadow-sm text-sky-600 dark:text-sky-400";
                btnGrid.className = "px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 text-slate-500 hover:text-slate-800 dark:hover:text-slate-200";
            }
        }

        async function loadCategories() {
            const { data } = await mySupabase.from('exam_categories').select('*').order('name');
            categoriesList = data || [];
        }

        async function loadCourses() {
            const { data } = await mySupabase.from('courses').select('id, title, course_code').order('title');
            allCoursesList = data || [];
            coursesMap = {};
            allCoursesList.forEach(c => { coursesMap[c.id] = c; });
        }

        async function loadAttemptsData() {
            const { data: attempts } = await mySupabase.from('exam_attempts').select('*');
            allAttemptsMap = {};
            if (attempts) {
                attempts.forEach(att => {
                    const eId = String(att.exam_id);
                    if (!allAttemptsMap[eId]) allAttemptsMap[eId] = [];
                    const score = att.total_score !== undefined && att.total_score !== null ? Number(att.total_score) : (Number(att.score) || 0);
                    allAttemptsMap[eId].push(score);
                });
            }
        }

        async function loadExams() {
            const { data: exams, error } = await mySupabase.from('exams').select('*, exam_categories(id, name)').order('created_at', { ascending: false });
            
            let allExams = exams || [];
            const now = new Date();

            for (let e of allExams) {
                if (e.status === 'countdown' && e.start_time && new Date(e.start_time) <= now) {
                    e.status = 'public';
                    mySupabase.from('exams').update({ status: 'public' }).eq('id', e.id).then(() => {});
                }
            }

            if (filterCourseId) {
                allExams = allExams.filter(e => {
                    if (!e.course_id) return false;
                    if (Array.isArray(e.course_id)) {
                        return e.course_id.includes(filterCourseId);
                    }
                    return String(e.course_id) === String(filterCourseId);
                });
            }

            currentExamsData = allExams;
            
            if (error || currentExamsData.length === 0) {
                document.getElementById('classroomExamsContainer').innerHTML = `<div class="hitech-card p-8 rounded-2xl text-center text-slate-400 text-xs">ยังไม่มีชุดข้อสอบในระบบ${filterCourseId ? 'ของคอร์สนี้' : ''}</div>`;
                document.getElementById('upcomingExamSection').classList.add('hidden');
                return;
            }

            const in48Hours = new Date(now.getTime() + 48 * 60 * 60 * 1000);
            const upcomingExams = currentExamsData.filter(e => e.status === 'countdown' && e.start_time && new Date(e.start_time) > now && new Date(e.start_time) <= in48Hours);

            const upcomingSec = document.getElementById('upcomingExamSection');
            const upcomingGrid = document.getElementById('upcomingExamsGrid');

            if (upcomingExams.length > 0) {
                upcomingSec.classList.remove('hidden');
                upcomingGrid.innerHTML = upcomingExams.map(e => {
                    const st = new Date(e.start_time);
                    const diffHours = Math.round((st - now) / (1000 * 60 * 60));
                    return `
                        <div class="upcoming-banner-card p-4 rounded-2xl space-y-2 border-l-4 border-l-amber-500">
                            <div class="flex justify-between items-start">
                                <span class="px-2 py-0.5 rounded-md bg-amber-500/20 text-amber-700 dark:text-amber-300 font-bold text-[10px]">
                                    <i class="fas fa-clock mr-1"></i> อีก ~${diffHours} ชม. จะเปิดบริการ
                                </span>
                                <span class="font-mono text-xs text-amber-600 dark:text-amber-400 font-bold">${e.exam_code || 'CODE'}</span>
                            </div>
                            <h4 class="font-bold text-slate-900 dark:text-white text-sm">${e.title}</h4>
                            <div class="text-[11px] text-slate-600 dark:text-slate-300">📅 เปิดสอบ: ${st.toLocaleString('th-TH')}</div>
                            <div class="pt-2">
                                <button onclick="window.location.href='admin_exam_editor.html?id=${e.id}'" class="w-full py-1.5 bg-amber-500 hover:bg-amber-600 text-white rounded-xl text-xs font-bold transition-all shadow-sm">
                                    เตรียมโจทย์ & เฉลย OMR
                                </button>
                            </div>
                        </div>
                    `;
                }).join('');
            } else {
                upcomingSec.classList.add('hidden');
            }

            renderExamsContainer();
        }

        function getExamAverageScore(examId) {
            const scores = allAttemptsMap[String(examId)] || [];
            if (scores.length === 0) return '-';
            const sum = scores.reduce((a, b) => a + b, 0);
            return (sum / scores.length).toFixed(1);
        }

        function getChoiceFormatLabel(fmt) {
            if (fmt === 'th_num') return 'ก, ข, ค, ง';
            if (fmt === 'upper') return 'A, B, C, D';
            if (fmt === 'lower') return 'a, b, c, d';
            return '1, 2, 3, 4';
        }

        async function renderExamsContainer() {
            const container = document.getElementById('classroomExamsContainer');
            if (currentExamsData.length === 0) return;

            const { data: essayQuestions } = await mySupabase.from('questions').select('exam_id').eq('question_type', 'essay');
            const examsWithEssay = new Set((essayQuestions || []).map(q => q.exam_id));

            const grouped = {};
            currentExamsData.forEach(e => {
                const catName = e.exam_categories?.name || 'ข้อสอบทั่วไป';
                if (!grouped[catName]) grouped[catName] = [];
                grouped[catName].push(e);
            });

            container.innerHTML = Object.keys(grouped).map((catName, idx) => {
                const catExams = grouped[catName];
                const catId = `cat-sec-${idx}`;

                let contentHtml = '';
                if (currentViewMode === 'grid') {
                    const cardsHtml = catExams.map(e => renderExamCard(e, examsWithEssay.has(e.id))).join('');
                    contentHtml = `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 pt-3">${cardsHtml}</div>`;
                } else {
                    const listRowsHtml = catExams.map(e => renderExamListRow(e, examsWithEssay.has(e.id))).join('');
                    contentHtml = `<div class="space-y-2 pt-3">${listRowsHtml}</div>`;
                }

                return `
                    <div class="hitech-card p-4 rounded-2xl space-y-2">
                        <div onclick="toggleCategorySection('${catId}')" class="flex justify-between items-center cursor-pointer select-none border-b border-sky-500/20 pb-2">
                            <div class="flex items-center gap-2">
                                <i class="fas fa-chevron-down text-sky-500 transition-transform duration-200" id="icon-${catId}"></i>
                                <span class="w-3 h-5 bg-gradient-to-b from-sky-400 to-blue-600 rounded-full"></span>
                                <h3 class="font-extrabold text-base text-slate-900 dark:text-white">${catName}</h3>
                                <span class="px-2.5 py-0.5 rounded-full bg-sky-100 dark:bg-sky-950 text-sky-600 dark:text-sky-300 text-xs font-bold">${catExams.length} ชุด</span>
                            </div>
                            <span class="text-[11px] text-slate-400 font-semibold">คลิกเพื่อ ยุบ/ขยาย</span>
                        </div>
                        <div id="${catId}" class="cat-content-box">${contentHtml}</div>
                    </div>
                `;
            }).join('');
        }

        function renderExamCard(e, hasEssay) {
            const statusBadge = getStatusBadge(e);
            const deliveryBadge = getDeliveryBadge(e.delivery_type || e.exam_type);
            const avgScore = getExamAverageScore(e.id);
            const choiceLabel = getChoiceFormatLabel(e.choice_format);
            const submittedCount = (allAttemptsMap[String(e.id)] || []).length;
            
            let courseTagHtml = '';
            let targetCourseId = e.course_id;
            if (Array.isArray(targetCourseId)) targetCourseId = targetCourseId[0];
            if (targetCourseId && coursesMap[targetCourseId]) {
                const cObj = coursesMap[targetCourseId];
                courseTagHtml = `<span class="inline-flex items-center gap-1 px-2 py-0.5 bg-purple-500/10 text-purple-600 dark:text-purple-400 text-[10px] font-bold rounded-md"><i class="fas fa-chalkboard"></i> ${cObj.title}</span>`;
            }

            let scheduleInfo = '';
            if (e.status === 'countdown' && e.start_time) {
                scheduleInfo = `<div class="text-[10px] text-amber-600 dark:text-amber-400 font-semibold"><i class="fas fa-clock mr-1"></i>เปิด: ${new Date(e.start_time).toLocaleString('th-TH')}</div>`;
            }
            if (e.due_date) {
                scheduleInfo += `<div class="text-[10px] text-rose-600 dark:text-rose-400 font-semibold"><i class="fas fa-hourglass-end mr-1"></i>ปิด: ${new Date(e.due_date).toLocaleString('th-TH')}</div>`;
            }

            return `
                <div class="p-4 bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800/80 flex flex-col justify-between space-y-3">
                    <div class="space-y-2">
                        <div class="flex justify-between items-center gap-1">
                            <span class="font-mono text-[11px] font-bold glow-badge-sky px-2 py-0.5 rounded-md">${e.exam_code || 'CODE'}</span>
                            ${statusBadge}
                        </div>

            const { data: questions } = await mySupabase.from('questions').select('*').eq('exam_id', examId);

            const totalStudents = scores.length;

                const sum = scores.reduce((a, b) => a + b, 0);

            Swal.fire({
                title: `📊 AI Diagnostic Report: ${examTitle}`,
                width: '650px',
                html: `
                    <div class="space-y-4 text-left text-xs">
                        <div class="grid grid-cols-3 gap-2 text-center">

                            </div>
                            <div class="p-3 bg-slate-100 dark:bg-slate-800 rounded-2xl">
                                <div class="text-lg font-extrabold text-emerald-600">${avgScore}</div>
                                <div class="text-[10px] text-slate-400">คะแนนเฉลี่ยรวม</div>

                                <div class="text-lg font-extrabold text-purple-600">${questions?.length || 0}</div>

                            </div>

                            <p class="text-slate-700 dark:text-slate-300">

                            </p>
                        </div>
                    </div>
                `,
                confirmButtonText: 'ปิดหน้าต่าง'
            });

        async function openAttemptManager(examId, examTitle) {
            Swal.fire({ title: 'กำลังโหลดรายชื่อผู้ส่งสอบ...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            const { data: attempts } = await mySupabase.from('exam_attempts').select('*, profiles(full_name)').eq('exam_id', examId);
            Swal.close();

            if (!attempts || attempts.length === 0) {
                Swal.fire('ไม่พบประวัติการสอบ', 'ยังไม่มีนักเรียนทำข้อสอบชุดนี้', 'info');
                return;
            }

            const renderAttemptRows = (list) => {
                if (list.length === 0) return `<div class="text-center py-4 text-slate-400 text-xs">ไม่พบรายชื่อนักเรียนที่ค้นหา</div>`;
                return list.map(att => `
                    <div class="flex justify-between items-center p-2.5 bg-slate-100 dark:bg-slate-800 rounded-xl text-xs attempt-row" data-name="${(att.profiles?.full_name || '').toLowerCase()}">
                        <div>
                            <div class="font-bold text-slate-900 dark:text-white">${att.profiles?.full_name || 'ไม่ระบุชื่อ'}</div>
                            <div class="text-[10px] text-slate-400">คะแนน: ${att.score ?? '-'} | ส่งเมื่อ: ${att.submission_time ? new Date(att.submission_time).toLocaleString('th-TH') : '-'}</div>
                        </div>
                        <button onclick="deleteAttemptRecord('${att.id}', '${examId}', '${examTitle}')" class="px-2.5 py-1 bg-red-500 text-white rounded-lg font-bold text-[10px] hover:bg-red-600"><i class="fas fa-trash mr-1"></i> ลบสิทธิ์/ให้สอบใหม่</button>
                    </div>
                `).join('');
            };

            Swal.fire({
                title: `จัดการสิทธิ์สอบ: ${examTitle}`,
                width: '620px',
                html: `
                    <div class="space-y-3 text-left">
                        <input type="text" id="searchAttemptInput" oninput="filterAttemptList(this.value)" placeholder="🔍 ค้นหาชื่อนักเรียนแบบเรียลไทม์..." class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border rounded-xl text-xs outline-none">
                        <div id="attemptListContainer" class="space-y-2 max-h-60 overflow-y-auto">${renderAttemptRows(attempts)}</div>
                    </div>
                `,
                showConfirmButton: false,
                showCloseButton: true
            });
        }

        window.filterAttemptList = function(keyword) {
            const term = keyword.toLowerCase().trim();
            document.querySelectorAll('.attempt-row').forEach(row => {
                const name = row.getAttribute('data-name') || '';
                row.style.display = name.includes(term) ? 'flex' : 'none';
            });
        };

        async function deleteAttemptRecord(attemptId, examId, examTitle) {
            const res = await Swal.fire({
                title: 'ยืนยันลบประวัติการสอบนี้?',
                text: 'การลบจะทำให้นักเรียนสามารถกดเข้ามาทำข้อสอบชุดนี้ใหม่อีกครั้งได้',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                confirmButtonText: 'ยืนยันลบสิทธิ์'
            });

            if (res.isConfirmed) {
                Swal.fire({ title: 'กำลังลบ...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                await mySupabase.from('exam_answers').delete().eq('attempt_id', attemptId);
                await mySupabase.from('exam_attempts').delete().eq('id', attemptId);
                await loadAttemptsData();
                Swal.fire({ icon: 'success', title: 'ลบประวัติสำเร็จ!', timer: 1200, showConfirmButton: false });
                setTimeout(() => openAttemptManager(examId, examTitle), 400);
            }
        }

        function getStatusBadge(e) {
            if (e.status === 'public' || (e.status === 'countdown' && e.start_time && new Date(e.start_time) <= new Date())) {
                return '<span class="px-2 py-0.5 rounded-full bg-emerald-50 dark:bg-emerald-950/50 text-emerald-600 dark:text-emerald-400 font-bold text-[10px] border border-emerald-200 dark:border-emerald-800">เปิดบริการ</span>';
            }
            if (e.status === 'countdown') {
                return '<span class="px-2 py-0.5 rounded-full bg-amber-50 dark:bg-amber-950/50 text-amber-600 dark:text-amber-400 font-bold text-[10px] border border-amber-200 dark:border-amber-800">ตั้งเวลา</span>';
            }
            return '<span class="px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500 font-bold text-[10px]">ซ่อน</span>';
        }

        function getDeliveryBadge(dt) {
            if (dt === 'online') return '<span class="px-2 py-0.5 rounded-md bg-purple-50 dark:bg-purple-950/50 text-purple-600 dark:text-purple-300 text-[10px] font-bold"><i class="fas fa-keyboard mr-1"></i>ออนไลน์</span>';
            return '<span class="px-2 py-0.5 rounded-md bg-red-50 dark:bg-red-950/50 text-red-600 dark:text-red-300 text-[10px] font-bold"><i class="fas fa-file-pdf mr-1"></i>ไฟล์ PDF</span>';
        }

        function toggleCategorySection(catId) {
            const box = document.getElementById(catId);
            const icon = document.getElementById(`icon-${catId}`);
            if (box.classList.contains('hidden')) {
                box.classList.remove('hidden');
                icon.classList.remove('-rotate-90');
            } else {
                box.classList.add('hidden');
                icon.classList.add('-rotate-90');
            }
        }

        function toggleAllCategories() {
            isAllCollapsed = !isAllCollapsed;
            document.querySelectorAll('.cat-content-box').forEach(b => {
                if (isAllCollapsed) b.classList.add('hidden');
                else b.classList.remove('hidden');
            });
            document.querySelectorAll('[id^="icon-cat-sec-"]').forEach(i => {
                if (isAllCollapsed) i.classList.add('-rotate-90');
                else i.classList.remove('-rotate-90');
            });
            document.getElementById('toggleAllBtnText').textContent = isAllCollapsed ? 'ขยายทั้งหมด' : 'ยุบทั้งหมด';
        }

                                <option value="draft" ${examData?.status === 'draft' ? 'selected' : ''}>ซ่อนอยู่ (Draft)</option>
                                <option value="public" ${examData?.status === 'public' ? 'selected' : ''}>เปิดบริการทันที (Public)</option>
                                <option value="countdown" ${examData?.status === 'countdown' ? 'selected' : ''}>ตั้งเวลาเปิดบริการ (Countdown)</option>
                            </select>
                        </div>

                        <div id="countdownTimeBox" class="${examData?.status === 'countdown' ? '' : 'hidden'}">
                            <label class="block font-bold mb-1 text-amber-500"><i class="fas fa-clock mr-1"></i> วันเวลาเริ่มเปิดบริการ (Start Time)</label>
                            <input type="datetime-local" id="swalStartTime" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border rounded-xl outline-none" value="${examData?.start_time ? new Date(new Date(examData.start_time).getTime() - new Date().getTimezoneOffset()*60000).toISOString().slice(0,16) : ''}">
                        </div>

                        <div class="pt-2 border-t dark:border-slate-800 space-y-2">
                            <label class="flex items-center gap-2 cursor-pointer font-bold text-slate-800 dark:text-slate-200">
                                <input type="checkbox" id="hasDueDateCheck" onchange="toggleDueDateInput(this.checked)" ${examData?.due_date ? 'checked' : ''} class="w-4 h-4 rounded text-sky-600">
                                <span>กำหนดวันเวลาสิ้นสุดการทำข้อสอบ (Due Date)</span>
                            </label>
                            <div id="dueDateBox" class="${examData?.due_date ? '' : 'hidden'} space-y-2">
                                <input type="datetime-local" id="swalDueDate" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border rounded-xl outline-none" value="${examData?.due_date ? new Date(new Date(examData.due_date).getTime() - new Date().getTimezoneOffset()*60000).toISOString().slice(0,16) : ''}">
                            </div>
                        </div>
                    </div>
                `,
                showCancelButton: true,
                confirmButtonText: 'บันทึกข้อมูล',
                cancelButtonText: 'ยกเลิก',
                preConfirm: () => {
                    const title = document.getElementById('swalTitle').value.trim();
                    const exam_code = document.getElementById('swalExamCode').value.trim().toUpperCase();
                    const delivery_type = document.querySelector('input[name="swalDeliveryType"]:checked')?.value || 'pdf';
                    const choice_format = document.getElementById('swalChoiceFormat').value;
                    const status = document.getElementById('swalStatus').value;
                    const hasDueDate = document.getElementById('hasDueDateCheck').checked;
                    const catVal = document.getElementById('swalCategory').value;
                    const selectedCourseId = document.getElementById('swalCourseSelect').value;

                    if (!title) { Swal.showValidationMessage('กรุณากรอกชื่อชุดข้อสอบ'); return false; }

                    const courseIdPayload = selectedCourseId ? [selectedCourseId] : null;

                    return {
                        title,
                        exam_code: exam_code || `EXAM-${Math.floor(Math.random()*9000+1000)}`,
                        delivery_type,
                        exam_type: delivery_type,
                        choice_format,
                        category_id: catVal ? catVal : null,
                        course_id: courseIdPayload,
                        time_limit: parseInt(document.getElementById('swalTimeLimit').value) || 60,
                        max_attempts: parseInt(document.getElementById('swalMaxAttempts').value) || 0,
                        status: status,
                        start_time: (status === 'countdown' && document.getElementById('swalStartTime').value) ? new Date(document.getElementById('swalStartTime').value).toISOString() : null,
                        due_date: (hasDueDate && document.getElementById('swalDueDate').value) ? new Date(document.getElementById('swalDueDate').value).toISOString() : null
                    };
                }
            });

            if (formValues) {
                Swal.fire({ title: 'กำลังบันทึกข้อมูล...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                
                let resError = null;
                if (isEdit) {
                    const { error } = await mySupabase.from('exams').update(formValues).eq('id', examData.id);
                    resError = error;
                } else {
                    const { error } = await mySupabase.from('exams').insert([formValues]);
                    resError = error;

                    // ⚡ โพสต์ประกาศอัตโนมัติเมื่อสร้างชุดข้อสอบใหม่สำเร็จ
                    if (!resError) {
                        let targetCourseVal = '';
                        let targetTypeVal = 'all';
                        if (formValues.course_id && formValues.course_id.length > 0) {
                            targetCourseVal = formValues.course_id[0];
                            targetTypeVal = 'course';
                        }
                        await autoPostAnnouncement(
                            'exam',
                            `📝 แจ้งเปิดข้อสอบใหม่: ${formValues.title}`,
                            `ทางระบบได้เปิดชุดข้อสอบใหม่ "${formValues.title}" รหัสข้อสอบ (${formValues.exam_code}) เรียบร้อยแล้ว ขอให้นักเรียนทุกคนเตรียมตัวเข้าทำข้อสอบตามกำหนดเวลา`,
                            targetTypeVal,
                            targetCourseVal
                        );
                    }
                }

                if (!resError) {
                    Swal.fire({ icon: 'success', title: 'บันทึกชุดข้อสอบสำเร็จ!', timer: 1200, showConfirmButton: false });
                    loadExams();
                } else {
                    Swal.fire('บันทึกล้มเหลว', `เกิดข้อผิดพลาดจาก Supabase Database:<br><code class="text-xs text-red-400 font-mono mt-2 block">${resError.message}</code>`, 'error');
                }
            }
        }

        window.toggleCountdownInput = function(val) {
            document.getElementById('countdownTimeBox').className = val === 'countdown' ? '' : 'hidden';
        }

        window.toggleDueDateInput = function(checked) {
            document.getElementById('dueDateBox').className = checked ? 'space-y-2' : 'hidden';
        }

        async function openCategoryManagerModal() {
            let catHtml = categoriesList.map(c => `
                <div class="flex justify-between items-center p-2 bg-slate-100 dark:bg-slate-800 rounded-lg text-xs">
                    <span class="font-bold">${c.name}</span>
                    <button onclick="deleteCategory('${c.id}')" class="text-red-500 px-2 py-1"><i class="fas fa-trash"></i></button>
                </div>
            `).join('');

            const { value: newCatName } = await Swal.fire({
                title: 'จัดการหมวดหมู่',
                html: `
                    <div class="space-y-3 text-left text-xs">
                        <div class="space-y-1.5 max-h-40 overflow-y-auto">${catHtml || '<div class="text-center text-slate-400">ยังไม่มีหมวดหมู่</div>'}</div>
                        <input id="newCatInput" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border rounded-xl outline-none" placeholder="พิมพ์ชื่อหมวดหมู่ใหม่...">
                    </div>
                `,
                showCancelButton: true,
                confirmButtonText: 'เพิ่มหมวดหมู่',
                preConfirm: () => document.getElementById('newCatInput').value
            });

            if (newCatName) {
                await mySupabase.from('exam_categories').insert([{ name: newCatName }]);
                await loadCategories();
                openCategoryManagerModal();
            }
        }

        async function deleteCategory(id) {
            await mySupabase.from('exam_categories').delete().eq('id', id);
            await loadCategories();
            openCategoryManagerModal();
        }

        async function deleteExam(id) {
            if ((await Swal.fire({ title: 'ยืนยันลบชุดข้อสอบนี้?', icon: 'warning', showCancelButton: true })).isConfirmed) {
                await mySupabase.from('exams').delete().eq('id', id);
                loadExams();
            }
        }

        initPage();
    </script>
</body>
</html>
