    <title>LMS | ศูนย์จัดการชุดข้อสอบ Hi-Tech</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        (function() {
            let hasSession = false;
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith('sb-') && key.endsWith('-auth-token')) {
                    const val = localStorage.getItem(key);
                    if (val && val.includes('access_token')) {
                        hasSession = true;
                        break;
                    }
                }
            }
            const fallbackId = localStorage.getItem('id') || localStorage.getItem('admin_id') || localStorage.getItem('user_id');
            if (!hasSession && !fallbackId) {
                window.location.replace('index.html');
            }
        })();
    </script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Prompt', 'sans-serif'] },
                    colors: { primary: '#0284c7', darkbg: '#020617', darkbox: '#090d16', darkinput: '#0f172a' }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .glass-nav { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(186, 230, 253, 0.5); }
        .dark .glass-nav { background: rgba(2, 6, 23, 0.88); border-bottom: 1px solid rgba(30, 58, 138, 0.4); }
        .hitech-card { background: rgba(255, 255, 255, 0.95); border: 1px solid rgba(186, 230, 253, 0.8); box-shadow: 0 10px 30px -10px rgba(2, 132, 199, 0.08); transition: all 0.25s ease; }
        .dark .hitech-card { background: rgba(9, 13, 22, 0.95); border: 1px solid rgba(30, 58, 138, 0.5); box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5); }
        
        .upcoming-banner-card {

            border: 1px solid rgba(245, 158, 11, 0.5);

        .dark .upcoming-banner-card {
            background: linear-gradient(135deg, rgba(69, 26, 3, 0.6) 0%, rgba(120, 53, 15, 0.4) 100%);

                        <button id="viewBtnList" onclick="switchViewMode('list')" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 text-slate-500 hover:text-slate-800 dark:hover:text-slate-200">

                    <button onclick="toggleAllCategories()" class="px-3 py-2 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 rounded-xl font-bold text-xs border border-slate-200 dark:border-slate-700 hover:bg-slate-200 transition-all flex items-center gap-1">

                    <button onclick="openCategoryManagerModal()" class="px-3.5 py-2 bg-indigo-50 dark:bg-indigo-950/40 text-indigo-600 dark:text-indigo-300 rounded-xl font-bold text-xs border border-indigo-200 dark:border-indigo-900 hover:bg-indigo-100 transition-all flex items-center gap-1.5">

            <div id="classroomExamsContainer" class="space-y-6">

    <script>
        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const filterCourseId = urlParams.get('course_id');

        let categoriesList = [];
        let allCoursesList = [];
        let coursesMap = {};
        let profilesNameMap = {};
        let currentExamsData = [];
        let allExamsRawData = [];
        let allAttemptsMap = {};
        let currentViewMode = localStorage.getItem('exam_view_mode') || 'grid';
        let isAllCollapsed = false;

        function isAttemptSubmitted(att) {
            return Boolean(
                att && (
                    att.status === 'submitted' ||
                    att.status === 'completed' ||
                    att.submitted_at ||
                    att.submission_time
                )
            );
        }

        function isFreeUnassignedExam(e) {
            if (!e) return false;
            const noCourse = !e.course_id || (Array.isArray(e.course_id) && e.course_id.length === 0);
            return Boolean(e.is_free_public || e.free_access || noCourse);
        }

        const htmlElement = document.documentElement;
        const themeIcon = document.getElementById('themeIcon');
        if (localStorage.getItem('theme') === 'dark') {
            htmlElement.classList.add('dark');
            themeIcon.classList.replace('fa-moon', 'fa-sun');
        }
        document.getElementById('themeToggle').addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            const isDark = htmlElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeIcon.classList.replace(isDark ? 'fa-moon' : 'fa-sun', isDark ? 'fa-sun' : 'fa-moon');
        });

        async function autoPostAnnouncementForExam(examTitle, examCode, courseId, status, isFree = false) {
            if (status !== 'public') return;
            try {
                let courseName = isFree ? 'โจทย์แจกฟรี (ไม่สังกัดคอร์ส)' : 'ทุกคอร์สเรียน';
                let targetTypeVal = 'all';
                let targetCourseVal = '';

                if (courseId && !isFree) {
                    let cId = Array.isArray(courseId) ? courseId[0] : courseId;
                    if (cId && coursesMap[cId]) {
                        courseName = coursesMap[cId].title;
                        targetTypeVal = 'course';
                        targetCourseVal = cId;
                    }
                }

                const payload = {
                    category: 'exam',
                    title: `📝 แจ้งเปิดข้อสอบใหม่: ${examTitle}`,
                    content: `ทางระบบได้เปิดชุดข้อสอบใหม่ "${examTitle}" (รหัส: ${examCode}) ใน "${courseName}" เรียบร้อยแล้ว สามารถเข้าทำข้อสอบตามกำหนดเวลา`,
                    target_type: targetTypeVal,
                    target_value: targetCourseVal,
                    created_at: new Date().toISOString()
                };

                await mySupabase.from('announcements').insert([payload]);
                await mySupabase.from('notifications').insert([{
                    type: 'exam',
                    title: `[ประกาศ] แจ้งเปิดข้อสอบใหม่: ${examTitle}`,
                    description: `เปิดชุดข้อสอบใหม่ใน ${courseName}`,
                    target_url: 'admin.html',
                    is_read: false,
                    created_at: new Date().toISOString()
                }]);
            } catch (err) {
                console.error('Failed to auto-create announcement:', err);
            }
        }

        function goBack() {
            if (filterCourseId) {
                window.location.href = `admin_course_detail.html?id=${filterCourseId}`;
            } else {
                window.location.href = 'admin.html';
            }
        }

        function clearCourseFilter() {
            if (filterCourseId) {
                window.location.href = `admin_course_detail.html?id=${filterCourseId}`;
            } else {
                window.location.href = 'admin_exams.html';
            }
        }

        async function initPage() {
            updateViewSwitcherButtons();
            await loadCategories();
            await loadCourses();
            await loadProfilesMap();
            await loadAttemptsData();
            await loadExams();

            if (filterCourseId) {
                const course = coursesMap[filterCourseId];
                if (course) {
                    document.getElementById('courseFilterBanner').classList.remove('hidden');
                    document.getElementById('filterCourseTitleName').textContent = course.title;
                    document.getElementById('navTitle').innerHTML = `<span class="w-7 h-7 rounded-lg bg-gradient-to-r from-purple-500 to-indigo-600 text-white flex items-center justify-center text-xs shadow-md"><i class="fas fa-file-signature"></i></span> ข้อสอบในคอร์ส: ${course.title}`;
                }
            }
        }

        function switchViewMode(mode) {
            currentViewMode = mode;
            localStorage.setItem('exam_view_mode', mode);
            updateViewSwitcherButtons();
            renderExamsContainer();
        }

        function updateViewSwitcherButtons() {
            const btnGrid = document.getElementById('viewBtnGrid');
            const btnList = document.getElementById('viewBtnList');
            if (currentViewMode === 'grid') {
                btnGrid.className = "px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 bg-white dark:bg-slate-900 shadow-sm text-sky-600 dark:text-sky-400";
                btnList.className = "px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 text-slate-500 hover:text-slate-800 dark:hover:text-slate-200";
            } else {
                btnList.className = "px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 bg-white dark:bg-slate-900 shadow-sm text-sky-600 dark:text-sky-400";
                btnGrid.className = "px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 text-slate-500 hover:text-slate-800 dark:hover:text-slate-200";
            }
        }

        async function loadCategories() {
            const { data } = await mySupabase.from('exam_categories').select('*').order('name');
            categoriesList = data || [];
        }

        async function loadCourses() {
            const { data } = await mySupabase.from('courses').select('id, title, course_code').order('title');
            allCoursesList = data || [];
            coursesMap = {};
            allCoursesList.forEach(c => { coursesMap[c.id] = c; });
        }

        async function loadProfilesMap() {
            profilesNameMap = {};
            const { data } = await mySupabase.from('profiles').select('id, full_name, username');
            if (data) {
                data.forEach(p => {
                    if (p.id) profilesNameMap[String(p.id)] = p.full_name || p.username || 'ไม่ระบุชื่อ';
                });
            }
        }

        async function loadAttemptsData() {
            const { data: attempts } = await mySupabase.from('exam_attempts').select('*');
            allAttemptsMap = {};
            if (attempts) {
                attempts.filter(att => isAttemptSubmitted(att)).forEach(att => {
                    const eId = String(att.exam_id);
                    if (!allAttemptsMap[eId]) allAttemptsMap[eId] = [];
                    const score = att.total_score !== undefined && att.total_score !== null ? Number(att.total_score) : (Number(att.score) || 0);
                    allAttemptsMap[eId].push(score);
                });
            }
        }

        async function loadExams() {
            const { data: exams, error } = await mySupabase.from('exams').select('*, exam_categories(id, name)').order('created_at', { ascending: false });
            
            let allExams = exams || [];
            const now = new Date();

            for (let e of allExams) {
                if (e.status === 'countdown' && e.start_time && new Date(e.start_time) <= now) {
                    e.status = 'public';
                    mySupabase.from('exams').update({ status: 'public' }).eq('id', e.id).then(() => {});
                }
            }

            allExamsRawData = allExams;

            let filteredExams = allExams;
            if (filterCourseId) {
                filteredExams = allExams.filter(e => {
                    if (!e.course_id) return false;
                    if (Array.isArray(e.course_id)) {
                        return e.course_id.includes(filterCourseId);
                    }
                    return String(e.course_id) === String(filterCourseId);
                });
            }

            currentExamsData = filteredExams;
            
            if (error || currentExamsData.length === 0) {
                document.getElementById('classroomExamsContainer').innerHTML = `<div class="hitech-card p-8 rounded-2xl text-center text-slate-400 text-xs">ยังไม่มีชุดข้อสอบในระบบ${filterCourseId ? 'ของคอร์สนี้' : ''}</div>`;
                document.getElementById('upcomingExamSection').classList.add('hidden');
                return;
            }

            const in48Hours = new Date(now.getTime() + 48 * 60 * 60 * 1000);
            const upcomingExams = currentExamsData.filter(e => e.status === 'countdown' && e.start_time && new Date(e.start_time) > now && new Date(e.start_time) <= in48Hours);

            const upcomingSec = document.getElementById('upcomingExamSection');
            const upcomingGrid = document.getElementById('upcomingExamsGrid');

            if (upcomingExams.length > 0) {
                upcomingSec.classList.remove('hidden');
                upcomingGrid.innerHTML = upcomingExams.map(e => {
                    const st = new Date(e.start_time);
                    const diffHours = Math.round((st - now) / (1000 * 60 * 60));
                    return `
                        <div class="upcoming-banner-card p-4 rounded-2xl space-y-2 border-l-4 border-l-amber-500">
                            <div class="flex justify-between items-start">
                                <span class="px-2 py-0.5 rounded-md bg-amber-500/20 text-amber-700 dark:text-amber-300 font-bold text-[10px]">
                                    <i class="fas fa-clock mr-1"></i> อีก ~${diffHours} ชม. จะเปิดบริการ
                                </span>
                                <span class="font-mono text-xs text-amber-600 dark:text-amber-400 font-bold">${e.exam_code || 'CODE'}</span>
                            </div>
                            <h4 class="font-bold text-slate-900 dark:text-white text-sm">${e.title}</h4>
                            <div class="text-[11px] text-slate-600 dark:text-slate-300">📅 เปิดสอบ: ${st.toLocaleString('th-TH')}</div>
                            <div class="pt-2">
                                <button onclick="window.location.href='admin_exam_editor.html?id=${e.id}'" class="w-full py-1.5 bg-amber-500 hover:bg-amber-600 text-white rounded-xl text-xs font-bold transition-all shadow-sm">
                                    เตรียมโจทย์ & เฉลย OMR
                                </button>
                            </div>
                        </div>
                    `;
                }).join('');
            } else {
                upcomingSec.classList.add('hidden');
            }

            renderExamsContainer();
        }

        function getExamAverageScore(examId) {
            const scores = allAttemptsMap[String(examId)] || [];
            if (scores.length === 0) return '-';
            const sum = scores.reduce((a, b) => a + b, 0);
            return (sum / scores.length).toFixed(1);
        }

        function getChoiceFormatLabel(fmt) {
            if (fmt === 'th_num') return 'ก, ข, ค, ง';
            if (fmt === 'upper') return 'A, B, C, D';
            if (fmt === 'lower') return 'a, b, c, d';
            return '1, 2, 3, 4';
        }

        async function renderExamsContainer() {
            const container = document.getElementById('classroomExamsContainer');
            if (currentExamsData.length === 0) return;

            const { data: essayQuestions } = await mySupabase.from('questions').select('exam_id').eq('question_type', 'essay');
            const examsWithEssay = new Set((essayQuestions || []).map(q => q.exam_id));

            const grouped = {};
            currentExamsData.forEach(e => {
                const catName = e.exam_categories?.name || 'ข้อสอบทั่วไป';
                if (!grouped[catName]) grouped[catName] = [];
                grouped[catName].push(e);
            });

            container.innerHTML = Object.keys(grouped).map((catName, idx) => {
                const catExams = grouped[catName];
                const catId = `cat-sec-${idx}`;

                let contentHtml = '';
                if (currentViewMode === 'grid') {
                    const cardsHtml = catExams.map(e => renderExamCard(e, examsWithEssay.has(e.id))).join('');
                    contentHtml = `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 pt-3">${cardsHtml}</div>`;
                } else {
                    const listRowsHtml = catExams.map(e => renderExamListRow(e, examsWithEssay.has(e.id))).join('');
                    contentHtml = `<div class="space-y-2.5 pt-3">${listRowsHtml}</div>`;
                }

                return `
                    <div class="hitech-card p-4 sm:p-5 rounded-2xl space-y-2">
                        <div onclick="toggleCategorySection('${catId}')" class="flex justify-between items-center cursor-pointer select-none border-b border-sky-500/20 pb-2.5">
                            <div class="flex items-center gap-2">
                                <i class="fas fa-chevron-down text-sky-500 transition-transform duration-200" id="icon-${catId}"></i>
                                <span class="w-3 h-5 bg-gradient-to-b from-sky-400 to-blue-600 rounded-full"></span>
                                <h3 class="font-extrabold text-base text-slate-900 dark:text-white">${catName}</h3>
                                <span class="px-2.5 py-0.5 rounded-full bg-sky-100 dark:bg-sky-950 text-sky-600 dark:text-sky-300 text-xs font-bold">${catExams.length} ชุด</span>
                            </div>
                            <span class="text-[11px] text-slate-400 font-semibold">คลิกเพื่อ ยุบ/ขยาย</span>

        async function duplicateExam(sourceExamId) {
            const confirmResult = await Swal.fire({
                title: 'ยืนยันการคัดลอกชุดข้อสอบ?',
                text: 'ระบบจะทำสำเนาข้อมูลชุดข้อสอบนี้ รวมถึงโจทย์ ตัวเลือก และเฉลยทั้งหมด พร้อมตั้งสถานะเป็น "ซ่อนอยู่ (Draft)" ให้โดยอัตโนมัติ',
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: 'ยืนยันคัดลอก',
                cancelButtonText: 'ยกเลิก'
            });

            if (!confirmResult.isConfirmed) return;

            try {
                Swal.fire({ title: 'กำลังคัดลอกชุดข้อสอบ...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

                const { data: sourceExam, error: fetchErr } = await mySupabase.from('exams').select('*').eq('id', sourceExamId).single();
                if (fetchErr || !sourceExam) throw new Error('ไม่พบข้อมูลชุดข้อสอบต้นฉบับ');

                const isFree = isFreeUnassignedExam(sourceExam);
                const newExamPayload = {
                    title: `${sourceExam.title} (สำเนา)`,
                    exam_code: `EXAM-${Math.floor(Math.random() * 9000 + 1000)}`,
                    delivery_type: sourceExam.delivery_type,
                    exam_type: sourceExam.exam_type,
                    choice_format: sourceExam.choice_format,
                    category_id: sourceExam.category_id,
                    course_id: isFree ? null : sourceExam.course_id,
                    is_free_public: isFree,
                    free_access: isFree,
                    time_limit: sourceExam.time_limit,
                    max_attempts: sourceExam.max_attempts,
                    status: 'draft',
                    show_answer_instantly: sourceExam.show_answer_instantly,
                    allow_late_submission: !!sourceExam.allow_late_submission,
                    start_time: sourceExam.start_time,
                    due_date: sourceExam.due_date,
                    created_at: new Date().toISOString()
                };

                let { data: insertedExam, error: insertExamErr } = await mySupabase.from('exams').insert([newExamPayload]).select().single();
                if (insertExamErr) {
                    const { is_free_public, free_access, ...fallbackPayload } = newExamPayload;
                    const fallbackRes = await mySupabase.from('exams').insert([fallbackPayload]).select().single();
                    insertedExam = fallbackRes.data;
                    insertExamErr = fallbackRes.error;
                }
                if (insertExamErr || !insertedExam) throw new Error(insertExamErr?.message || 'ไม่สามารถสร้างชุดข้อสอบใหม่ได้');

                const newExamId = insertedExam.id;

                const { data: sourceQuestions, error: qFetchErr } = await mySupabase.from('questions').select('*').eq('exam_id', sourceExamId);
                
                if (!qFetchErr && sourceQuestions && sourceQuestions.length > 0) {
                    for (const q of sourceQuestions) {
                        const { id: oldQId, exam_id, created_at, ...qData } = q;
                        qData.exam_id = newExamId;
                        await mySupabase.from('questions').insert([qData]);
                    }
                }

                if (typeof logSystemAction === 'function') {
                    await logSystemAction('ADMIN_DUPLICATE_EXAM', `แอดมินคัดลอกชุดข้อสอบจาก ID: ${sourceExamId} เป็น IDใหม่: ${newExamId}`, { source_exam_id: sourceExamId, new_exam_id: newExamId });
                }

                Swal.fire({
                    icon: 'success',
                    title: 'คัดลอกชุดข้อสอบสำเร็จ!',
                    text: `สร้างชุดข้อสอบ "${newExamPayload.title}" เรียบร้อยแล้ว`,
                    timer: 1500,
                    showConfirmButton: false
                });

                loadExams();
            } catch (err) {
                console.error('Duplicate Exam Error:', err);
                Swal.fire('เกิดข้อผิดพลาด', err.message || 'ไม่สามารถคัดลอกข้อสอบได้', 'error');
            }
        }

        async function openAttemptManager(examId, examTitle) {
            Swal.fire({ title: 'กำลังโหลดรายชื่อและประวัติ Attempt...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            if (Object.keys(profilesNameMap).length === 0) {
                await loadProfilesMap();
            }

            let { data: attempts, error } = await mySupabase
                .from('exam_attempts')
                .select('*')
                .eq('exam_id', examId)
                .order('created_at', { ascending: true });

            if (error) {
                const retryRes = await mySupabase
                    .from('exam_attempts')
                    .select('*')
                    .eq('exam_id', examId);
                attempts = retryRes.data || [];
                error = retryRes.error;
            }

            Swal.close();

            if (error) {
                Swal.fire('โหลดข้อมูลไม่สำเร็จ', error.message || 'ไม่สามารถดึงข้อมูลประวัติการสอบได้', 'error');
                return;
            }

            if (!attempts || attempts.length === 0) {
                Swal.fire('ไม่พบประวัติการสอบ', 'ยังไม่มีนักเรียนทำข้อสอบชุดนี้', 'info');
                return;
            }

            const studentAttemptCounter = {};
            const enrichedAttempts = attempts.map(att => {
                const sId = String(att.student_id || att.user_id || att.id);
                studentAttemptCounter[sId] = (studentAttemptCounter[sId] || 0) + 1;
                const resolvedName =
                    profilesNameMap[sId] ||
                    att.student_name ||
                    att.full_name ||
                    (sId.length > 8 ? `นักเรียน (${sId.slice(0, 6)}...)` : `นักเรียน (${sId})`);

                return {
                    ...att,
                    attemptNo: studentAttemptCounter[sId],
                    resolvedName
                };
            }).reverse();

            const renderAttemptRows = (list) => {
                if (list.length === 0) return `<div class="text-center py-4 text-slate-400 text-xs">ไม่พบรายชื่อนักเรียนที่ค้นหา</div>`;
                return list.map(att => {
                    const submitted = isAttemptSubmitted(att);
                    const rawScore = att.total_score !== undefined && att.total_score !== null ? att.total_score : (att.score ?? '-');
                    const submittedDateRaw = att.submission_time || att.submitted_at || (submitted ? att.created_at : null);
                    const submittedDateStr = submittedDateRaw ? new Date(submittedDateRaw).toLocaleString('th-TH') : '-';

                    const statusBadge = submitted
                        ? `<span class="px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-600 dark:text-emerald-400 font-bold text-[10px]">ส่งแล้ว</span>`
                        : `<span class="px-2 py-0.5 rounded-full bg-amber-500/15 text-amber-600 dark:text-amber-400 font-bold text-[10px]">ทำค้างอยู่</span>`;

                    return `
                        <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-2 p-3 bg-slate-100 dark:bg-slate-800 rounded-xl text-xs attempt-row border border-slate-200/60 dark:border-slate-700/60" data-name="${att.resolvedName.toLowerCase()}">
                            <div class="space-y-0.5">
                                <div class="flex items-center gap-2 flex-wrap">
                                    <span class="px-2 py-0.5 rounded-md bg-indigo-500/15 text-indigo-600 dark:text-indigo-300 font-mono font-bold text-[10px]">Attempt #${att.attemptNo}</span>
                                    <span class="font-bold text-slate-900 dark:text-white">${att.resolvedName}</span>
                                    ${statusBadge}
                                </div>
                                <div class="text-[11px] text-slate-600 dark:text-slate-300 flex flex-wrap items-center gap-3 pt-0.5">
                                    <span><i class="fas fa-star text-amber-500 mr-1"></i>คะแนน: <strong class="font-mono text-indigo-600 dark:text-indigo-400">${submitted ? rawScore : '-'}</strong></span>
                                    <span><i class="far fa-clock text-sky-500 mr-1"></i>เวลาที่ส่ง: <strong class="font-mono">${submitted ? submittedDateStr : '-'}</strong></span>
                                </div>

        window.filterAttemptList = function(keyword) {

        async function deleteAttemptRecord(attemptId, examId, examTitle) {
            const res = await Swal.fire({
                title: 'ยืนยัน Reset Attempt นี้?',
                text: 'ระบบจะลบข้อมูลรอบการสอบนี้เพื่อให้นักเรียนสามารถสอบใหม่ได้',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d97706',
                confirmButtonText: 'ยืนยัน Reset Attempt',
                cancelButtonText: 'ยกเลิก'
            });

            if (res.isConfirmed) {
                Swal.fire({ title: 'กำลัง Reset Attempt...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                const { error: ansErr } = await mySupabase.from('exam_answers').delete().eq('attempt_id', attemptId);
                if (ansErr) console.warn('exam_answers delete note:', ansErr.message);

                const { error: attErr } = await mySupabase.from('exam_attempts').delete().eq('id', attemptId);
                if (attErr) {
                    Swal.fire('Reset ไม่สำเร็จ', attErr.message || 'ไม่สามารถลบรอบการสอบได้', 'error');
                    return;
                }

                await loadAttemptsData();
                await renderExamsContainer();
                Swal.fire({ icon: 'success', title: 'Reset Attempt สำเร็จ!', timer: 1200, showConfirmButton: false });
                setTimeout(() => openAttemptManager(examId, examTitle), 350);
            }
        }

                        <div class="pt-2 border-t dark:border-slate-800">
                            <label class="block font-bold mb-1">สร้างหมวดหมู่ใหม่</label>
                            <input id="newCatInput" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border rounded-xl outline-none" placeholder="พิมพ์ชื่อหมวดหมู่ใหม่...">
                        </div>
                    </div>
                `,
                showCancelButton: true,
                confirmButtonText: '<i class="fas fa-plus mr-1"></i>เพิ่มหมวดหมู่',
                cancelButtonText: 'ปิด',
                preConfirm: () => document.getElementById('newCatInput').value.trim()
            });

            if (newCatName) {
                const { error } = await mySupabase.from('exam_categories').insert([{ name: newCatName }]);
                if (error) {
                    Swal.fire('เพิ่มหมวดหมู่ไม่สำเร็จ', error.message, 'error');
                    return;
                }
                await loadCategories();
                openCategoryManagerModal();
            }
        }

        async function renameCategory(catId, oldName) {
            const { value: updatedName } = await Swal.fire({
                title: 'แก้ไขชื่อหมวดหมู่',
                input: 'text',
                inputValue: oldName,
                inputPlaceholder: 'กรอกชื่อหมวดหมู่ใหม่',
                showCancelButton: true,
                confirmButtonText: 'บันทึกชื่อ',
                cancelButtonText: 'ยกเลิก',
                inputValidator: (val) => {
                    if (!val || !val.trim()) return 'กรุณากรอกชื่อหมวดหมู่';
                }
            });

            if (updatedName && updatedName.trim() !== oldName) {
                const cleanName = updatedName.trim();
                const { error } = await mySupabase.from('exam_categories').update({ name: cleanName }).eq('id', catId);
                if (error) {
                    Swal.fire('แก้ไขชื่อไม่สำเร็จ', error.message, 'error');
                    return;
                }
                await loadCategories();
                await loadExams();
                openCategoryManagerModal();
            }
        }

        async function openCategoryExamsEditor(catId, catName) {
            const inThisCat = allExamsRawData.filter(e => String(e.category_id || '') === String(catId));
            const unassignedExams = allExamsRawData.filter(e => !e.category_id);

            const inCatRows = inThisCat.length > 0
                ? inThisCat.map(e => `
                    <label class="flex items-center justify-between gap-2 p-2.5 bg-emerald-500/10 border border-emerald-500/25 rounded-xl cursor-pointer hover:bg-emerald-500/15 transition-all">
                        <div class="flex items-center gap-2.5 min-w-0">
                            <input type="checkbox" name="catExamCheckbox" value="${e.id}" checked class="w-4 h-4 rounded text-indigo-600 shrink-0">
                            <div class="min-w-0">
                                <div class="font-bold text-slate-900 dark:text-white truncate">${e.title}</div>
                                <div class="text-[10px] text-slate-500 font-mono">${e.exam_code || 'CODE'}</div>
                            </div>
                        </div>
                        <span class="px-2 py-0.5 bg-emerald-500/20 text-emerald-700 dark:text-emerald-300 rounded text-[10px] font-bold shrink-0">อยู่ในหมวดนี้</span>
                    </label>
                `).join('')
                : `<div class="text-center py-3 text-slate-400 text-[11px] bg-slate-50 dark:bg-slate-900/50 rounded-xl">ยังไม่มีชุดข้อสอบในหมวดหมู่นี้</div>`;

            const unassignedRows = unassignedExams.length > 0
                ? unassignedExams.map(e => `
                    <label class="flex items-center justify-between gap-2 p-2.5 bg-slate-100 dark:bg-slate-800 border border-slate-200/70 dark:border-slate-700/70 rounded-xl cursor-pointer hover:border-indigo-400 transition-all">
                        <div class="flex items-center gap-2.5 min-w-0">
                            <input type="checkbox" name="catExamCheckbox" value="${e.id}" class="w-4 h-4 rounded text-indigo-600 shrink-0">
                            <div class="min-w-0">
                                <div class="font-bold text-slate-900 dark:text-white truncate">${e.title}</div>
                                <div class="text-[10px] text-slate-500 font-mono">${e.exam_code || 'CODE'}</div>
                            </div>
                        </div>
                        <span class="px-2 py-0.5 bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300 rounded text-[10px] font-bold shrink-0">ยังไม่สังกัดหมวด</span>
                    </label>
                `).join('')
                : `<div class="text-center py-3 text-slate-400 text-[11px] bg-slate-50 dark:bg-slate-900/50 rounded-xl">ไม่มีชุดข้อสอบที่ว่าง (ชุดอื่นสังกัดหมวดหมู่อื่นอยู่แล้ว)</div>`;

            const { value: selectedIds } = await Swal.fire({
                title: `ชุดข้อสอบในหมวด: ${catName}`,
                width: '620px',
                html: `
                    <div class="space-y-3 text-left text-xs">
                        <div class="p-2.5 rounded-xl bg-amber-500/10 border border-amber-500/30 text-[11px] text-amber-800 dark:text-amber-300">
                            <strong>เงื่อนไข:</strong> 1 ชุดข้อสอบอยู่ได้เพียง 1 หมวดหมู่เท่านั้น — แสดงเฉพาะชุดที่อยู่ในหมวดนี้แล้ว และชุดที่ยังไม่มีหมวดหมู่ (หากติ๊กออก ชุดนั้นจะกลายเป็น "ยังไม่สังกัดหมวด")
                        </div>
                        <div class="space-y-1.5">
                            <div class="font-bold text-emerald-700 dark:text-emerald-400">ชุดที่อยู่ในหมวดหมู่นี้ (${inThisCat.length})</div>
                            <div class="space-y-1.5 max-h-40 overflow-y-auto pr-1">${inCatRows}</div>
                        </div>
                        <div class="space-y-1.5 pt-2 border-t dark:border-slate-800">
                            <div class="font-bold text-slate-700 dark:text-slate-300">ชุดที่ยังไม่มีหมวดหมู่ — ติ๊กเพื่อเพิ่มเข้าหมวดนี้ (${unassignedExams.length})</div>
                            <div class="space-y-1.5 max-h-44 overflow-y-auto pr-1">${unassignedRows}</div>
                        </div>
                    </div>
                `,
                showCancelButton: true,
                confirmButtonText: 'บันทึกการจัดหมวดหมู่',
                cancelButtonText: 'ย้อนกลับ',
                preConfirm: () => {
                    return Array.from(document.querySelectorAll('input[name="catExamCheckbox"]:checked')).map(cb => String(cb.value));
                }
            });

            if (Array.isArray(selectedIds)) {
                Swal.fire({ title: 'กำลังอัปเดตหมวดหมู่ชุดข้อสอบ...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

                const idsToAdd = selectedIds.filter(id => !inThisCat.some(e => String(e.id) === String(id)));
                const idsToRemove = inThisCat.filter(e => !selectedIds.includes(String(e.id))).map(e => e.id);

                if (idsToAdd.length > 0) {
                    const { error: addErr } = await mySupabase.from('exams').update({ category_id: catId }).in('id', idsToAdd);
                    if (addErr) {
                        Swal.fire('บันทึกไม่สำเร็จ', addErr.message, 'error');
                        return;
                    }
                }

                if (idsToRemove.length > 0) {
                    const { error: remErr } = await mySupabase.from('exams').update({ category_id: null }).in('id', idsToRemove);
                    if (remErr) {
                        Swal.fire('บันทึกไม่สำเร็จ', remErr.message, 'error');
                        return;
                    }
                }

                await loadExams();
                Swal.fire({ icon: 'success', title: 'อัปเดตหมวดหมู่เรียบร้อยแล้ว', timer: 1100, showConfirmButton: false });
                setTimeout(() => openCategoryManagerModal(), 300);
            } else {
                openCategoryManagerModal();
            }
        }

        async function deleteCategory(id) {
            const res = await Swal.fire({
                title: 'ยืนยันลบหมวดหมู่นี้?',
                text: 'ชุดข้อสอบที่เคยอยู่ในหมวดหมู่นี้จะเปลี่ยนเป็น "ยังไม่สังกัดหมวดหมู่"',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                confirmButtonText: 'ลบหมวดหมู่',
                cancelButtonText: 'ยกเลิก'
            });
            if (!res.isConfirmed) return;

            await mySupabase.from('exams').update({ category_id: null }).eq('category_id', id);
            await mySupabase.from('exam_categories').delete().eq('id', id);
            await loadCategories();
            await loadExams();
            openCategoryManagerModal();
        }

        async function deleteExam(id) {
            if ((await Swal.fire({ title: 'ยืนยันลบชุดข้อสอบนี้?', icon: 'warning', showCancelButton: true })).isConfirmed) {
                const { error } = await mySupabase.from('exams').delete().eq('id', id);
                
                if (!error && typeof logSystemAction === 'function') {
                    await logSystemAction('ADMIN_DELETE_EXAM', `แอดมินลบชุดข้อสอบ ID: ${id}`, { exam_id: id });
                }

                loadExams();
            }
        }

        initPage();
    </script>
</body>
</html>
