<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <script src="lms_core.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS | รายละเอียดคอร์สเรียน & จัดการวิดีโอ</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        (function() {
            let hasSession = false;
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith('sb-') && key.endsWith('-auth-token')) {
                    const val = localStorage.getItem(key);
                    if (val && val.includes('access_token')) { hasSession = true; break; }
                }
            }
            const fallbackId = localStorage.getItem('id') || localStorage.getItem('admin_id') || localStorage.getItem('user_id');
            if (!hasSession && !fallbackId) { window.location.replace('index.html'); }
        })();
    </script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Prompt', 'sans-serif'] },
                    colors: { primary: '#0284c7', darkbg: '#020617', darkbox: '#090d16', darkinput: '#0f172a' }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .glass-nav { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(186, 230, 253, 0.5); }
        .dark .glass-nav { background: rgba(2, 6, 23, 0.88); border-bottom: 1px solid rgba(30, 58, 138, 0.4); }
        .hitech-card { background: rgba(255, 255, 255, 0.95); border: 1px solid rgba(186, 230, 253, 0.8); box-shadow: 0 10px 30px -10px rgba(2, 132, 199, 0.08); transition: all 0.25s ease; }
        .dark .hitech-card { background: rgba(9, 13, 22, 0.95); border: 1px solid rgba(30, 58, 138, 0.5); box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5); }
        div:where(.swal2-container) { font-family: 'Prompt', sans-serif; }
        .dark .swal2-popup { background-color: #090d16 !important; color: #f8fafc !important; border: 1px solid #1e293b !important; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-darkbg min-h-screen text-slate-900 dark:text-slate-100 pb-24">

    <!-- Navbar -->
    <nav class="glass-nav fixed w-full top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-3">
                    <button onclick="window.location.href='admin_courses.html'" class="w-9 h-9 flex items-center justify-center rounded-xl bg-white dark:bg-darkinput text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-800 hover:bg-sky-600 hover:text-white transition-all shadow-sm">
                        <i class="fas fa-arrow-left text-sm"></i>
                    </button>
                    <h1 class="font-extrabold text-base text-slate-900 dark:text-white flex items-center gap-2">
                        <span class="w-7 h-7 rounded-lg bg-gradient-to-r from-sky-500 to-indigo-600 text-white flex items-center justify-center text-xs shadow-md"><i class="fas fa-book-open"></i></span>
                        รายละเอียดคอร์สเรียน & จัดการบทเรียน
                    </h1>
                </div>
                <div class="flex items-center gap-3">
                    <button id="themeToggle" class="w-9 h-9 flex items-center justify-center rounded-xl bg-white dark:bg-darkinput text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-800">
                        <i class="fas fa-moon text-sm" id="themeIcon"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 pt-24 space-y-6">
        
        <!-- Course Header Info Card -->
        <div class="hitech-card p-6 sm:p-8 rounded-3xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-l-8 border-l-sky-500">
            <div class="space-y-1">
                <span id="courseCodeBadge" class="px-3 py-1 bg-sky-500/10 text-sky-600 dark:text-sky-400 font-extrabold text-xs rounded-xl">--</span>
                <h2 id="courseTitleDisplay" class="text-xl sm:text-2xl font-extrabold text-slate-900 dark:text-white mt-1">กำลังโหลดข้อมูลคอร์ส...</h2>
                <p id="courseDescDisplay" class="text-xs sm:text-sm text-slate-600 dark:text-slate-400">--</p>
            </div>
            <div class="flex items-center gap-4 bg-slate-100 dark:bg-darkinput px-4 py-3 rounded-2xl border border-slate-200 dark:border-slate-800 shrink-0">
                <div class="w-10 h-10 rounded-xl bg-emerald-500/10 text-emerald-500 flex items-center justify-center font-bold text-lg"><i class="fas fa-users"></i></div>
                <div>
                    <span class="text-[10px] text-slate-400 font-bold block">นักเรียนที่ลงทะเบียน</span>
                    <span id="statStudentCount" class="text-base font-extrabold text-emerald-600 dark:text-emerald-400">0 คน</span>
                </div>
            </div>
        </div>

        <!-- Video Management Section -->
        <div class="hitech-card p-6 rounded-3xl space-y-4">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-3 pb-4 border-b border-sky-500/20">
                <div>
                    <h3 class="font-extrabold text-sm text-slate-900 dark:text-white flex items-center gap-2">
                        <i class="fas fa-film text-sky-500"></i> รายการวิดีโอบทเรียน Bunny Stream (ในคอร์สนี้)
                    </h3>
                    <span id="videoCountLabel" class="text-xs text-slate-400">แสดง 0 รายการ</span>
                </div>
                <button onclick="openAddVideoModal()" class="px-4 py-2.5 bg-sky-600 hover:bg-sky-500 text-white font-bold rounded-2xl text-xs shadow transition-all flex items-center gap-1.5 shrink-0">
                    <i class="fas fa-plus"></i> เพิ่มวิดีโอ Bunny ใหม่
                </button>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs border-collapse">
                    <thead>
                        <tr class="bg-slate-100 dark:bg-slate-800/80 font-bold border-b dark:border-slate-700">
                            <th class="p-3">ลำดับ</th>
                            <th class="p-3">ชื่อวิดีโอ / บทเรียน</th>
                            <th class="p-3">Bunny Video ID</th>
                            <th class="p-3 text-center">วันที่สร้าง</th>
                            <th class="p-3 text-center">จัดการ</th>
                        </tr>
                    </thead>
                    <tbody id="videoTableBody" class="divide-y divide-slate-100 dark:divide-slate-800">
                        <!-- Rendered dynamically -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script>
        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const courseId = urlParams.get('id') || urlParams.get('course_id');

        if (!courseId) {
            window.location.href = 'admin_courses.html';
        }

        let currentCourse = null;
        let courseLessons = [];

        const htmlElement = document.documentElement;
        const themeIcon = document.getElementById('themeIcon');
        if (localStorage.getItem('theme') === 'dark') {
            htmlElement.classList.add('dark');
            themeIcon.classList.replace('fa-moon', 'fa-sun');
        }
        document.getElementById('themeToggle').addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            const isDark = htmlElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeIcon.classList.replace(isDark ? 'fa-moon' : 'fa-sun', isDark ? 'fa-sun' : 'fa-moon');
        });

        async function initCourseDetail() {
            Swal.fire({ title: 'กำลังโหลดข้อมูลคอร์ส...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            try {
                // 1. ดึงข้อมูลคอร์สปัจจุบัน
                const { data: courseData, error: courseErr } = await mySupabase.from('courses').select('*').eq('id', courseId).maybeSingle();
                if (courseErr || !courseData) {
                    Swal.fire('ไม่พบคอร์สนี้', 'อาจถูกลบหรือไม่มีอยู่จริง', 'error').then(() => window.location.href = 'admin_courses.html');
                    return;
                }
                currentCourse = courseData;

                document.getElementById('courseCodeBadge').textContent = currentCourse.course_code || 'CRS';
                document.getElementById('courseTitleDisplay').textContent = currentCourse.title || 'ไม่มีชื่อคอร์ส';
                document.getElementById('courseDescDisplay').textContent = currentCourse.description || 'ไม่มีคำอธิบายคอร์ส';

                // 2. ดึงจำนวนนักเรียนที่ลงทะเบียน (รวมจากทั้งตาราง course_enrollments และ enrollments เพื่อความแม่นยำ)
                let totalStudents = new Set();
                const { data: en1 } = await mySupabase.from('course_enrollments').select('student_id').eq('course_id', courseId);
                if (en1) en1.forEach(e => totalStudents.add(e.student_id));

                const { data: en2 } = await mySupabase.from('enrollments').select('student_id').eq('course_id', courseId);
                if (en2) en2.forEach(e => totalStudents.add(e.student_id));

                document.getElementById('statStudentCount').textContent = `${totalStudents.size} คน`;

                // 3. ดึงข้อมูลบทเรียน/วิดีโอเฉพาะคอร์สนี้
                const { data: lessonData } = await mySupabase.from('course_lessons').select('*').eq('course_id', courseId);
                courseLessons = (lessonData || []).map(l => ({
                    id: l.id,
                    title: l.title || 'ไม่มีชื่อหัวข้อ',
                    course_id: String(l.course_id || ''),
                    bunny_video_id: l.bunny_video_id || l.video_url || '',
                    created_at: l.created_at || new Date().toISOString()
                }));

            } catch (err) {
                console.error("Error loading detail:", err);
            } finally {
                Swal.close();
            }

            renderVideoList();
        }

        function renderVideoList() {
            const tbody = document.getElementById('videoTableBody');
            const countLabel = document.getElementById('videoCountLabel');
            if (!tbody) return;

            countLabel.textContent = `แสดง ${courseLessons.length} รายการ`;

            if (courseLessons.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-10 text-slate-400">ยังไม่มีวิดีโอบทเรียนในคอร์สนี้</td></tr>`;
                return;
            }

            tbody.innerHTML = courseLessons.map((v, idx) => {
                const dateStr = v.created_at ? new Date(v.created_at).toLocaleDateString('th-TH') : '-';
                return `
                    <tr class="hover:bg-slate-50 dark:hover:bg-slate-800/40 transition-colors">
                        <td class="p-3 font-mono font-bold">${idx + 1}</td>
                        <td class="p-3 font-bold text-slate-900 dark:text-white flex items-center gap-2">
                            <i class="fas fa-play-circle text-sky-500 text-sm"></i>
                            <span class="line-clamp-1">${v.title}</span>
                        </td>
                        <td class="p-3 font-mono text-indigo-600 dark:text-indigo-400 text-[11px]">${v.bunny_video_id || '-'}</td>
                        <td class="p-3 text-center text-slate-400 text-[11px]">${dateStr}</td>
                        <td class="p-3 text-center flex items-center justify-center gap-1.5">
                            <button onclick="openEditVideoModal('${v.id}')" class="px-2.5 py-1 bg-amber-500/10 text-amber-600 hover:bg-amber-500 hover:text-white rounded-lg font-bold text-[11px] transition-all" title="แก้ไขข้อมูล">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button onclick="deleteVideo('${v.id}')" class="px-2.5 py-1 bg-rose-500/10 text-rose-600 hover:bg-rose-500 hover:text-white rounded-lg font-bold text-[11px] transition-all" title="ลบวิดีโอ">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        async function openAddVideoModal() {
            const isDark = document.documentElement.classList.contains('dark');

            const { value: formValues } = await Swal.fire({
                title: '🎬 เพิ่มวิดีโอ Bunny.net ใหม่',
                width: '550px',
                html: `
                    <div class="space-y-3 text-left text-xs">
                        <div>
                            <label class="block font-bold mb-1">คอร์สปัจจุบัน</label>
                            <input class="w-full px-3 py-2 bg-slate-100 dark:bg-slate-800 border rounded-xl outline-none font-bold" value="[${currentCourse.course_code || 'CRS'}] ${currentCourse.title}" disabled>
                        </div>
                        <div>
                            <label class="block font-bold mb-1">ชื่อหัวข้อวิดีโอ / บทเรียน <span class="text-red-500">*</span></label>
                            <input id="swalVideoTitle" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border rounded-xl outline-none font-bold" placeholder="เช่น EP.1 แนะนำพื้นฐานอัลกอริทึม">
                        </div>
                        <div>
                            <label class="block font-bold mb-1">Bunny Video ID (รหัสยาวๆ จาก Bunny Dashboard) <span class="text-red-500">*</span></label>
                            <input id="swalVideoBunnyId" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border rounded-xl outline-none font-mono" placeholder="เช่น e2e146be-d370-444f-891b-e1692e950e4f">
                        </div>
                    </div>
                `,
                showCancelButton: true,
                confirmButtonText: 'บันทึกวิดีโอ',
                confirmButtonColor: '#0284c7',
                cancelButtonColor: '#ef4444',
                background: isDark ? '#090d16' : '#ffffff',
                color: isDark ? '#f1f5f9' : '#1e293b',
                preConfirm: () => {
                    const title = document.getElementById('swalVideoTitle').value.trim();
                    const bunnyId = document.getElementById('swalVideoBunnyId').value.trim();
                    if (!title || !bunnyId) {
                        Swal.showValidationMessage('กรุณากรอกชื่อหัวข้อและ Bunny Video ID ให้ครบถ้วน');
                        return false;
                    }
                    return { course_id: courseId, title, bunny_video_id: bunnyId, video_url: bunnyId };
                }
            });

            if (formValues) {
                Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                
                const { error } = await mySupabase.from('course_lessons').insert([formValues]);
                if (error) {
                    Swal.fire('เกิดข้อผิดพลาด', error.message, 'error');
                    return;
                }

                Swal.fire({ icon: 'success', title: 'เพิ่มวิดีโอสำเร็จ!', timer: 1200, showConfirmButton: false });
                initCourseDetail();
            }
        }

        async function openEditVideoModal(videoId) {
            const video = courseLessons.find(v => String(v.id) === String(videoId));
            if (!video) return;
            const isDark = document.documentElement.classList.contains('dark');

            const { value: formValues } = await Swal.fire({
                title: '✏️ แก้ไขข้อมูลวิดีโอ Bunny',
                width: '550px',
                html: `
                    <div class="space-y-3 text-left text-xs">
                        <div>
                            <label class="block font-bold mb-1">ชื่อหัวข้อวิดีโอ <span class="text-red-500">*</span></label>
                            <input id="swalEditTitle" value="${video.title}" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border rounded-xl outline-none font-bold">
                        </div>
                        <div>
                            <label class="block font-bold mb-1">Bunny Video ID <span class="text-red-500">*</span></label>
                            <input id="swalEditBunnyId" value="${video.bunny_video_id}" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border rounded-xl outline-none font-mono">
                        </div>
                    </div>
                `,
                showCancelButton: true,
                confirmButtonText: 'บันทึกการแก้ไข',
                confirmButtonColor: '#0284c7',
                cancelButtonColor: '#ef4444',
                background: isDark ? '#090d16' : '#ffffff',
                color: isDark ? '#f1f5f9' : '#1e293b',
                preConfirm: () => {
                    const title = document.getElementById('swalEditTitle').value.trim();
                    const bunnyId = document.getElementById('swalEditBunnyId').value.trim();
                    if (!title || !bunnyId) {
                        Swal.showValidationMessage('กรุณากรอกข้อมูลให้ครบถ้วน');
                        return false;
                    }
                    return { title, bunny_video_id: bunnyId, video_url: bunnyId };
                }
            });

            if (formValues) {
                Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                
                const { error } = await mySupabase.from('course_lessons').update(formValues).eq('id', videoId);
                if (error) {
                    Swal.fire('เกิดข้อผิดพลาด', error.message, 'error');
                    return;
                }

                Swal.fire({ icon: 'success', title: 'อัปเดตข้อมูลสำเร็จ!', timer: 1200, showConfirmButton: false });
                initCourseDetail();
            }
        }

        async function deleteVideo(videoId) {
            const { isConfirmed } = await Swal.fire({
                title: 'ลบวิดีโอนี้?',
                text: 'การกระทำนี้จะไม่สามารถย้อนกลับได้',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                confirmButtonText: 'ยืนยันลบ',
                cancelButtonText: 'ยกเลิก'
            });

            if (isConfirmed) {
                await mySupabase.from('course_lessons').delete().eq('id', videoId);
                initCourseDetail();
                Swal.fire({ icon: 'success', title: 'ลบเรียบร้อย', timer: 1000, showConfirmButton: false });
            }
        }

        initCourseDetail();
    </script>
</body>
</html>
