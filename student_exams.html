<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRUDREAM LAND | คลังชุดข้อสอบนักเรียน</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { 
                extend: { 
                    fontFamily: { sans: ['Prompt', 'sans-serif'] }, 
                    colors: { primary: '#0284c7', navy: '#0f172a', darkbg: '#090d16' } 
                } 
            }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .glass-nav { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(226, 232, 240, 0.8); }
        .dark .glass-nav { background: rgba(9, 13, 22, 0.95); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(30, 41, 59, 0.8); }
        .glossy-card { background: #ffffff; border: 1px solid rgba(226, 232, 240, 1); box-shadow: 0 10px 25px -5px rgba(2, 132, 199, 0.08); transition: all 0.2s ease; }
        .dark .glossy-card { background: #0f172a; border: 1px solid rgba(30, 41, 59, 1); }
        .glossy-card:hover { transform: translateY(-2px); box-shadow: 0 15px 30px -5px rgba(2, 132, 199, 0.15); }
        div:where(.swal2-container) { font-family: 'Prompt', sans-serif; }
        .dark .swal2-popup { background-color: #090d16 !important; color: #f8fafc !important; border: 1px solid #1e293b !important; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-darkbg min-h-screen text-slate-900 dark:text-slate-100">

    <nav class="glass-nav fixed w-full top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 h-20 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <button onclick="window.location.href='student.html'" class="w-11 h-11 flex items-center justify-center rounded-2xl bg-white dark:bg-slate-800 border text-slate-700 dark:text-slate-200 transition-all hover:border-sky-500 shadow-sm"><i class="fas fa-arrow-left"></i></button>
                <h1 class="font-extrabold text-xl text-slate-900 dark:text-white">คลังข้อสอบทั้งหมด</h1>
            </div>

            <div class="flex items-center gap-3">
                <button onclick="logoutStudent()" class="px-4 py-2.5 bg-rose-50 dark:bg-rose-950/40 text-rose-600 dark:text-rose-400 rounded-2xl font-bold text-xs border border-rose-200 dark:border-rose-900 transition-all hover:bg-rose-100">
                    <i class="fas fa-sign-out-alt mr-1"></i> ออกจากระบบ
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 pt-32 pb-20 space-y-8">
        <div id="studentExamsFullContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full text-center py-12 text-slate-400 text-xs">กำลังโหลดคลังชุดข้อสอบ...</div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // ระบบตรวจสอบการเข้าสู่ระบบ (Auth Guard)
        function checkStudentAuth() {
            const studentId = localStorage.getItem('id') || localStorage.getItem('student_id') || localStorage.getItem('user_id');
            if (!studentId) {
                Swal.fire({
                    icon: 'warning',
                    title: 'ยังไม่ได้เข้าสู่ระบบ!',
                    text: 'กรุณาเข้าสู่ระบบใหม่อีกครั้งเพื่อเข้าดูคลังข้อสอบ',
                    confirmButtonText: 'ไปหน้าเข้าสู่ระบบ',
                    allowOutsideClick: false
                }).then(() => {
                    window.location.href = 'index.html';
                });
                return false;
            }

            const currentUsername = localStorage.getItem('student_username') || 
                                    localStorage.getItem('user_name') || 
                                    localStorage.getItem('account_name') || 
                                    localStorage.getItem('full_name') || 
                                    localStorage.getItem('user') || 
                                    'นักเรียน';

            localStorage.setItem('student_username', currentUsername);
            return true;
        }
        
        async function initPage() {
            if (!checkStudentAuth()) return;
            
            const { data: exams, error } = await mySupabase.from('exams').select('*, exam_categories(name)').in('status', ['public', 'countdown']).order('created_at', { ascending: false });
            
            const container = document.getElementById('studentExamsFullContainer');

            if (error || !exams || exams.length === 0) {
                container.innerHTML = `<div class="col-span-full glossy-card p-8 rounded-3xl text-center text-slate-400 text-xs">ยังไม่มีชุดข้อสอบเปิดให้บริการในขณะนี้</div>`;
                return;
            }

            container.innerHTML = exams.map(e => `
                <div class="glossy-card p-6 rounded-3xl space-y-4 flex flex-col justify-between">
                    <div class="space-y-2">
                        <div class="flex justify-between items-start">
                            <span class="px-2.5 py-0.5 rounded-lg bg-sky-50 dark:bg-sky-950 text-sky-600 dark:text-sky-400 font-mono font-bold text-[10px] border">CODE: ${e.exam_code || 'EXAM'}</span>
                            <span class="px-2 py-0.5 rounded-full bg-emerald-50 dark:bg-emerald-950 text-emerald-600 dark:text-emerald-400 font-bold text-[10px]">เปิดบริการ</span>
                        </div>
                        <h4 class="font-bold text-base text-slate-900 dark:text-white leading-snug">${e.title}</h4>
                        <div class="text-xs text-slate-500 space-y-1 pt-1">
                            <div><i class="far fa-clock text-sky-600 mr-1.5"></i> เวลาทำสอบ: <strong>${e.time_limit || 60} นาที</strong></div>
                            <div><i class="fas fa-calendar-alt text-indigo-500 mr-1.5"></i> กำหนดส่ง: <strong>${e.due_date ? new Date(e.due_date).toLocaleString('th-TH') : 'ไม่จำกัด'}</strong></div>
                        </div>
                    </div>
                    <button onclick="window.location.href='exam_take.html?id=${e.id}'" class="w-full py-3 bg-sky-600 hover:bg-sky-700 text-white font-bold text-xs rounded-2xl shadow-lg shadow-sky-500/25 transition-all flex items-center justify-center gap-1.5">
                        <i class="fas fa-pen-to-square"></i> เริ่มทำข้อสอบ
                    </button>
                </div>
            `).join('');
        }

        async function logoutStudent() {
            Swal.fire({ 
                title: 'ออกจากระบบ?', 
                icon: 'question', 
                showCancelButton: true, 
                confirmButtonText: 'ออกจากระบบ', 
                cancelButtonText: 'ยกเลิก' 
            }).then(res => { 
                if (res.isConfirmed) {
                    localStorage.clear();
                    window.location.href = 'index.html'; 
                }
            });
        }

        initPage();
    </script>
</body>
</html>
