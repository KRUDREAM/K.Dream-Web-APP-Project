<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <script src="lms_core.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRUDREAM LAND | ศูนย์รวมคอร์สทดลองเรียนฟรี</title>
    
    <link rel="icon" type="image/jpeg" sizes="512x512" href="logo.jpg">
    <link rel="apple-touch-icon" href="logo.jpg">

    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Prompt', 'sans-serif'] },
                    colors: { primary: '#0284c7', darkbg: '#060913', darkbox: '#0f172a', darkinput: '#1e293b' }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; overflow-x: hidden; }
        .glass-nav { background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.4); box-shadow: 0 10px 30px 0 rgba(31, 38, 135, 0.04); }
        .dark .glass-nav { background: rgba(9, 13, 22, 0.75); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.06); box-shadow: 0 10px 30px 0 rgba(0, 0, 0, 0.3); }
        
        .glass-card { 
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 20px 40px -15px rgba(31, 38, 135, 0.07);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .dark .glass-card { 
            background: rgba(15, 23, 42, 0.78);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.4);
        }
        .glass-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 30px 60px -12px rgba(16, 185, 129, 0.2);
            border-color: rgba(16, 185, 129, 0.4);
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
        .dark .glass-input {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(51, 65, 85, 0.8);
        }

        .glow-btn-emerald {
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.45);
            transition: all 0.3s ease;
        }
        .glow-btn-emerald:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px -5px rgba(16, 185, 129, 0.6);
        }

        .bg-glow-blob {
            position: absolute;
            width: 550px;
            height: 550px;
            background: linear-gradient(180deg, rgba(16, 185, 129, 0.15) 0%, rgba(56, 189, 248, 0.15) 100%);
            filter: blur(90px);
            border-radius: 50%;
            z-index: -1;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-darkbg min-h-screen text-slate-900 dark:text-slate-100 pb-24 relative">

    <div class="bg-glow-blob top-10 left-[-5%]"></div>
    <div class="bg-glow-blob bottom-20 right-[-5%]"></div>

    <!-- Navbar -->
    <nav class="glass-nav fixed w-full top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <div class="flex items-center gap-3">
                    <div class="w-11 h-11 rounded-2xl overflow-hidden shadow-lg border border-emerald-500/30">
                        <img src="logo.jpg" alt="Logo" class="w-full h-full object-cover">
                    </div>
                    <div>
                        <h1 class="font-black text-base sm:text-lg text-slate-900 dark:text-white tracking-tight">KRUDREAM LAND</h1>
                        <p class="text-[10px] text-emerald-600 dark:text-emerald-400 font-bold">ศูนย์รวมคอร์สทดลองเรียนฟรี</p>
                    </div>
                </div>

                <!-- Tab เมนูด้านบน -->
                <div class="hidden md:flex items-center gap-1.5 glass-input p-1.5 rounded-2xl">
                    <a href="index.html" class="px-4 py-2 rounded-xl text-xs font-bold text-slate-600 dark:text-slate-300 hover:text-emerald-600 transition">
                        <i class="fas fa-home mr-1.5"></i> หน้าแรก
                    </a>
                    <a href="catalog.html" class="px-4 py-2 rounded-xl text-xs font-bold text-slate-600 dark:text-slate-300 hover:text-emerald-600 transition">
                        <i class="fas fa-book-open mr-1.5"></i> แคตตาล็อกคอร์ส
                    </a>
                    <a href="trial_courses.html" class="px-4 py-2 rounded-xl text-xs font-bold bg-emerald-600 text-white shadow-md shadow-emerald-500/25">
                        <i class="fas fa-play-circle mr-1.5"></i> ทดลองเรียนฟรี
                    </a>
                </div>

                <div class="flex items-center gap-2.5">
                    <button onclick="goToStudentPortal()" class="px-4 py-2.5 bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 rounded-2xl text-xs font-bold transition hover:bg-emerald-500/20 border border-emerald-500/20 flex items-center gap-1.5 shadow-sm backdrop-blur-md">
                        <i class="fas fa-user-circle"></i> <span>ระบบนักเรียน</span>
                    </button>
                    <button id="themeToggle" class="w-11 h-11 flex items-center justify-center rounded-2xl glass-input text-slate-700 dark:text-slate-200 shadow-sm transition hover:border-emerald-500">
                        <i class="fas fa-moon text-sm" id="themeIcon"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-32 space-y-6">
        
        <!-- Header Banner -->
        <div class="glass-card p-8 rounded-[2.5rem] flex flex-col md:flex-row justify-between items-start md:items-center gap-6 border-emerald-500/30 bg-gradient-to-r from-emerald-500/[0.05] via-transparent to-sky-500/[0.05]">
            <div class="space-y-2">
                <span class="inline-flex items-center gap-1.5 px-3.5 py-1.5 bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 rounded-full text-xs font-extrabold border border-emerald-500/20">
                    <i class="fas fa-rocket"></i> ฟรีไม่มีค่าใช้จ่าย
                </span>
                <h2 class="text-2xl sm:text-3xl font-black text-slate-900 dark:text-white tracking-tight">คอร์สทดลองเรียนคุณภาพสูง</h2>
                <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 font-light max-w-2xl leading-relaxed">
                    สัมผัสบรรยากาศการเรียนและเนื้อหาตัวอย่างจากหลักสูตรจริงของเรา ทดลองเรียนได้ทันทีโดยไม่ต้องลงทะเบียนซับซ้อน
                </p>
            </div>
            <div class="w-full md:w-auto">
                <div class="glass-input px-5 py-3 rounded-2xl flex items-center gap-3">
                    <i class="fas fa-video text-emerald-500 text-lg"></i>
                    <div>
                        <div class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">บทเรียนทดลองทั้งหมด</div>
                        <div class="text-base font-black text-slate-800 dark:text-white" id="trialCount">- คอร์ส</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Trial Courses Grid (ดึงเฉพาะคอร์สที่เป็น trial จากฐานข้อมูลตาราง courses) -->
        <div id="trialGridContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="glass-card p-12 rounded-3xl text-center text-slate-400 text-xs col-span-full">
                <i class="fas fa-spinner fa-spin text-2xl text-emerald-500 mb-2"></i>
                <p class="font-medium">กำลังโหลดคอร์สทดลองเรียน...</p>
            </div>
        </div>

    </main>

    <!-- Modal เล่นวิดีโอ หรือดูรายละเอียดคอร์สทดลองเรียน -->
    <div id="trialModal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-md hidden flex items-center justify-center p-4">
        <div class="glass-card w-full max-w-2xl p-6 sm:p-8 rounded-[2.5rem] shadow-2xl relative max-h-[90vh] overflow-y-auto border border-white/20 space-y-4">
            <button onclick="closeTrialModal()" class="absolute top-6 right-6 w-9 h-9 flex items-center justify-center rounded-2xl glass-input text-slate-500 hover:text-red-500 transition shadow-md z-20">
                <i class="fas fa-xmark text-sm font-bold"></i>
            </button>
            <div id="trialModalContent" class="space-y-4">
                <!-- เนื้อหาและวิดีโอตัวอย่างจะถูกเรนเดอร์ตรงนี้ -->
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let trialCoursesList = [];
        let currentStudentId = localStorage.getItem('student_id') || localStorage.getItem('id');

        const htmlElement = document.documentElement;
        const themeIcon = document.getElementById('themeIcon');
        if (localStorage.getItem('theme') === 'dark') {
            htmlElement.classList.add('dark');
            themeIcon.classList.replace('fa-moon', 'fa-sun');
        }
        document.getElementById('themeToggle').addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            const isDark = htmlElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeIcon.classList.replace(isDark ? 'fa-moon' : 'fa-sun', isDark ? 'fa-sun' : 'fa-moon');
        });

        function goToStudentPortal() {
            window.location.href = currentStudentId ? `student_portal.html?student_id=${currentStudentId}` : 'student_portal.html';
        }

        async function fetchTrialCourses() {
            const container = document.getElementById('trialGridContainer');
            try {
                // ดึงข้อมูลจากตาราง courses และกรองเฉพาะ course_type === 'trial'
                const { data: courses, error } = await mySupabase
                    .from('courses')
                    .select('*')
                    .eq('course_type', 'trial')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                trialCoursesList = courses || [];
                document.getElementById('trialCount').textContent = `${trialCoursesList.length} คอร์ส`;

                if (trialCoursesList.length === 0) {
                    container.innerHTML = `
                        <div class="glass-card p-12 rounded-[2rem] text-center text-slate-400 text-xs col-span-full space-y-3">
                            <i class="fas fa-film text-4xl text-emerald-500/50"></i>
                            <div class="font-bold text-sm text-slate-700 dark:text-slate-200">ยังไม่มีคอร์สทดลองเรียนในขณะนี้</div>
                            <p class="text-xs text-slate-400">โปรดติดตามอัปเดตคอร์สทดลองเรียนใหม่ๆ เร็วๆ นี้</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = trialCoursesList.map(c => {
                    const coverImg = c.image_url || 'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=600&auto=format&fit=crop&q=80';
                    const title = c.title || 'คอร์สทดลองเรียน';
                    const desc = c.description || 'เนื้อหาตัวอย่างเข้มข้น ทดลองเรียนได้ฟรี';
                    const code = c.course_code || 'TRIAL';

                    return `
                        <div class="glass-card rounded-[2rem] overflow-hidden flex flex-col justify-between group">
                            <div>
                                <div class="aspect-video w-full relative overflow-hidden bg-slate-900/5 dark:bg-slate-800/50 flex items-center justify-center p-2">
                                    <img src="${coverImg}" alt="${title}" class="w-full h-full object-cover rounded-2xl group-hover:scale-105 transition-transform duration-500">
                                    <div class="absolute top-3 left-3 bg-black/70 backdrop-blur-md text-white font-mono font-bold text-[10px] px-3 py-1 rounded-xl">
                                        ${code}
                                    </div>
                                    <div class="absolute top-3 right-3 bg-emerald-500 text-white font-bold text-[10px] px-2.5 py-1 rounded-xl shadow">
                                        <i class="fas fa-play mr-1"></i> ฟรี
                                    </div>
                                </div>
                                <div class="p-6 space-y-2.5">
                                    <h3 class="font-extrabold text-base text-slate-900 dark:text-white line-clamp-1">${title}</h3>
                                    <p class="text-xs text-slate-500 dark:text-slate-400 leading-relaxed line-clamp-2">${desc}</p>
                                </div>
                            </div>
                            <div class="p-6 pt-0 border-t border-slate-100/50 dark:border-slate-800/50 mt-4">
                                <button onclick="openTrialDetail('${c.id}')" class="w-full py-3 glow-btn-emerald text-white rounded-2xl text-xs font-bold transition flex items-center justify-center gap-2 shadow-md">
                                    <i class="fas fa-play-circle"></i> เริ่มต้นทดลองเรียน
                                </button>
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                console.error("Fetch Trial Courses Error:", err);
                container.innerHTML = `
                    <div class="glass-card p-12 rounded-[2rem] text-center text-rose-500 text-xs col-span-full">
                        <i class="fas fa-exclamation-triangle text-2xl mb-2"></i>
                        <p>เกิดข้อผิดพลาดในการโหลดคอร์สทดลองเรียน กรุณาลองใหม่อีกครั้ง</p>
                    </div>
                `;
            }
        }

        async function openTrialDetail(courseId) {
            const course = trialCoursesList.find(c => String(c.id) === String(courseId));
            if (!course) return;

            // ดึงข้อมูลวิดีโอหรือเนื้อหาตัวอย่างจากตารางบทเรียนหรือเนื้อหาในคอร์ส (อ้างอิงจากระบบ admin_course_detail)
            Swal.fire({ title: 'กำลังโหลดบทเรียน...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            
            let lessons = [];
            try {
                const { data: lessonData } = await mySupabase
                    .from('lessons')
                    .select('*')
                    .eq('course_id', courseId)
                    .order('created_at', { ascending: true });
                lessons = lessonData || [];
            } catch (e) {
                console.warn("Could not load lessons:", e);
            }

            Swal.close();

            let lessonsHtml = lessons.length === 0 ? `
                <div class="text-center py-8 text-slate-400 text-xs">
                    <i class="fas fa-info-circle text-2xl mb-2 text-emerald-500"></i>
                    <p>คอร์สนี้กำลังอยู่ในระหว่างการอัปเดตวิดีโอตัวอย่าง</p>
                </div>
            ` : lessons.map((l, index) => `
                <div class="p-4 glass-input rounded-2xl flex items-center justify-between gap-3 hover:border-emerald-500 transition">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-xl bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 flex items-center justify-center font-bold text-xs">
                            ${index + 1}
                        </div>
                        <div>
                            <div class="font-bold text-xs text-slate-800 dark:text-white">${l.title || 'บทเรียนที่ ' + (index + 1)}</div>
                            <div class="text-[10px] text-slate-400">${l.duration || 'วิดีโอตัวอย่าง'}</div>
                        </div>
                    </div>
                    <button onclick="playLessonVideo('${l.video_url || ''}', '${l.title || ''}')" class="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-[11px] font-bold transition shadow-sm flex items-center gap-1.5">
                        <i class="fas fa-play"></i> ดูวิดีโอ
                    </button>
                </div>
            `).join('');

            document.getElementById('trialModalContent').innerHTML = `
                <div class="space-y-4">
                    <div class="aspect-video w-full rounded-2xl overflow-hidden bg-slate-900 flex items-center justify-center relative border border-white/10">
                        <img src="${course.image_url || ''}" class="w-full h-full object-cover opacity-60">
                        <div class="absolute inset-0 flex flex-col items-center justify-center p-4 text-center space-y-2 bg-black/40 backdrop-blur-xs">
                            <span class="w-14 h-14 rounded-full bg-emerald-500 text-white flex items-center justify-center text-xl shadow-xl animate-pulse cursor-pointer" onclick="playFirstAvailableLesson()">
                                <i class="fas fa-play ml-1"></i>
                            </span>
                            <h4 class="font-extrabold text-sm text-white">${course.title}</h4>
                            <p class="text-[11px] text-slate-200">คลิกเพื่อเริ่มรับชมบทเรียนตัวอย่างฟรี</p>
                        </div>
                    </div>
                    <div class="space-y-2">
                        <span class="px-2.5 py-1 bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 rounded-lg text-[10px] font-bold">รหัส: ${course.course_code || 'TRIAL'}</span>
                        <h3 class="text-xl font-black text-slate-900 dark:text-white">${course.title}</h3>
                        <p class="text-xs text-slate-500 dark:text-slate-400 leading-relaxed">${course.description || 'ไม่มีรายละเอียดเพิ่มเติม'}</p>
                    </div>

                    <div class="pt-4 border-t border-slate-200/60 dark:border-slate-800 space-y-3">
                        <h4 class="font-extrabold text-xs text-slate-800 dark:text-white flex items-center gap-2">
                            <i class="fas fa-list-ul text-emerald-500"></i> รายการบทเรียนทดลอง (${lessons.length})
                        </h4>
                        <div class="space-y-2 max-h-60 overflow-y-auto pr-1">
                            ${lessonsHtml}
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('trialModal').classList.remove('hidden');
        }

        function closeTrialModal() {
            document.getElementById('trialModal').classList.add('hidden');
        }

        function playLessonVideo(videoUrl, title) {
            if (!videoUrl) {
                Swal.fire('ขออภัย', 'ยังไม่มีลิงก์วิดีโอสำหรับบทเรียนนี้', 'info');
                return;
            }
            // แปลงลิงก์ YouTube ให้เป็นแบบ Embed ถ้าจำเป็น
            let embedUrl = videoUrl;
            if (videoUrl.includes('watch?v=')) {
                embedUrl = videoUrl.replace('watch?v=', 'embed/');
            } else if (videoUrl.includes('youtu.be/')) {
                embedUrl = videoUrl.replace('youtu.be/', 'www.youtube.com/embed/');
            }

            Swal.fire({
                title: title || 'วิดีโอทดลองเรียน',
                html: `
                    <div class="aspect-video w-full rounded-2xl overflow-hidden bg-black shadow-lg">
                        <iframe src="${embedUrl}" class="w-full h-full" frameborder="0" allowfullscreen></iframe>
                    </div>
                `,
                width: '800px',
                showCloseButton: true,
                showConfirmButton: false,
                background: document.documentElement.classList.contains('dark') ? '#090d16' : '#ffffff'
            });
        }

        fetchTrialCourses();
    </script>
</body>
</html>
