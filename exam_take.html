<!DOCTYPE html>
<html lang="th" class="light select-none">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS | ศูนย์สอบออนไลน์</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Prompt', 'sans-serif'] },
                    colors: { primary: '#0284c7', darkbg: '#020617', darkbox: '#090d16', darkinput: '#0f172a' }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; user-select: none; -webkit-user-select: none; }
        .glass-nav { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(226, 232, 240, 0.8); }
        .dark .glass-nav { background: rgba(2, 6, 23, 0.95); border-bottom: 1px solid rgba(30, 41, 59, 0.8); }
        .hitech-card { background: rgba(255, 255, 255, 0.98); border: 1px solid rgba(226, 232, 240, 1); box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        .dark .hitech-card { background: #090d16; border: 1px solid rgba(30, 41, 59, 0.8); }
        div:where(.swal2-container) { font-family: 'Prompt', sans-serif; }
        .dark .swal2-popup { background-color: #090d16 !important; color: #f8fafc !important; border: 1px solid #1e293b !important; }

        .omr-bubble-compact {
            width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 11px; cursor: pointer; transition: all 0.15s ease; border: 2px solid #cbd5e1;
            background-color: #ffffff; color: #334155;
        }
        .dark .omr-bubble-compact { border-color: #334155; background-color: #0f172a; color: #94a3b8; }
        .omr-bubble-compact.active {
            background-color: #0284c7 !important; color: #ffffff !important; border-color: #0284c7 !important;
            box-shadow: 0 0 10px rgba(2, 132, 199, 0.5);
        }
        .question-unanswered-highlight {
            border: 2px solid #ef4444 !important;
            background-color: rgba(239, 68, 68, 0.05) !important;
            animation: pulse-border 1.5s infinite;
        }
        @keyframes pulse-border {
            0% { border-color: #ef4444; }
            50% { border-color: rgba(239, 68, 68, 0.3); }
            100% { border-color: #ef4444; }
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-darkbg min-h-screen text-slate-900 dark:text-slate-100 pb-16" oncontextmenu="return false;">

    <nav class="glass-nav fixed w-full top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 h-16 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-sky-600 text-white flex items-center justify-center font-bold text-sm shadow-md">
                    <i class="fas fa-file-lines"></i>
                </div>
                <div>
                    <h1 id="examTitleNav" class="font-extrabold text-sm text-slate-900 dark:text-white">กำลังโหลดข้อสอบ...</h1>
                    <p id="examSubNav" class="text-[11px] text-slate-500">กรุณารอสักครู่...</p>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <div class="px-4 py-1.5 bg-amber-500/15 dark:bg-amber-950/40 text-amber-600 dark:text-amber-400 border border-amber-500/30 rounded-xl font-mono font-bold text-xs flex items-center gap-1.5">
                    <i class="fas fa-clock animate-pulse"></i>
                    <span id="timerDisplay">--:--</span>
                </div>
                <button id="themeToggle" class="w-9 h-9 flex items-center justify-center rounded-xl bg-white dark:bg-darkinput border border-slate-200 dark:border-slate-800">
                    <i class="fas fa-moon text-sm" id="themeIcon"></i>
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-[96rem] mx-auto px-4 pt-24 space-y-6">
        
        <div id="previewBanner" class="hidden p-4 bg-indigo-500/10 border border-indigo-500/30 rounded-2xl flex justify-between items-center text-xs font-bold text-indigo-600 dark:text-indigo-400">
            <span><i class="fas fa-eye mr-1.5"></i> โหมดดูตัวอย่างข้อสอบ (Preview Mode - คะแนนจะไม่ถูกบันทึก)</span>
            <button onclick="window.close()" class="px-3 py-1 bg-indigo-600 text-white rounded-lg">ปิดหน้าต่างนี้</button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            
            <!-- ฝั่งซ้าย: PDF Viewer (จะซ่อนอัตโนมัติหากไม่มีไฟล์ PDF) -->
            <div id="pdfViewerCard" class="hidden lg:col-span-8 hitech-card p-4 rounded-3xl space-y-3 sticky top-24">
                <div class="flex justify-between items-center">
                    <h3 class="font-bold text-xs text-red-600 flex items-center gap-1.5"><i class="fas fa-file-pdf"></i> เอกสารข้อสอบ (ความคมชัดสูง / ห้ามดาวน์โหลด)</h3>
                    <span class="px-2.5 py-0.5 bg-red-500/10 text-red-600 text-[10px] font-bold rounded-lg border border-red-500/20"><i class="fas fa-shield-alt mr-1"></i> ป้องกันการดาวน์โหลด 100%</span>
                </div>
                <div id="pdfContainer" class="w-full h-[78vh] bg-slate-100 dark:bg-slate-900 rounded-2xl overflow-y-auto border p-4 flex flex-col items-center gap-4 select-none" oncontextmenu="return false;">
                    <div class="text-slate-400 text-xs py-20">กำลังเรนเดอร์เอกสารข้อสอบความคมชัดสูง...</div>
                </div>
            </div>

            <!-- ฝั่งขวา: กระดาษคำตอบ OMR / หรือพื้นที่แสดงโจทย์เต็มจอ -->
            <div id="rightAnswerCard" class="lg:col-span-4 hitech-card p-5 rounded-3xl space-y-5">
                <div class="flex justify-between items-center pb-3 border-b border-slate-200 dark:border-slate-800">
                    <div>
                        <h2 id="answerCardTitle" class="font-bold text-sm text-slate-900 dark:text-white flex items-center gap-1.5">
                            <i class="fas fa-list-check text-sky-500"></i> กระดาษคำตอบ
                        </h2>
                        <p id="choiceFormatSubLabel" class="text-[11px] text-slate-400 mt-0.5">รูปแบบตัวเลือก: กำลังโหลด...</p>
                    </div>
                    <button onclick="confirmSubmitExam()" class="px-4 py-2 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold text-xs rounded-xl shadow-md transition-all flex items-center gap-1.5">
                        <i class="fas fa-paper-plane"></i> ส่งข้อสอบ
                    </button>
                </div>

                <div id="questionsListContainer" class="space-y-3">
                    <div class="text-center py-10 text-slate-400 text-xs">กรุณากดเริ่มทำข้อสอบเพื่อแสดงชุดข้อสอบ</div>
                </div>
            </div>

        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const examId = urlParams.get('id') || urlParams.get('exam_id');
        const isPreview = urlParams.get('preview') === 'true';

        let currentExam = null;
        let currentStudentId = null;
        let currentQuestions = [];
        let studentAnswers = {};
        let flaggedQuestions = {};
        let timerInterval = null;
        let currentRemainingSeconds = 0;
        let totalExamSeconds = 0;

        let halfTimeTriggered = false;
        let fiveMinsTriggered = false;

        // 🛡️ ตัวแปรระบบ Anti-Cheat (สลับแท็บ)
        let tabSwitchCount = 0;
        const MAX_ALLOWED_VIOLATIONS = 3;

        const htmlElement = document.documentElement;
        const themeIcon = document.getElementById('themeIcon');
        if (localStorage.getItem('theme') === 'dark') {
            htmlElement.classList.add('dark');
            themeIcon.classList.replace('fa-moon', 'fa-sun');
        }
        document.getElementById('themeToggle').addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            const isDark = htmlElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeIcon.classList.replace(isDark ? 'fa-moon' : 'fa-sun', isDark ? 'fa-sun' : 'fa-moon');
        });

        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('mousedown', e => { if (e.button === 2) e.preventDefault(); });
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'p' || e.key === 'u' || e.key === 'c' || e.key === 'a' || e.key === 'i')) {
                e.preventDefault();
                Swal.fire({ icon: 'warning', text: 'ไม่อนุญาตให้ดำเนินการดังกล่าวในหน้าข้อสอบ', timer: 1200, showConfirmButton: false });
            }
            if (e.key === 'F12' || e.key === 'PrintScreen') {
                e.preventDefault();
            }
        });

        function getChoiceLabels(formatType) {
            if (formatType === 'th_num') return ['ก', 'ข', 'ค', 'ง', 'จ'];
            if (formatType === 'upper') return ['A', 'B', 'C', 'D', 'E'];
            if (formatType === 'lower') return ['a', 'b', 'c', 'd', 'e'];
            return ['1', '2', '3', '4', '5'];
        }

        function getChoiceFormatLabelText(formatType) {
            if (formatType === 'th_num') return 'ก, ข, ค, ง';
            if (formatType === 'upper') return 'A, B, C, D';
            if (formatType === 'lower') return 'a, b, c, d';
            return '1, 2, 3, 4';
        }

        function getValidatedStudentId() {
            let studentId = urlParams.get('student_id') || 
                            localStorage.getItem('id') || 
                            localStorage.getItem('student_id') || 
                            localStorage.getItem('user_id') || 
                            localStorage.getItem('userId') || null;

            if (!studentId || studentId === '00000000-0000-0000-0000-000000000000') {
                try {
                    const userObj = JSON.parse(localStorage.getItem('user') || localStorage.getItem('profile') || localStorage.getItem('current_user') || '{}');
                    studentId = userObj.id || userObj.student_id || userObj.uid || null;
                } catch(e) {}
            }
            return studentId;
        }

        function checkStudentAuth() {
            if (isPreview) return true;

            const studentId = getValidatedStudentId();
            if (!studentId || studentId === '00000000-0000-0000-0000-000000000000') {
                Swal.fire({
                    icon: 'warning',
                    title: 'ยังไม่ได้เข้าสู่ระบบ!',
                    text: 'กรุณาเข้าสู่ระบบก่อนทำข้อสอบ',
                    confirmButtonText: 'ไปหน้าเข้าสู่ระบบ',
                    allowOutsideClick: false
                }).then(() => {
                    window.location.href = 'index.html';
                });
                return false;
            }
            return true;
        }

        async function initPage() {
            if (!checkStudentAuth()) return;
            if (!examId) {
                Swal.fire('ไม่พบ ID ข้อสอบ', '', 'warning').then(() => window.location.href = 'student.html');
                return;
            }

            currentStudentId = getValidatedStudentId();

            if (isPreview) {
                document.getElementById('previewBanner').classList.remove('hidden');
            }

            // 🛑 ป้องกันการทำซ้ำ: ตรวจสอบในฐานข้อมูลว่านักเรียนเคยส่งข้อสอบชุดนี้ไปแล้วหรือยัง
            if (!isPreview && currentStudentId) {
                try {
                    const { data: prevAttempts, error } = await mySupabase
                        .from('exam_attempts')
                        .select('id')
                        .eq('exam_id', examId)
                        .eq('student_id', currentStudentId);

                    if (prevAttempts && prevAttempts.length > 0) {
                        Swal.fire({
                            icon: 'error',
                            title: 'คุณได้ทำและส่งข้อสอบชุดนี้ไปแล้ว!',
                            text: 'ไม่อนุญาตให้ทำข้อสอบซ้ำผ่านการเข้าลิงก์เดิม ระบบจะนำคุณกลับสู่หน้าหลัก',
                            confirmButtonText: 'รับทราบ',
                            allowOutsideClick: false
                        }).then(() => {
                            window.location.href = 'student.html';
                        });
                        return;
                    }
                } catch(err) {
                    console.error("Check previous attempt error:", err);
                }
            }

            const { data: exam } = await mySupabase.from('exams').select('*').eq('id', examId).single();
            if (!exam) {
                Swal.fire('ไม่พบชุดข้อสอบนี้', '', 'error').then(() => window.location.href = 'student.html');
                return;
            }

            currentExam = exam;
            document.getElementById('examTitleNav').textContent = exam.title;
            document.getElementById('examSubNav').textContent = `รหัส: ${exam.exam_code || 'ไม่มี'} | เวลาทำ: ${exam.time_limit || 60} นาที`;
            
            const formatSub = document.getElementById('choiceFormatSubLabel');
            if (formatSub) {
                formatSub.textContent = `รูปแบบตัวเลือก: ${getChoiceFormatLabelText(exam.choice_format)}`;
            }

            // 💾 โหลดคำตอบและสถานะปักธงที่บันทึกไว้ใน localStorage (ป้องกันเผลอรีเฟรช)
            if (!isPreview) {
                try {
                    const savedAnswers = localStorage.getItem(`exam_answers_${examId}_${currentStudentId}`);
                    if (savedAnswers) {
                        studentAnswers = JSON.parse(savedAnswers);
                    }
                    const savedFlags = localStorage.getItem(`exam_flags_${examId}_${currentStudentId}`);
                    if (savedFlags) {
                        flaggedQuestions = JSON.parse(savedFlags);
                    }
                } catch(e) {
                    console.error("Load local backup error:", e);
                }
            }

            if (!isPreview) {
                const timerKey = `exam_start_time_${examId}_${currentStudentId}`;
                const existingStartTime = localStorage.getItem(timerKey);

                if (!existingStartTime) {
                    const confirmStart = await Swal.fire({
                        title: `พร้อมเริ่มทำข้อสอบ "${exam.title}" หรือยัง?`,
                        text: `เวลาในการทำข้อสอบ: ${exam.time_limit || 60} นาที เมื่อกดเริ่มเวลานับถอยหลังทันที`,
                        icon: 'info',
                        showCancelButton: true,
                        confirmButtonText: 'เริ่มทำข้อสอบ',
                        cancelButtonText: 'กลับหน้าหลัก',
                        allowOutsideClick: false
                    });

                    if (!confirmStart.isConfirmed) {
                        window.location.href = 'student.html';
                        return;
                    }
                }
            }

            // ตรวจสอบว่ามี PDF หรือไม่ เพื่อปรับ Layout หน้าจอ
            const pdfCard = document.getElementById('pdfViewerCard');
            const rightCard = document.getElementById('rightAnswerCard');
            const answerCardTitle = document.getElementById('answerCardTitle');

            const hasPdf = exam.pdf_url && exam.pdf_url.trim() !== '';

            if (hasPdf) {
                if (pdfCard) pdfCard.classList.remove('hidden');
                if (rightCard) rightCard.className = 'lg:col-span-4 hitech-card p-5 rounded-3xl space-y-5';
                if (answerCardTitle) answerCardTitle.innerHTML = `<i class="fas fa-list-check text-sky-500"></i> กระดาษคำตอบ`;
                renderSecurePDF(exam.pdf_url);
            } else {
                if (pdfCard) pdfCard.classList.add('hidden');
                if (rightCard) rightCard.className = 'lg:col-span-12 hitech-card p-6 rounded-3xl space-y-6 max-w-4xl mx-auto w-full';
                if (answerCardTitle) answerCardTitle.innerHTML = `<i class="fas fa-file-lines text-sky-500"></i> แบบทดสอบออนไลน์ & ตัวเลือกคำตอบ`;
            }

            await loadQuestions();

            const timerKey = `exam_start_time_${examId}_${currentStudentId}`;
            let startTime = localStorage.getItem(timerKey);
            if (!startTime || isPreview) {
                startTime = Date.now();
                localStorage.setItem(timerKey, startTime);
            }

            totalExamSeconds = (currentExam.time_limit || 60) * 60;
            startPersistentTimer(parseInt(startTime, 10), totalExamSeconds);

            // เปิดใช้งานระบบ Anti-Cheat (เมื่อเริ่มทำข้อสอบจริง)
            if (!isPreview) {
                initAntiCheatSystem();
            }
        }

        // 🛡️ ระบบ Anti-Cheat: ตรวจจับการสลับแท็บและสูญเสียโฟกัส
        function initAntiCheatSystem() {
            document.addEventListener('visibilitychange', function () {
                if (document.hidden) {
                    handleExamViolation("ตรวจพบการสลับแท็บหรือออกจากหน้าจอเบราว์เซอร์");
                }
            });

            window.addEventListener('blur', function () {
                if (!document.hidden) {
                    handleExamViolation("หน้าต่างข้อสอบสูญเสียการโฟกัส (คลิกออกนอกหน้าจอ)");
                }
            });
        }

        async function handleExamViolation(reason) {
            if (isPreview) return;
            tabSwitchCount++;

            try {
                await mySupabase.from('exam_violation_logs').insert([{
                    exam_id: examId,
                    student_id: currentStudentId,
                    violation_reason: reason,
                    attempt_count: tabSwitchCount,
                    created_at: new Date().toISOString()
                }]);
            } catch (err) {
                console.warn("Log violation warning:", err);
            }

            if (tabSwitchCount < MAX_ALLOWED_VIOLATIONS) {
                Swal.fire({
                    icon: 'warning',
                    title: '⚠️ คำเตือน! ห้ามสลับหน้าจอ',
                    html: `ระบบตรวจพบพฤติกรรมสลับแท็บ/ออกนอกหน้าจอ<br><b>(ครั้งที่ ${tabSwitchCount} จาก ${MAX_ALLOWED_VIOLATIONS} ครั้ง)</b><br><span class="text-red-500 text-xs">หากครบกำหนด ระบบจะบังคับส่งข้อสอบทันที!</span>`,
                    confirmButtonText: 'รับทราบและกลับไปทำข้อสอบ',
                    confirmButtonColor: '#0284c7',
                    allowOutsideClick: false
                });
            } else {
                Swal.fire({
                    icon: 'error',
                    title: '❌ ถูกตัดสิทธิ์การสอบ',
                    text: 'คุณสลับหน้าจอเกินจำนวนครั้งที่กำหนด ระบบได้ทำการส่งข้อสอบอัตโนมัติแล้ว',
                    confirmButtonText: 'ดูผลคะแนน',
                    confirmButtonColor: '#ef4444',
                    allowOutsideClick: false
                }).then(() => {
                    submitExam(true);
                });
            }
        }

        async function renderSecurePDF(url) {
            const container = document.getElementById('pdfContainer');
            container.innerHTML = `<div class="text-slate-400 text-xs py-10">กำลังเรนเดอร์เอกสารข้อสอบความคมชัดสูง...</div>`;
            try {
                const loadingTask = pdfjsLib.getDocument(url);
                const pdfDoc = await loadingTask.promise;
                container.innerHTML = '';

                for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
                    const page = await pdfDoc.getPage(pageNum);
                    const viewport = page.getViewport({ scale: 3.0 });
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;
                    canvas.style.width = '100%';
                    canvas.style.height = 'auto';
                    canvas.className = 'shadow-md rounded-lg mb-4 bg-white';
                    
                    await page.render({ canvasContext: context, viewport: viewport }).promise;
                    container.appendChild(canvas);
                }
            } catch (err) {
                console.error(err);
                container.innerHTML = `<div class="text-red-500 text-xs py-10">ไม่สามารถโหลดเอกสารข้อสอบได้ กรุณาติดต่อผู้คุมสอบ</div>`;
            }
        }

        async function loadQuestions() {
            const { data: qs } = await mySupabase.from('questions').select('*').eq('exam_id', examId).order('question_number', { ascending: true });
            currentQuestions = qs || [];
            renderQuestionsContainer();
        }

        function renderQuestionsContainer() {
            const container = document.getElementById('questionsListContainer');
            if (currentQuestions.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-slate-400 text-xs">ยังไม่มีรายการโจทย์ในชุดข้อสอบนี้</div>`;
                return;
            }

            const formatType = currentExam?.choice_format || 'num';
            const standardLabels = getChoiceLabels(formatType);
            const hasPdf = currentExam?.pdf_url && currentExam.pdf_url.trim() !== '';

            const groups = {};
            currentQuestions.forEach((q, idx) => {
                const tag = q.category_tag && q.category_tag.trim() !== '' ? q.category_tag : 'ข้อสอบทั่วไป';
                if (!groups[tag]) groups[tag] = [];
                groups[tag].push({ q, idx });
            });

            let htmlContent = '';

            for (const [tag, items] of Object.entries(groups)) {
                if (!hasPdf) {
                    htmlContent += `
                        <div class="space-y-4 pt-2">
                            <div class="px-4 py-2 bg-sky-500/10 dark:bg-sky-950/40 border border-sky-500/30 rounded-2xl text-xs font-extrabold text-sky-600 dark:text-sky-400 flex items-center gap-2">
                                <i class="fas fa-layer-group"></i> 🏷️ หมวดหมู่: ${tag}
                            </div>
                            <div class="space-y-4">
                    `;
                } else {
                    htmlContent += `
                        <div class="space-y-2 pt-2">
                            <div class="px-3 py-1.5 bg-sky-500/10 dark:bg-sky-950/40 border border-sky-500/30 rounded-xl text-xs font-extrabold text-sky-600 dark:text-sky-400 flex items-center gap-2">
                                <i class="fas fa-layer-group"></i> 🏷️ ${tag}
                            </div>
                            <div class="space-y-2">
                    `;
                }

                for (const { q, idx } of items) {
                    const isEssay = q.question_type === 'essay';
                    const opts = (q.options && q.options.length > 0) ? q.options : standardLabels;
                    const qNum = q.question_number || (idx + 1);
                    const isFlagged = flaggedQuestions[q.id];

                    if (!hasPdf) {
                        // 🌟 รูปแบบโจทย์ที่พิมพ์ลงระบบ (Direct-Text Quiz UI แบบเต็มจอ)
                        if (isEssay) {
                            htmlContent += `
                                <div id="q-box-${q.id}" class="p-5 bg-white dark:bg-darkinput rounded-2xl border border-slate-200 dark:border-slate-800 space-y-3 shadow-sm relative">
                                    <div class="flex items-center justify-between">
                                        <span class="font-extrabold text-xs text-amber-600 dark:text-amber-400">ข้อที่ ${qNum} (ข้อสอบอัตนัย)</span>
                                        <div class="flex items-center gap-2">
                                            <span class="px-2.5 py-0.5 bg-amber-500 text-white font-bold text-[10px] rounded-lg">เขียนตอบ</span>
                                            <button onclick="toggleFlag('${q.id}')" class="text-xs ${isFlagged ? 'text-amber-500' : 'text-slate-400 hover:text-amber-500'}" title="ปักธงข้อที่ไม่มั่นใจ">
                                                <i class="fas fa-flag"></i>
                                            </button>
                                        </div>
                                    </div>
                                    <div class="text-xs sm:text-sm font-semibold text-slate-900 dark:text-white leading-relaxed">
                                        ${q.question_text || q.content || 'คำถามอัตนัย'}
                                    </div>
                                    ${q.image_url ? `<div class="my-2"><img src="${q.image_url}" class="max-h-64 rounded-xl object-contain border" /></div>` : ''}
                                    <textarea id="ans-${q.id}" oninput="saveEssayAnswer('${q.id}', this.value)" rows="4" class="w-full p-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl text-xs outline-none focus:border-sky-500" placeholder="พิมพ์คำตอบของคุณที่นี่...">${studentAnswers[q.id] || ''}</textarea>
                                </div>
                            `;
                        } else {
                            const optionsHtml = opts.map((optText, cIdx) => {
                                const isSelected = studentAnswers[q.id] === String(cIdx) || studentAnswers[q.id] === optText;
                                const displayLabel = standardLabels[cIdx] || (cIdx + 1);
                                const actualText = (typeof optText === 'string' && optText.trim() !== '' && isNaN(optText)) ? optText : `ตัวเลือกที่ ${displayLabel}`;
                                
                                return `
                                    <div onclick="selectAnswer('${q.id}', '${cIdx}')" id="opt-card-${q.id}-${cIdx}" class="p-3.5 rounded-xl border cursor-pointer transition-all flex items-center gap-3 ${isSelected ? 'border-sky-500 bg-sky-500/10 text-sky-600 dark:text-sky-400 shadow-sm' : 'border-slate-200 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-900/50 hover:border-sky-400'}">
                                        <div class="w-8 h-8 rounded-lg ${isSelected ? 'bg-sky-600 text-white' : 'bg-white dark:bg-darkinput text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-800'} flex items-center justify-center font-bold text-xs shrink-0">
                                            ${displayLabel}
                                        </div>
                                        <span class="text-xs sm:text-sm font-medium text-slate-800 dark:text-slate-200">${actualText}</span>
                                    </div>
                                `;
                            }).join('');

                            htmlContent += `
                                <div id="q-box-${q.id}" class="p-5 bg-white dark:bg-darkinput rounded-2xl border border-slate-200 dark:border-slate-800 space-y-3.5 shadow-sm">
                                    <div class="flex items-center justify-between">
                                        <span class="font-extrabold text-xs text-sky-600 dark:text-sky-400">ข้อที่ ${qNum}</span>
                                        <div class="flex items-center gap-2">
                                            <button onclick="toggleFlag('${q.id}')" class="text-xs ${isFlagged ? 'text-amber-500' : 'text-slate-400 hover:text-amber-500'}" title="ปักธงข้อที่ไม่มั่นใจ">
                                                <i class="fas fa-flag"></i> <span class="text-[10px]">${isFlagged ? 'ปักธงแล้ว' : 'ปักธง'}</span>
                                            </button>
                                        </div>
                                    </div>
                                    <div class="text-xs sm:text-sm font-semibold text-slate-900 dark:text-white leading-relaxed">
                                        ${q.question_text || q.content || ''}
                                    </div>
                                    ${q.image_url ? `<div class="my-2"><img src="${q.image_url}" class="max-h-64 rounded-xl object-contain border" /></div>` : ''}
                                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 pt-1">
                                        ${optionsHtml}
                                    </div>
                                </div>
                            `;
                        }
                    } else {
                        // 🌟 รูปแบบข้อสอบ PDF (กระดาษคำตอบ OMR Compact)
                        if (isEssay) {
                            htmlContent += `
                                <div id="q-box-${q.id}" class="p-3 bg-slate-50 dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 space-y-2 relative">
                                    <div class="flex items-center justify-between">
                                        <span class="font-extrabold text-xs text-amber-600 dark:text-amber-400">ข้อ ${qNum} (อัตนัย)</span>
                                        <div class="flex items-center gap-2">
                                            <span class="px-2 py-0.5 bg-amber-500 text-white font-bold text-[9px] rounded">เขียนตอบ</span>
                                            <button onclick="toggleFlag('${q.id}')" class="text-xs ${isFlagged ? 'text-amber-500' : 'text-slate-400 hover:text-amber-500'}" title="ปักธงข้อที่ไม่มั่นใจ">
                                                <i class="fas fa-flag"></i>
                                            </button>
                                        </div>
                                    </div>
                                    <div class="text-[11px] font-semibold text-slate-800 dark:text-slate-200 bg-white dark:bg-slate-800/60 p-2.5 rounded-xl border">${q.question_text || q.content || 'คำถามอัตนัย'}</div>
                                    <textarea id="ans-${q.id}" oninput="saveEssayAnswer('${q.id}', this.value)" rows="3" class="w-full p-2.5 bg-white dark:bg-slate-800 border rounded-xl text-xs outline-none" placeholder="พิมพ์คำตอบของคุณที่นี่...">${studentAnswers[q.id] || ''}</textarea>
                                </div>
                            `;
                        } else {
                            const bubblesHtml = opts.map((cLabel, cIdx) => {
                                const isSelected = studentAnswers[q.id] === String(cIdx) || studentAnswers[q.id] === cLabel;
                                const displayLabel = standardLabels[cIdx] || cLabel;
                                return `
                                    <div onclick="selectAnswer('${q.id}', '${cIdx}')" id="bubble-${q.id}-${cIdx}" class="omr-bubble-compact ${isSelected ? 'active' : ''}">
                                        ${displayLabel}
                                    </div>
                                `;
                            }).join('');

                            htmlContent += `
                                <div id="q-box-${q.id}" class="px-3 py-2 bg-slate-50 dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 flex items-center justify-between">
                                    <div class="flex items-center gap-3">
                                        <span class="font-extrabold text-xs text-sky-600 dark:text-sky-400 w-8 shrink-0">ข้อ ${qNum}</span>
                                        <div class="flex items-center gap-1.5">${bubblesHtml}</div>
                                    </div>
                                    <button onclick="toggleFlag('${q.id}')" class="text-xs ${isFlagged ? 'text-amber-500' : 'text-slate-400 hover:text-amber-500'} shrink-0 ml-2" title="ปักธงข้อที่ไม่มั่นใจ">
                                        <i class="fas fa-flag"></i>
                                    </button>
                                </div>
                            `;
                        }
                    }
                }

                htmlContent += `</div></div>`;
            }

            container.innerHTML = htmlContent;
        }

        function toggleFlag(qId) {
            flaggedQuestions[qId] = !flaggedQuestions[qId];
            try {
                localStorage.setItem(`exam_flags_${examId}_${currentStudentId}`, JSON.stringify(flaggedQuestions));
            } catch(e) {}
            renderQuestionsContainer();
        }

        function selectAnswer(qId, cIdx) {
            studentAnswers[qId] = String(cIdx);
            
            try {
                localStorage.setItem(`exam_answers_${examId}_${currentStudentId}`, JSON.stringify(studentAnswers));
            } catch(e) {}

            const box = document.getElementById(`q-box-${qId}`);
            if (box) box.classList.remove('question-unanswered-highlight');

            const qObj = currentQuestions.find(q => q.id === qId);
            const formatType = currentExam?.choice_format || 'num';
            const standardLabels = getChoiceLabels(formatType);
            const opts = (qObj && qObj.options && qObj.options.length > 0) ? qObj.options : standardLabels;

            if (qObj) {
                opts.forEach((_, i) => {
                    // รองรับทั้ง OMR Bubble และ Option Card แบบเต็ม
                    const bubble = document.getElementById(`bubble-${qId}-${i}`);
                    if (bubble) {
                        if (String(i) === String(cIdx)) {
                            bubble.classList.add('active');
                        } else {
                            bubble.classList.remove('active');
                        }
                    }

                    const optCard = document.getElementById(`opt-card-${qId}-${i}`);
                    if (optCard) {
                        if (String(i) === String(cIdx)) {
                            optCard.classList.add('border-sky-500', 'bg-sky-500/10', 'text-sky-600', 'dark:text-sky-400', 'shadow-sm');
                            optCard.classList.remove('border-slate-200', 'dark:border-slate-800', 'bg-slate-50/50', 'dark:bg-slate-900/50');
                            const badge = optCard.querySelector('div');
                            if (badge) {
                                badge.classList.add('bg-sky-600', 'text-white');
                                badge.classList.remove('bg-white', 'dark:bg-darkinput', 'text-slate-700', 'dark:text-slate-300', 'border');
                            }
                        } else {
                            optCard.classList.remove('border-sky-500', 'bg-sky-500/10', 'text-sky-600', 'dark:text-sky-400', 'shadow-sm');
                            optCard.classList.add('border-slate-200', 'dark:border-slate-800', 'bg-slate-50/50', 'dark:bg-slate-900/50');
                            const badge = optCard.querySelector('div');
                            if (badge) {
                                badge.classList.remove('bg-sky-600', 'text-white');
                                badge.classList.add('bg-white', 'dark:bg-darkinput', 'text-slate-700', 'dark:text-slate-300', 'border');
                            }
                        }
                    }
                });
            }
        }

        function saveEssayAnswer(qId, val) {
            studentAnswers[qId] = val;
            
            try {
                localStorage.setItem(`exam_answers_${examId}_${currentStudentId}`, JSON.stringify(studentAnswers));
            } catch(e) {}

            if (val && val.trim() !== '') {
                const box = document.getElementById(`q-box-${qId}`);
                if (box) box.classList.remove('question-unanswered-highlight');
            }
        }

        function playSoftAlertSound(type = 'half') {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = 'sine';
                
                if (type === 'half') {
                    oscillator.frequency.setValueAtTime(440, audioCtx.currentTime); 
                    gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime); 
                    gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(audioCtx.destination);
                    
                    oscillator.start();
                    oscillator.stop(audioCtx.currentTime + 0.3);
                } else if (type === 'five_mins') {
                    let now = audioCtx.currentTime;
                    [0, 0.25, 0.5].forEach((delay) => {
                        let osc = audioCtx.createOscillator();
                        let gain = audioCtx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(587.33, now + delay); 
                        gain.gain.setValueAtTime(0.15, now + delay);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.15);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(now + delay);
                        osc.stop(now + delay + 0.15);
                    });
                }
            } catch (e) {
                console.log("AudioContext blocked or not supported", e);
            }
        }

        function checkTimerAlerts(timeLeftSeconds, totalDurationSeconds) {
            if (!halfTimeTriggered && timeLeftSeconds === Math.floor(totalDurationSeconds / 2)) {
                halfTimeTriggered = true;
                playSoftAlertSound('half');
                Swal.mixin({
                    toast: true,
                    position: 'top-end',
                    showConfirmButton: false,
                    timer: 4000,
                    timerProgressBar: true
                }).fire({
                    icon: 'info',
                    title: 'เวลาในการทำข้อสอบผ่านไปแล้วครึ่งทาง'
                });
            }

            if (!fiveMinsTriggered && timeLeftSeconds === 300) {
                fiveMinsTriggered = true;
                playSoftAlertSound('five_mins');
                Swal.mixin({
                    toast: true,
                    position: 'top-end',
                    showConfirmButton: false,
                    timer: 5000,
                    timerProgressBar: true
                }).fire({
                    icon: 'warning',
                    title: '⚠️ แจ้งเตือน: เหลือเวลาทำข้อสอบอีก 5 นาทีสุดท้าย!'
                });
            }
        }

        function startPersistentTimer(startTime, totalDurationSeconds) {
            const display = document.getElementById('timerDisplay');

            timerInterval = setInterval(() => {
                const elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);
                const remainingSeconds = totalDurationSeconds - elapsedSeconds;
                currentRemainingSeconds = remainingSeconds > 0 ? remainingSeconds : 0;

                checkTimerAlerts(currentRemainingSeconds, totalDurationSeconds);

                if (remainingSeconds <= 0) {
                    clearInterval(timerInterval);
                    localStorage.removeItem(`exam_start_time_${examId}_${currentStudentId}`);
                    localStorage.removeItem(`exam_answers_${examId}_${currentStudentId}`);
                    localStorage.removeItem(`exam_flags_${examId}_${currentStudentId}`);
                    Swal.fire({
                        icon: 'warning',
                        title: 'หมดเวลาทำข้อสอบ!',
                        text: 'ระบบกำลังส่งคำตอบของคุณโดยอัตโนมัติ',
                        allowOutsideClick: false,
                        timer: 2000,
                        showConfirmButton: false
                    }).then(() => submitExam(true));
                    return;
                }

                const minutes = parseInt(remainingSeconds / 60, 10);
                const seconds = parseInt(remainingSeconds % 60, 10);
                display.textContent = `${minutes < 10 ? '0' + minutes : minutes}:${seconds < 10 ? '0' + seconds : seconds}`;
            }, 1000);
        }

        async function confirmSubmitExam() {
            let unanswered = [];
            currentQuestions.forEach((q, idx) => {
                const qNum = q.question_number || (idx + 1);
                const ans = studentAnswers[q.id];
                if (ans === undefined || ans === null || String(ans).trim() === '') {
                    unanswered.push(qNum);
                    const box = document.getElementById(`q-box-${q.id}`);
                    if (box) box.classList.add('question-unanswered-highlight');
                }
            });

            if (unanswered.length > 0) {
                const res1 = await Swal.fire({
                    title: 'คุณยังทำข้อสอบไม่ครบทุกข้อ!',
                    html: `มีข้อที่ยังไม่ได้ตอบดังนี้:<br><b class="text-red-500 text-sm">ข้อที่: ${unanswered.join(', ')}</b><br><br>ระบบได้ทำเครื่องหมายกรอบสีแดงไว้ ต้องการดำเนินการต่อหรือไม่?`,
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonText: 'ดำเนินการต่อ',
                    cancelButtonText: 'กลับไปทำต่อ',
                    confirmButtonColor: '#10b981',
                    cancelButtonColor: '#ef4444'
                });

                if (!res1.isConfirmed) return;
            } else {
                const res1 = await Swal.fire({
                    title: 'ยืนยันการส่งข้อสอบ?',
                    text: 'คุณได้ทำข้อสอบครบทุกข้อแล้ว ต้องการส่งคำตอบหรือไม่',
                    icon: 'question',
                    showCancelButton: true,
                    confirmButtonText: 'ยืนยัน',
                    cancelButtonText: 'ตรวจสอบอีกครั้ง'
                });

                if (!res1.isConfirmed) return;
            }

            const res2 = await Swal.fire({
                title: 'ยืนยันครั้งสุดท้าย!',
                text: 'เมื่อส่งแล้วจะไม่สามารถกลับมาแก้ไขหรือเปลี่ยนคำตอบได้อีก แน่ใจนะ?',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'ใช่, ส่งข้อสอบเลย',
                cancelButtonText: 'ยกเลิก',
                confirmButtonColor: '#0284c7',
                cancelButtonColor: '#64748b'
            });

            if (res2.isConfirmed) {
                submitExam(false);
            }
        }

        async function submitExam(isTimeout = false) {
            if (timerInterval) clearInterval(timerInterval);
            
            localStorage.removeItem(`exam_start_time_${examId}_${currentStudentId}`);
            localStorage.removeItem(`exam_answers_${examId}_${currentStudentId}`);
            localStorage.removeItem(`exam_flags_${examId}_${currentStudentId}`);

            try {
                let progress = JSON.parse(localStorage.getItem('student_in_progress_exams') || '{}');
                delete progress[examId];
                localStorage.setItem('student_in_progress_exams', JSON.stringify(progress));
            } catch(e) {}

            if (isPreview) {
                Swal.fire('ส่งข้อสอบจำลองสำเร็จ', 'นี่คือโหมด Preview คะแนนไม่ถูกบันทึก', 'success').then(() => window.close());
                return;
            }

            Swal.fire({
                title: 'กำลังบันทึกและประมวลผลคำตอบ...',
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading()
            });

            let totalScore = 0;
            currentQuestions.forEach(q => {
                const studentAns = studentAnswers[q.id];
                const isEssay = q.question_type === 'essay';
                if (!isEssay) {
                    if (studentAns !== undefined && studentAns !== null && String(studentAns) === String(q.correct_answer)) {
                        totalScore += 1;
                    }
                }
            });

            const studentId = getValidatedStudentId();

            if (!studentId || studentId === '00000000-0000-0000-0000-000000000000') {
                Swal.fire({
                    icon: 'warning',
                    title: 'ข้อมูลผู้ใช้ไม่ถูกต้อง',
                    text: 'กรุณาเข้าสู่ระบบใหม่อีกครั้งเพื่อบันทึกคะแนน',
                    confirmButtonText: 'ไปหน้าเข้าสู่ระบบ',
                    allowOutsideClick: false
                }).then(() => {
                    window.location.href = 'index.html';
                });
                return;
            }

            const attemptPayload = {
                exam_id: examId,
                status: 'submitted',
                student_id: studentId,
                answer_saved: JSON.stringify(studentAnswers),
                remaining_time: currentRemainingSeconds,
                total_score: totalScore,
                submission_time: new Date().toISOString()
            };

            const { data: newAttempt, error: attemptError } = await mySupabase
                .from('exam_attempts')
                .insert([attemptPayload])
                .select()
                .single();

            if (attemptError || !newAttempt) {
                console.error("Attempt Error:", attemptError);
                Swal.fire({
                    icon: 'error',
                    title: 'Supabase Error!',
                    html: `<div class="text-left text-xs bg-slate-900 p-3 rounded text-red-400 font-mono">${JSON.stringify(attemptError, null, 2)}</div>`,
                    confirmButtonText: 'รับทราบ'
                });
                return;
            }

            const attemptId = newAttempt.id;

            for (const q of currentQuestions) {
                const studentAns = studentAnswers[q.id];
                const isEssay = q.question_type === 'essay';
                let qScore = 0;

                if (!isEssay) {
                    if (studentAns !== undefined && studentAns !== null && String(studentAns) === String(q.correct_answer)) {
                        qScore = 1;
                    }
                }

                const answerPayload = {
                    attempt_id: attemptId,
                    question_id: q.id,
                    score: qScore
                };

                if (!isEssay) {
                    answerPayload.selected_option_index = (studentAns !== undefined && studentAns !== null && studentAns !== '') ? parseInt(studentAns) : null;
                    answerPayload.subjective_answer = null;
                } else {
                    answerPayload.selected_option_index = null;
                    answerPayload.subjective_answer = studentAns || '';
                }

                await mySupabase.from('exam_answers').insert([answerPayload]);
            }

            Swal.fire({
                icon: 'success',
                title: 'ส่งข้อสอบสำเร็จ!',
                text: `คะแนนของคุณ: ${totalScore} / ${currentQuestions.length}`,
                confirmButtonText: 'ดูผลการสอบและเฉลย',
                allowOutsideClick: false
            }).then(() => {
                window.location.href = `student_result.html?attempt_id=${attemptId}&student_id=${studentId}`;
            });
        }

        initPage();
    </script>
