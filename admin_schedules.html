    <script>
        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allSchedules = [];
        let allSlots = [];
        let allCourses = [];
        let weekOffset = 0;

        async function initSchedulesPage() {
            await fetchCourses();
            await fetchSchedulesData();
        }

        async function fetchCourses() {
            const { data } = await supabaseClient.from('courses').select('id, title');
            if (data) allCourses = data;
        }

        async function fetchSchedulesData() {
            Swal.fire({ title: 'กำลังโหลดตารางเรียน...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            
            const { data: schedData } = await supabaseClient.from('course_schedules').select('*, courses(title)');
            const { data: slotData } = await supabaseClient.from('schedule_slots').select('*, courses(title)');
            
            Swal.close();

            allSchedules = schedData || [];
            allSlots = slotData || [];

            populateFilterDropdowns();
            renderSchedulesView();
        }

        function populateFilterDropdowns() {
            const select = document.getElementById('filterPerson');
            const teachers = [...new Set(allSchedules.map(s => s.teacher_name))];
            
            let html = '<option value="">-- แสดงทั้งหมดทุกคาบ --</option>';
            teachers.forEach(t => {
                if (t) html += `<option value="${t}">คุณครู: ${t}</option>`;
            });
            select.innerHTML = html;
        }

        function renderSchedulesView() {
            renderWeeklyGrid();
            renderTimelineList();
        }

        function renderWeeklyGrid() {
            const container = document.getElementById('weeklyGridContainer');
            const filterVal = document.getElementById('filterPerson').value;

            // คำนวณวันในสัปดาห์นี้ (จันทร์ - อาทิตย์)
            const currDate = new Date();
            currDate.setDate(currDate.getDate() + (weekOffset * 7));
            
            const dayOfWeek = currDate.getDay();
            const monday = new Date(currDate);
            monday.setDate(currDate.getDate() - (dayOfWeek === 0 ? 6 : dayOfWeek - 1));

            const weekDays = [];
            for (let i = 0; i < 7; i++) {
                const d = new Date(monday);
                d.setDate(monday.getDate() + i);
                weekDays.push(d);
            }

            document.getElementById('currentWeekLabel').textContent = `${weekDays[0].toLocaleDateString('th-TH', {day: 'numeric', month: 'short'})} - ${weekDays[6].toLocaleDateString('th-TH', {day: 'numeric', month: 'short', year: 'numeric'})}`;

            const timeSlots = [];
            for (let h = 8; h <= 20; h++) {
                timeSlots.push(`${String(h).padStart(2, '0')}:00:00`);
                timeSlots.push(`${String(h).padStart(2, '0')}:30:00`);
            }

            let html = `
                <table class="w-full border-collapse text-xs">
                    <thead>
                        <tr class="bg-slate-100 dark:bg-darkinput">
                            <th class="p-2 border dark:border-slate-800 w-20 text-center">เวลา</th>
                            ${weekDays.map(d => `<th class="p-2 border dark:border-slate-800 text-center">${d.toLocaleDateString('th-TH', {weekday: 'short'})}<br><span class="text-[10px] text-slate-400">${d.getDate()} ${d.toLocaleDateString('th-TH', {month: 'short'})}</span></th>`).join('')}
                        </tr>
                    </thead>
                    <tbody>
            `;

            timeSlots.forEach(time => {
                const timeLabel = time.substring(0, 5);
                html += `<tr><td class="p-2 border dark:border-slate-800 text-center font-mono font-bold text-slate-500">${timeLabel}</td>`;

                weekDays.forEach(d => {
                    const dateStr = d.toISOString().split('T')[0];
                    const matchedSlot = allSlots.find(s => s.slot_date === dateStr && s.start_time === time && (!filterVal || s.teacher_name === filterVal));

                    if (matchedSlot) {
                        const parentSched = allSchedules.find(sc => sc.id === matchedSlot.schedule_id) || {};
                        const color = parentSched.color_theme || '#0284c7';
                        html += `
                            <td class="p-1.5 border dark:border-slate-800 bg-sky-50/50 dark:bg-sky-950/20 cursor-pointer hover:bg-sky-100" onclick='openScheduleDetail(${JSON.stringify(parentSched)})'>
                                <div class="p-2 rounded-xl text-white font-bold text-[10px] space-y-0.5 shadow-sm truncate" style="background-color: ${color};">
                                    <div class="truncate">${parentSched.title || 'คาบเรียน'}</div>
                                    <div class="text-[9px] opacity-90 truncate">ครู: ${matchedSlot.teacher_name}</div>
                                </div>
                            </td>
                        `;
                    } else {
                        html += `<td class="p-2 border dark:border-slate-800 text-center text-slate-300 dark:text-slate-700">-</td>`;
                    }
                });
                html += `</tr>`;
            });

            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        function renderTimelineList() {
            const container = document.getElementById('timelineListContainer');
            const filterVal = document.getElementById('filterPerson').value;

            const filtered = filterVal ? allSchedules.filter(s => s.teacher_name === filterVal) : allSchedules;

            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-slate-400 text-xs">ยังไม่มีรายการคาบเรียนในระบบ</div>`;
                return;
            }

            container.innerHTML = filtered.map(s => `
                <div class="p-4 bg-slate-50 dark:bg-darkinput rounded-2xl border dark:border-slate-800 flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
                    <div class="space-y-1">
                        <div class="flex items-center gap-2">
                            <span class="w-3 h-3 rounded-full" style="background-color: ${s.color_theme || '#0284c7'}"></span>
                            <h4 class="font-bold text-sm">${s.title}</h4>
                            <span class="px-2 py-0.5 bg-sky-100 dark:bg-sky-950 text-sky-600 dark:text-sky-400 text-[10px] rounded font-bold">${s.courses?.title || 'คอร์สเรียน'}</span>
                        </div>
                        <p class="text-xs text-slate-500">${s.description || 'ไม่มีรายละเอียดเพิ่มเติม'}</p>
                        <div class="text-[11px] text-slate-400 flex flex-wrap gap-3">
                            <span><i class="fas fa-user-tie"></i> ครู: ${s.teacher_name}</span>
                            <span><i class="fas fa-calendar"></i> วันที่ ${s.start_date} ถึง ${s.end_date}</span>
                            <span><i class="fas fa-clock"></i> เวลา ${s.start_time.substring(0,5)} - ${s.end_time.substring(0,5)}</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-2 shrink-0">
                        ${s.zoom_link ? `<a href="${s.zoom_link}" target="_blank" class="px-3 py-2 bg-blue-600 text-white font-bold text-xs rounded-xl hover:bg-blue-700 transition-all flex items-center gap-1.5"><i class="fas fa-video"></i> เข้า Zoom</a>` : ''}
                        <button onclick='deleteSchedule("${s.id}")' class="p-2 bg-rose-50 text-rose-600 rounded-xl hover:bg-rose-100"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
        }

        function changeWeek(direction) {
            weekOffset += direction;
            renderWeeklyGrid();
        }

        async function openCreateScheduleModal() {
            const courseOptions = allCourses.map(c => `<option value="${c.id}">${c.title}</option>`).join('');

            const { value: formValues } = await Swal.fire({
                title: '📅 เพิ่มคาบเรียน / ระบบ Repeat',
                width: '600px',
                html: `
                    <div class="space-y-3 text-left text-xs">
                        <div>
                            <label class="block font-bold mb-1">เลือกคอร์สเรียน <span class="text-red-500">*</span></label>
                            <select id="swalCourseId" class="w-full px-3 py-2 bg-slate-100 dark:bg-slate-800 border rounded-xl outline-none font-bold">${courseOptions}</select>
                        </div>
                        <div>
                            <label class="block font-bold mb-1">หัวข้อการเรียน <span class="text-red-500">*</span></label>
                            <input type="text" id="swalTitle" class="w-full px-3 py-2 bg-slate-100 dark:bg-slate-800 border rounded-xl outline-none font-bold" placeholder="เช่น อัลกอริทึมขั้นสูง พื้นฐาน">
                        </div>
                        <div>
                            <label class="block font-bold mb-1">รายละเอียด</label>
                            <textarea id="swalDesc" class="w-full px-3 py-2 bg-slate-100 dark:bg-slate-800 border rounded-xl outline-none" rows="2" placeholder="รายละเอียดเนื้อหา..."></textarea>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block font-bold mb-1">ชื่อคุณครูผู้สอน <span class="text-red-500">*</span></label>
                                <input type="text" id="swalTeacher" class="w-full px-3 py-2 bg-slate-100 dark:bg-slate-800 border rounded-xl outline-none font-bold" placeholder="เช่น ครูอั่งเปา">
                            </div>
                            <div>
                                <label class="block font-bold mb-1">สีประจำวิชา (Theme Color)</label>
                                <input type="color" id="swalColor" value="#0284c7" class="w-full h-9 px-1 bg-slate-100 dark:bg-slate-800 border rounded-xl cursor-pointer">
                            </div>
                        </div>
                        <div>
                            <label class="block font-bold mb-1">ลิงก์ Zoom เข้าเรียน</label>
                            <input type="url" id="swalZoom" class="w-full px-3 py-2 bg-slate-100 dark:bg-slate-800 border rounded-xl outline-none font-mono" placeholder="https://zoom.us/j/...">
                        </div>
                        <div class="grid grid-cols-3 gap-2">
                            <div>
                                <label class="block font-bold mb-1">วันในสัปดาห์</label>
                                <select id="swalDayOfWeek" class="w-full px-3 py-2 bg-slate-100 dark:bg-slate-800 border rounded-xl outline-none font-bold">
                                    <option value="1">วันจันทร์</option>
                                    <option value="2">วันอังคาร</option>
                                    <option value="3">วันพุธ</option>
                                    <option value="4">วันพฤหัสบดี</option>
                                    <option value="5">วันศุกร์</option>
                                    <option value="6">วันเสาร์</option>
                                    <option value="0">วันอาทิตย์</option>
                                </select>
                            </div>
                            <div>
                                <label class="block font-bold mb-1">เวลาเริ่ม</label>
                                <input type="time" id="swalStartTime" value="09:00" class="w-full px-3 py-2 bg-slate-100 dark:bg-slate-800 border rounded-xl outline-none font-bold">
                            </div>
                            <div>
                                <label class="block font-bold mb-1">เวลาสิ้นสุด</label>
                                <input type="time" id="swalEndTime" value="10:30" class="w-full px-3 py-2 bg-slate-100 dark:bg-slate-800 border rounded-xl outline-none font-bold">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block font-bold mb-1">ตั้งแต่วันที่ (Start Date)</label>
                                <input type="date" id="swalStartDate" class="w-full px-3 py-2 bg-slate-100 dark:bg-slate-800 border rounded-xl outline-none font-bold">
                            </div>
                            <div>
                                <label class="block font-bold mb-1">ถึงวันที่ (End Date - Repeat)</label>
                                <input type="date" id="swalEndDate" class="w-full px-3 py-2 bg-slate-100 dark:bg-slate-800 border rounded-xl outline-none font-bold">
                            </div>

                    </div>
                `,
                showCancelButton: true,
                confirmButtonText: 'บันทึก & สร้างตารางสอน',
                cancelButtonText: 'ยกเลิก',
                confirmButtonColor: '#0284c7',
                preConfirm: () => {
                    const course_id = document.getElementById('swalCourseId').value;
                    const title = document.getElementById('swalTitle').value.trim();
                    const description = document.getElementById('swalDesc').value.trim();
                    const teacher_name = document.getElementById('swalTeacher').value.trim();
                    const color_theme = document.getElementById('swalColor').value;
                    const zoom_link = document.getElementById('swalZoom').value.trim();
                    const day_of_week = document.getElementById('swalDayOfWeek').value;
                    const start_time = document.getElementById('swalStartTime').value + ':00';
                    const end_time = document.getElementById('swalEndTime').value + ':00';
                    const start_date = document.getElementById('swalStartDate').value;
                    const end_date = document.getElementById('swalEndDate').value;

                    if (!title || !teacher_name || !start_date || !end_date) {
                        Swal.showValidationMessage('⚠️ กรุณากรอกข้อมูลสำคัญให้ครบถ้วน');
                        return false;
                    }

                    return { course_id, title, description, teacher_name, color_theme, zoom_link, day_of_week, start_time, end_time, start_date, end_date };
                }
            });

            if (formValues) {
                Swal.fire({ title: 'กำลังบันทึกและแตกสล็อตเวลา...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                
                // 1. Insert Master Schedule
                const { data: schedRes, error: schedErr } = await supabaseClient.from('course_schedules').insert([formValues]).select().single();
                
                if (schedErr) {
                    Swal.fire({ icon: 'error', title: 'บันทึกไม่สำเร็จ', text: schedErr.message });
                    return;
                }

                // 2. Generate 30-min slots
                const slots = generateRecurringSlots(formValues, schedRes.id);
                if (slots.length > 0) {
                    await supabaseClient.from('schedule_slots').insert(slots);
                }

                Swal.fire({ icon: 'success', title: 'สร้างตารางสอนสำเร็จ!', text: `ระบบได้แตกคาบเรียนและสล็อต 30 นาทีเรียบร้อยแล้ว`, confirmButtonColor: '#0284c7' });
                fetchSchedulesData();
            }
        }

        function generateRecurringSlots(data, scheduleId) {
            const slots = [];
            let currentDate = new Date(data.start_date);
            const endDate = new Date(data.end_date);
            const targetDay = parseInt(data.day_of_week);

            while (currentDate <= endDate) {
                if (currentDate.getDay() === targetDay) {
                    const dateString = currentDate.toISOString().split('T')[0];
                    let currentTime = new Date(`${dateString}T${data.start_time}`);
                    const endTime = new Date(`${dateString}T${data.end_time}`);

                    while (currentTime < endTime) {
                        let slotStartStr = currentTime.toTimeString().split(' ')[0];
                        currentTime.setMinutes(currentTime.getMinutes() + 30);
                        let slotEndStr = currentTime.toTimeString().split(' ')[0];

                        slots.push({
                            schedule_id: scheduleId,
                            course_id: data.course_id,
                            slot_date: dateString,
                            start_time: slotStartStr,
                            end_time: slotEndStr,
                            teacher_name: data.teacher_name
                        });
                    }
                }
                currentDate.setDate(currentDate.getDate() + 1);
            }
            return slots;
        }

                            <div><b>เวลา:</b> ${sched.start_time.substring(0,5)} - ${sched.end_time.substring(0,5)}</div>
                            <div><b>ช่วงวันที่:</b> ${sched.start_date} ถึง ${sched.end_date}</div>
                        </div>
                        ${sched.zoom_link ? `<a href="${sched.zoom_link}" target="_blank" class="block w-full py-2.5 bg-blue-600 text-white font-bold text-center rounded-xl hover:bg-blue-700"><i class="fas fa-video"></i> เข้าห้องเรียน Zoom</a>` : ''}
                    </div>
                `,
                confirmButtonText: 'ปิดหน้าต่าง'
            });
        }

        async function deleteSchedule(id) {
            const res = await Swal.fire({ title: 'ลบคาบเรียนนี้?', text: 'การลบจะเอาสล็อตเวลาทั้งหมดออกด้วย', icon: 'warning', showCancelButton: true, confirmButtonText: 'ลบ', confirmButtonColor: '#ef4444' });
            if (res.isConfirmed) {
                await supabaseClient.from('course_schedules').delete().eq('id', id);
                Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'ลบเรียบร้อย', showConfirmButton: false, timer: 2000 });
                fetchSchedulesData();
            }
        }

        initSchedulesPage();
    </script>
</body>
</html>
