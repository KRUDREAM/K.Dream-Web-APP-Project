<body class="bg-slate-50 dark:bg-darkbg min-h-screen text-slate-900 dark:text-slate-100 pb-20">

    <!-- Navbar -->

            <div class="flex justify-between h-20 items-center gap-3">
                <div class="flex items-center gap-3">
                    <button onclick="window.location.href='admin.html'" class="w-10 h-10 rounded-xl bg-slate-100 dark:bg-darkinput flex items-center justify-center hover:bg-sky-500 hover:text-white transition-all">

                    <button onclick="openCourseColorManager()" class="px-3 py-2 bg-amber-50 dark:bg-amber-950/50 text-amber-600 dark:text-amber-400 border border-amber-200 dark:border-amber-900 font-bold text-xs rounded-xl hover:bg-amber-100 transition-all flex items-center gap-1.5">

                    <button onclick="openExportModal()" class="px-3 py-2 bg-indigo-50 dark:bg-indigo-950/50 text-indigo-600 dark:text-indigo-400 border border-indigo-200 dark:border-indigo-900 font-bold text-xs rounded-xl hover:bg-indigo-100 transition-all flex items-center gap-1.5">

                    <button onclick="openCreateScheduleModal()" class="px-4 py-2 bg-gradient-to-r from-emerald-500 to-teal-600 text-white font-bold text-xs rounded-xl shadow-lg hover:opacity-90 transition-all flex items-center gap-2">

    <main class="max-w-7xl mx-auto px-4 sm:px-6 pt-24 sm:pt-28 space-y-6">
        
        <!-- Controls & Filters -->
        <div class="hitech-card p-5 rounded-3xl flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex flex-wrap items-center gap-3 w-full md:w-auto">
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 mb-1">มุมมองการแสดงผล:</label>
                    <div class="flex rounded-xl bg-slate-100 dark:bg-darkinput p-1 border dark:border-slate-800">
                        <button id="btnViewWeekly" onclick="switchViewMode('weekly')" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-sky-600 text-white transition-all">รายสัปดาห์</button>
                        <button id="btnViewMonthly" onclick="switchViewMode('monthly')" class="px-3 py-1.5 rounded-lg text-xs font-bold text-slate-600 dark:text-slate-300 transition-all">รายเดือน</button>
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-slate-400 mb-1">กรองดูตามคุณครูผู้สอน:</label>
                    <select id="filterTeacher" onchange="renderSchedulesView()" class="w-full md:w-64 px-3 py-2 bg-slate-100 dark:bg-darkinput border dark:border-slate-800 rounded-xl text-xs font-bold outline-none">
                        <option value="">-- แสดงคาบเรียนทั้งหมดทุกครู --</option>
                    </select>
                </div>
            </div>

            <div class="flex items-center gap-2 w-full md:w-auto justify-end">
                <button onclick="changePeriod(-1)" class="px-3 py-2 bg-slate-100 dark:bg-darkinput rounded-xl text-xs font-bold hover:bg-sky-500 hover:text-white transition-all"><i class="fas fa-chevron-left"></i> ก่อนหน้า</button>
                <span id="currentPeriodLabel" class="text-xs font-extrabold px-3 py-2 bg-sky-50 dark:bg-sky-950/50 text-sky-600 dark:text-sky-400 rounded-xl">สัปดาห์นี้</span>
                <button onclick="changePeriod(1)" class="px-3 py-2 bg-slate-100 dark:bg-darkinput rounded-xl text-xs font-bold hover:bg-sky-500 hover:text-white transition-all">ถัดไป <i class="fas fa-chevron-right"></i></button>
            </div>
        </div>

        <!-- Matrix Container -->
        <div class="hitech-card p-6 rounded-3xl space-y-4 overflow-x-auto">
            <div class="flex justify-between items-center min-w-[1100px]">
                <h3 id="matrixTitle" class="font-extrabold text-sm text-sky-600 dark:text-sky-400 uppercase tracking-wider flex items-center gap-2">
                    <i class="fas fa-calendar-week"></i> ตารางสอนแนวนอน 1 สัปดาห์ (08:00 - 22:00 น.)
                </h3>
                <span class="text-xs text-slate-400">วิชาเดียวกันต่อกันยาวต่อเนื่อง | คลิกที่ช่องเพื่อดูรายละเอียด/แก้ไข</span>
            </div>

            <div id="matrixContainer" class="min-w-[1100px]">
                <!-- Rendered dynamically -->
            </div>
        </div>

        <!-- Timeline List View -->
        <div class="hitech-card p-6 rounded-3xl space-y-4">
            <h3 class="font-extrabold text-sm text-indigo-600 dark:text-indigo-400 uppercase tracking-wider flex items-center gap-2">
                <i class="fas fa-list-ul"></i> รายการคาบเรียนทั้งหมด (Timeline List)
            </h3>
            <div id="timelineListContainer" class="space-y-3">
                <!-- Rendered dynamically -->
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allSchedules = [];
        let allSlots = [];
        let allCourses = [];
        let viewMode = 'weekly';
        let periodOffset = 0;

        const htmlElement = document.documentElement;
        const themeIcon = document.getElementById('themeIcon');
        if (localStorage.getItem('theme') === 'dark') {
            htmlElement.classList.add('dark');
            themeIcon.classList.replace('fa-moon', 'fa-sun');
        }
        document.getElementById('themeToggle').addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            const isDark = htmlElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeIcon.classList.replace(isDark ? 'fa-moon' : 'fa-sun', isDark ? 'fa-sun' : 'fa-moon');
        });

        async function initSchedulesPage() {
            await fetchMasterData();
            setupRealtimeSubscription();
        }

        async function fetchMasterData() {
            const [coursesRes, schedRes, slotRes] = await Promise.all([
                supabaseClient.from('courses').select('id, title, color_theme'),
                supabaseClient.from('course_schedules').select('*, courses(title, color_theme)'),
                supabaseClient.from('schedule_slots').select('*, courses(title, color_theme)')
            ]);

            allCourses = coursesRes.data || [];
            allSchedules = schedRes.data || [];
            allSlots = slotRes.data || [];

            populateFilterDropdowns();
            renderSchedulesView();
        }

        // 🌟 Realtime Sync Subscription
        function setupRealtimeSubscription() {
            supabaseClient
                .channel('admin-schedules-realtime')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'course_schedules' }, () => {
                    fetchMasterData();
                })
                .on('postgres_changes', { event: '*', schema: 'public', table: 'schedule_slots' }, () => {
                    fetchMasterData();
                })
                .on('postgres_changes', { event: '*', schema: 'public', table: 'courses' }, () => {
                    fetchMasterData();
                })
                .subscribe();
        }

        function populateFilterDropdowns() {
            const select = document.getElementById('filterTeacher');
            const teachers = [...new Set(allSchedules.map(s => s.teacher_name))];
            
            let html = '<option value="">-- แสดงคาบเรียนทั้งหมดทุกครู --</option>';
            teachers.forEach(t => {
                if (t) html += `<option value="${t}">คุณครู: ${t}</option>`;
            });
            select.innerHTML = html;
        }

        function switchViewMode(mode) {
            viewMode = mode;
            periodOffset = 0;
            document.getElementById('btnViewWeekly').className = mode === 'weekly' ? 'px-3 py-1.5 rounded-lg text-xs font-bold bg-sky-600 text-white transition-all' : 'px-3 py-1.5 rounded-lg text-xs font-bold text-slate-600 dark:text-slate-300 transition-all';
            document.getElementById('btnViewMonthly').className = mode === 'monthly' ? 'px-3 py-1.5 rounded-lg text-xs font-bold bg-sky-600 text-white transition-all' : 'px-3 py-1.5 rounded-lg text-xs font-bold text-slate-600 dark:text-slate-300 transition-all';
            renderSchedulesView();
        }

        function changePeriod(direction) {
            periodOffset += direction;
            renderSchedulesView();
        }

        function renderSchedulesView() {
            if (viewMode === 'weekly') {
                renderHorizontalWeeklyGrid();
            } else {
                renderMonthlyGrid();
            }
            renderTimelineList();
        }

        function getFilteredSlots() {
            const filterVal = document.getElementById('filterTeacher').value;
            if (!filterVal) return allSlots;
            return allSlots.filter(s => s.teacher_name === filterVal);
        }

        function getFilteredSchedules() {
            const filterVal = document.getElementById('filterTeacher').value;
            if (!filterVal) return allSchedules;
            return allSchedules.filter(s => s.teacher_name === filterVal);
        }

        function renderHorizontalWeeklyGrid() {
            document.getElementById('matrixTitle').innerHTML = `<i class="fas fa-calendar-week"></i> ตารางสอนแนวนอน 1 สัปดาห์ (08:00 - 22:00 น.)`;
            const container = document.getElementById('matrixContainer');
            const activeSlots = getFilteredSlots();

            const currDate = new Date();
            currDate.setDate(currDate.getDate() + (periodOffset * 7));
            
            const dayOfWeek = currDate.getDay();
            const monday = new Date(currDate);
            monday.setDate(currDate.getDate() - (dayOfWeek === 0 ? 6 : dayOfWeek - 1));

            const weekDays = [];
            for (let i = 0; i < 7; i++) {
                const d = new Date(monday);
                d.setDate(monday.getDate() + i);
                weekDays.push(d);
            }

            document.getElementById('currentPeriodLabel').textContent = `${weekDays[0].toLocaleDateString('th-TH', {day: 'numeric', month: 'short'})} - ${weekDays[6].toLocaleDateString('th-TH', {day: 'numeric', month: 'short', year: 'numeric'})}`;

            const timeSlots = [];
            for (let h = 8; h <= 22; h++) {
                timeSlots.push(`${String(h).padStart(2, '0')}:00:00`);
                if (h < 22) timeSlots.push(`${String(h).padStart(2, '0')}:30:00`);
            }

            let html = `
                <table class="w-full border-collapse text-xs">
                    <thead>
                        <tr class="bg-slate-100 dark:bg-darkinput">
                            <th class="p-2.5 border dark:border-slate-800 w-28 text-center sticky left-0 z-10 bg-slate-100 dark:bg-darkinput">วัน / เวลา</th>
            `;
            timeSlots.forEach(t => {
                html += `<th class="p-2 border dark:border-slate-800 text-center font-mono text-[11px] w-16">${t.substring(0, 5)}</th>`;
            });
            html += `</tr></thead><tbody>`;

            weekDays.forEach(d => {
                const dateStr = d.toISOString().split('T')[0];

                html += `
                    <tr>
                        <td class="p-2.5 border dark:border-slate-800 font-bold bg-slate-50 dark:bg-darkinput sticky left-0 z-10">
                            ${d.toLocaleDateString('th-TH', {weekday: 'long'})}<br>
                            <span class="text-[10px] text-slate-400 font-normal">${d.getDate()} ${d.toLocaleDateString('th-TH', {month: 'short'})}</span>
                        </td>
                `;

                let skipCount = 0;
                for (let i = 0; i < timeSlots.length; i++) {
                    if (skipCount > 0) { skipCount--; continue; }

                    const time = timeSlots[i];
                    const matchedSlot = activeSlots.find(s => s.slot_date === dateStr && s.start_time === time);

                    if (matchedSlot) {
                        const parentSched = allSchedules.find(sc => sc.id === matchedSlot.schedule_id) || {};
                        const courseObj = allCourses.find(c => c.id === parentSched.course_id) || {};
                        // 🌟 ดึงสีประจำคอร์สหลัก หรือสีเฉพาะคาบ
                        const color = courseObj.color_theme || parentSched.color_theme || '#0284c7';

                        let span = 1;
                        for (let j = i + 1; j < timeSlots.length; j++) {
                            const nextTime = timeSlots[j];
                            const nextSlot = activeSlots.find(s => s.slot_date === dateStr && s.start_time === nextTime && s.schedule_id === matchedSlot.schedule_id);
                            if (nextSlot) span++; else break;
                        }
                        skipCount = span - 1;

                        html += `
                            <td colspan="${span}" class="p-1 border dark:border-slate-800 cursor-pointer" onclick='openScheduleDetail(${JSON.stringify(parentSched)})'>
                                <div class="p-2 rounded-xl text-white font-bold text-xs shadow-md truncate flex items-center justify-between" style="background-color: ${color};">
                                    <span class="truncate">${parentSched.title || 'คาบเรียน'} (${parentSched.start_time?.substring(0,5)}-${parentSched.end_time?.substring(0,5)})</span>
                                    <span class="text-[10px] opacity-90 shrink-0 ml-1">ครู: ${matchedSlot.teacher_name}</span>
                                </div>
                            </td>
                        `;
                    } else {
                        html += `<td class="p-2 border dark:border-slate-800 text-center text-slate-300 dark:text-slate-800">-</td>`;
                    }
                }
                html += `</tr>`;
            });

            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        function renderMonthlyGrid() {
            document.getElementById('matrixTitle').innerHTML = `<i class="fas fa-calendar-alt"></i> ภาพรวมปฏิทินรายเดือน (Monthly Calendar Matrix)`;
            const container = document.getElementById('matrixContainer');
            const activeSlots = getFilteredSlots();

            const date = new Date();
            date.setMonth(date.getMonth() + periodOffset);
            const year = date.getFullYear();
            const month = date.getMonth();

            document.getElementById('currentPeriodLabel').textContent = date.toLocaleDateString('th-TH', { month: 'long', year: 'numeric' });

            const firstDayIndex = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();

            let html = `
                <table class="w-full border-collapse text-xs min-w-[900px]">
                    <thead>
                        <tr class="bg-slate-100 dark:bg-darkinput text-center">
                            <th class="p-2 border dark:border-slate-800">อาทิตย์</th>
                            <th class="p-2 border dark:border-slate-800">จันทร์</th>
                            <th class="p-2 border dark:border-slate-800">อังคาร</th>
                            <th class="p-2 border dark:border-slate-800">พุธ</th>
                            <th class="p-2 border dark:border-slate-800">พฤหัสบดี</th>
                            <th class="p-2 border dark:border-slate-800">ศุกร์</th>
                            <th class="p-2 border dark:border-slate-800">เสาร์</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
            `;

            let dayCount = 1;
            for (let i = 0; i < 42; i++) {
                if (i % 7 === 0 && i > 0) html += `</tr><tr>`;

                if (i < firstDayIndex || dayCount > totalDays) {
                    html += `<td class="p-3 border dark:border-slate-800 bg-slate-50/50 dark:bg-darkinput/30 text-slate-300"></td>`;
                } else {
                    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(dayCount).padStart(2, '0')}`;
                    const daySlots = activeSlots.filter(s => s.slot_date === dateStr);

                    html += `
                        <td class="p-2 border dark:border-slate-800 align-top h-28 w-[14%]">
                            <div class="font-bold text-slate-500 mb-1">${dayCount}</div>
                            <div class="space-y-1 overflow-y-auto max-h-20">
                    `;

                    daySlots.forEach(slot => {
                        const parentSched = allSchedules.find(sc => sc.id === slot.schedule_id) || {};
                        const courseObj = allCourses.find(c => c.id === parentSched.course_id) || {};
                        const color = courseObj.color_theme || parentSched.color_theme || '#0284c7';
                        html += `
                            <div onclick='openScheduleDetail(${JSON.stringify(parentSched)})' class="p-1 rounded text-white text-[10px] font-bold truncate cursor-pointer shadow-sm" style="background-color: ${color};" title="${parentSched.title}">
                                ${parentSched.start_time?.substring(0,5)} ${parentSched.title}
                            </div>
                        `;
                    });

                    html += `</div></td>`;
                    dayCount++;
                }
            }

            html += `</tr></tbody></table>`;
            container.innerHTML = html;
        }

        function renderTimelineList() {
            const container = document.getElementById('timelineListContainer');
            const filtered = getFilteredSchedules();

            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-slate-400 text-xs">ยังไม่มีรายการคาบเรียนในระบบ</div>`;
                return;
            }

            container.innerHTML = filtered.map(s => {
                const courseObj = allCourses.find(c => c.id === s.course_id) || {};
                const color = courseObj.color_theme || s.color_theme || '#0284c7';
                return `
                    <div class="p-4 bg-slate-50 dark:bg-darkinput rounded-2xl border dark:border-slate-800 flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
                        <div class="space-y-1">
                            <div class="flex items-center gap-2">
                                <span class="w-3 h-3 rounded-full" style="background-color: ${color}"></span>
                                <h4 class="font-bold text-sm">${s.title}</h4>
                                <span class="px-2 py-0.5 bg-sky-100 dark:bg-sky-950 text-sky-600 dark:text-sky-400 text-[10px] rounded font-bold">${s.courses?.title || courseObj.title || 'คอร์สเรียน'}</span>
                            </div>
                            <p class="text-xs text-slate-500">${s.description || 'ไม่มีรายละเอียดเพิ่มเติม'}</p>
                            <div class="text-[11px] text-slate-400 flex flex-wrap gap-3">
                                <span><i class="fas fa-user-tie"></i> ครู: ${s.teacher_name}</span>
                                <span><i class="fas fa-calendar"></i> ${s.start_date} ถึง ${s.end_date}</span>
                                <span><i class="fas fa-clock"></i> ${s.start_time?.substring(0,5)} - ${s.end_time?.substring(0,5)}</span>
                            </div>
                        </div>
                        <div class="flex items-center gap-2 shrink-0">
                            ${s.zoom_link ? `<a href="${s.zoom_link}" target="_blank" class="px-3 py-2 bg-blue-600 text-white font-bold text-xs rounded-xl hover:bg-blue-700 transition-all flex items-center gap-1.5"><i class="fas fa-video"></i> Zoom</a>` : ''}
                            <button onclick='openEditScheduleModal(${JSON.stringify(s)})' class="px-3 py-2 bg-amber-50 text-amber-600 rounded-xl hover:bg-amber-100 font-bold text-xs"><i class="fas fa-pen"></i> แก้ไข</button>
                            <button onclick='deleteSchedule("${s.id}")' class="p-2 bg-rose-50 text-rose-600 rounded-xl hover:bg-rose-100"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 🌟 หน้าต่างจัดการสีประจำคอร์ส
        async function openCourseColorManager() {
            if (allCourses.length === 0) {
                Swal.fire('แจ้งเตือน', 'ยังไม่มีคอร์สเรียนในระบบ', 'warning');
                return;
            }

            const courseRows = allCourses.map(c => `
                <div class="flex items-center justify-between p-3 bg-slate-50 dark:bg-darkinput rounded-xl border dark:border-slate-800">
                    <span class="font-bold text-xs">${c.title}</span>
                    <input type="color" id="courseColor_${c.id}" value="${c.color_theme || '#0284c7'}" class="w-10 h-8 px-1 bg-transparent border rounded-lg cursor-pointer">
                </div>
            `).join('');

            const { value: confirmed } = await Swal.fire({

        function generateRecurringSlots(data, scheduleId) {
            const slots = [];
            let currentDate = new Date(data.start_date);
            const endDate = new Date(data.end_date);
            const targetDay = parseInt(data.day_of_week);

            while (currentDate <= endDate) {
                if (currentDate.getDay() === targetDay) {
                    const dateString = currentDate.toISOString().split('T')[0];
                    let currentTime = new Date(`${dateString}T${data.start_time}`);
                    const endTime = new Date(`${dateString}T${data.end_time}`);

                    while (currentTime < endTime) {
                        let slotStartStr = currentTime.toTimeString().split(' ')[0];
                        currentTime.setMinutes(currentTime.getMinutes() + 30);
                        let slotEndStr = currentTime.toTimeString().split(' ')[0];

                        slots.push({
                            schedule_id: scheduleId,
                            course_id: data.course_id,
                            slot_date: dateString,
                            start_time: slotStartStr,
                            end_time: slotEndStr,
                            teacher_name: data.teacher_name
                        });
                    }
                }
                currentDate.setDate(currentDate.getDate() + 1);
            }
            return slots;
        }

                    const end = document.getElementById('exportEnd').value;

                        Swal.showValidationMessage('⚠️ กรุณาเลือกช่วงวันที่ให้ครบถ้วน');
                        return false;
                    }
                    return { start, end };
                }
            });

            if (formValues) {
                const activeSlots = getFilteredSlots().filter(s => s.slot_date >= formValues.start && s.slot_date <= formValues.end);
                if (activeSlots.length === 0) {
                    Swal.fire('ไม่พบข้อมูล', 'ไม่มีคาบเรียนในช่วงเวลาที่เลือก', 'info');
                    return;
                }

                let csvContent = "\uFEFF" + "วันที่,เวลาเริ่ม,เวลาสิ้นสุด,หัวข้อการเรียน,คุณครูผู้สอน,ลิงก์ Zoom\n";
                activeSlots.forEach(slot => {
                    const sched = allSchedules.find(sc => sc.id === slot.schedule_id) || {};
                    csvContent += `"${slot.slot_date}","${slot.start_time}","${slot.end_time}","${sched.title || ''}","${slot.teacher_name}","${sched.zoom_link || ''}"\n`;
                });

                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `schedules_${formValues.start}_to_${formValues.end}.csv`;
                a.click();
                URL.revokeObjectURL(url);
            }
        }
