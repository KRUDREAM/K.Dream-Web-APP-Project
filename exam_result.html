<!DOCTYPE html>
<html lang="th" class="light select-none">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRUDREAM LAND | ผลการสอบและเฉลย</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Prompt', 'sans-serif'] }, colors: { primary: '#2563eb', darkbg: '#030712', darkbox: '#111827', darkinput: '#1f2937' } } } }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; user-select: none; }
        @media print { body { display: none !important; } }
    </style>
</head>
<body class="bg-slate-50 dark:bg-darkbg min-h-screen text-gray-800 dark:text-gray-100" oncontextmenu="return false;">

    <nav class="bg-white dark:bg-darkbox border-b dark:border-gray-800 fixed w-full top-0 z-50">
        <div class="max-w-5xl mx-auto px-6 h-20 flex justify-between items-center">
            <button onclick="window.location.href='student.html'" class="px-4 py-2 bg-slate-100 dark:bg-darkinput text-gray-700 dark:text-gray-200 rounded-xl text-xs font-bold"><i class="fas fa-home mr-1"></i> กลับหน้าหลัก</button>
            <h1 class="font-extrabold text-lg text-gray-900 dark:text-white">รายงานผลการสอบและเฉลย</h1>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto pt-28 pb-20 px-4 space-y-8">
        <!-- Summary Score Card -->
        <div class="bg-white dark:bg-darkbox p-8 rounded-3xl shadow-xl text-center space-y-4 border border-gray-100 dark:border-gray-800">
            <div class="w-16 h-16 bg-blue-50 text-primary rounded-2xl flex items-center justify-center text-2xl font-bold mx-auto"><i class="fas fa-trophy"></i></div>
            <h2 id="resultExamTitle" class="text-xl font-extrabold">สรุปคะแนนสอบ</h2>
            <div id="scoreDisplay" class="text-4xl font-black text-primary">0 / 0</div>
            <p id="resultStatusText" class="text-xs text-gray-500">ทำสอบเสร็จสิ้น</p>
        </div>

        <!-- เฉลยข้อสอบ (ล็อคการดาวน์โหลด) -->
        <div class="bg-white dark:bg-darkbox p-8 rounded-3xl shadow-xl space-y-6 border border-gray-100 dark:border-gray-800">
            <h3 class="font-bold text-base flex items-center gap-2"><i class="fas fa-check-circle text-emerald-500"></i> เฉลยคำตอบย้อนหลัง</h3>
            <div id="solutionsList" class="space-y-4"></div>
        </div>

        <!-- ระบบ Q&A สอบถามคุณครูโดยตรง (Realtime) -->
        <div class="bg-white dark:bg-darkbox p-8 rounded-3xl shadow-xl space-y-4 border border-gray-100 dark:border-gray-800">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-base flex items-center gap-2 text-indigo-600 dark:text-indigo-400"><i class="fas fa-comments"></i> สอบถามข้อสงสัยกับคุณครู (Realtime Chat)</h3>
                <span class="text-[10px] bg-emerald-100 text-emerald-600 px-2.5 py-1 rounded-full font-bold animate-pulse">● เชื่อมต่อสด</span>
            </div>
            <div id="qaMessagesList" class="space-y-3 max-h-60 overflow-y-auto"></div>
            <div class="flex gap-2">
                <input id="qaInput" class="flex-1 px-4 py-2.5 bg-slate-50 dark:bg-darkinput border rounded-xl text-xs outline-none" placeholder="พิมพ์ข้อสงสัยเกี่ยวกับข้อสอบชุดนี้ส่งถึงคุณครู...">
                <button onclick="sendQaMessage()" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-xs transition-all">ส่งคำถาม</button>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const attemptId = urlParams.get('attempt_id');
        let currentAttempt = null;

        function checkStudentAuth() {
            const studentId = localStorage.getItem('student_id') || 
                              localStorage.getItem('user_id') || 
                              localStorage.getItem('user') || 
                              localStorage.getItem('id') ||
                              localStorage.getItem('userId');

            const studentName = localStorage.getItem('full_name') || 
                                localStorage.getItem('user_name') || 
                                localStorage.getItem('name') || 
                                localStorage.getItem('username');

            if (!studentId && !studentName) {
                Swal.fire({
                    icon: 'error',
                    title: 'ยังไม่ได้เข้าสู่ระบบ',
                    text: 'กรุณาเข้าสู่ระบบก่อนใช้งานหน้านี้',
                    confirmButtonText: 'ไปหน้าเข้าสู่ระบบ',
                    allowOutsideClick: false
                }).then(() => {
                    window.location.href = 'index.html'; 
                });
                return false;
            }
            return true;
        }
        
        async function initPage() {
            if (!checkStudentAuth()) return;
            if (!attemptId) { window.location.href = 'student.html'; return; }
            
            const { data: attempt } = await mySupabase.from('exam_attempts').select('*, exams(*)').eq('id', attemptId).single();
            if (!attempt) {
                Swal.fire('ไม่พบข้อมูลการสอบ', '', 'error').then(() => window.location.href = 'student.html');
                return;
            }

            currentAttempt = attempt;
            document.getElementById('resultExamTitle').textContent = attempt.exams?.title || 'ผลการสอบ';
            document.getElementById('scoreDisplay').textContent = `${attempt.score} / ${attempt.max_score}`;

            await loadSolutions();
            await loadQaMessages();
            setupQaRealtime();
        }

        function setupQaRealtime() {
            mySupabase
                .channel('exam_qa_realtime')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'exam_questions_qa', filter: `attempt_id=eq.${attemptId}` }, payload => {
                    loadQaMessages();
                })
                .subscribe();
        }

        async function loadSolutions() {
            const { data: questions } = await mySupabase.from('exam_questions').select('*').eq('exam_id', currentAttempt.exam_id).order('question_number');
            const { data: userAnswers } = await mySupabase.from('exam_answers').select('*').eq('attempt_id', attemptId);

            const ansMap = {};
            (userAnswers || []).forEach(a => ansMap[a.question_id] = a);

            const container = document.getElementById('solutionsList');
            if (!questions || questions.length === 0) {
                container.innerHTML = `<div class="text-center py-4 text-gray-400 text-xs">ไม่มีข้อมูลเฉลยคำตอบ</div>`;
                return;
            }

            container.innerHTML = questions.map((q, idx) => {
                const userAns = ansMap[q.id];
                const isEssay = q.question_type === 'essay';
                const isCorrect = !isEssay && userAns && String(userAns.selected_option_index) === String(q.correct_answer);

                const opts = q.options || ['ก', 'ข', 'ค', 'ง'];

                return `
                    <div class="p-4 rounded-2xl border ${isEssay ? 'bg-amber-50/40 border-amber-200 dark:bg-amber-950/20 dark:border-amber-900' : (isCorrect ? 'bg-emerald-50/50 border-emerald-200 dark:bg-emerald-950/20 dark:border-emerald-900' : 'bg-red-50/50 border-red-200 dark:bg-red-950/20 dark:border-red-900')} text-xs space-y-2">
                        <div class="flex justify-between font-bold">
                            <span>ข้อที่ ${q.question_number || (idx+1)}: ${q.question_text || q.content || ''}</span>
                            ${!isEssay ? `<span class="${isCorrect ? 'text-emerald-600' : 'text-red-500'}">${isCorrect ? '✓ ถูกต้อง' : '✗ ผิด'}</span>` : '<span class="text-amber-600">อัตนัย (ข้อเขียน)</span>'}
                        </div>
                        ${!isEssay ? `
                            <div class="text-gray-600 dark:text-gray-300 space-y-0.5">
                                <div>คำตอบของคุณ: <strong class="text-slate-800 dark:text-white">${userAns && userAns.selected_option_index !== undefined ? opts[userAns.selected_option_index] || userAns.selected_option_index : 'ไม่ได้ตอบ'}</strong></div>
                                <div>เฉลยที่ถูกต้อง: <strong class="text-emerald-600">${opts[q.correct_answer] || q.correct_answer}</strong></div>
                            </div>
                        ` : `
                            <div class="text-gray-600 dark:text-gray-300 space-y-1">
                                <div>คำตอบของคุณ: <div class="p-2 bg-white dark:bg-darkinput rounded-lg mt-1 font-medium whitespace-pre-wrap">${userAns?.subjective_answer || '-'}</div></div>
                                <div class="text-amber-600 font-bold">คะแนนที่ได้: ${userAns?.score ?? 0} / ${q.points || 1} คะแนน</div>
                                ${userAns?.teacher_comment ? `<div class="text-indigo-600 dark:text-indigo-400 font-semibold">คอมเมนต์จากคุณครู: ${userAns.teacher_comment}</div>` : ''}
                            </div>
                        `}
                    </div>
                `;
            }).join('');
        }

        async function loadQaMessages() {
            const { data: msgs } = await mySupabase.from('exam_questions_qa').select('*').eq('attempt_id', attemptId).order('created_at', { ascending: true });
            const list = document.getElementById('qaMessagesList');
            if (!msgs || msgs.length === 0) {
                list.innerHTML = `<div class="text-center py-4 text-gray-400 text-xs">ยังไม่มีข้อความสอบถาม สามารถพิมพ์ส่งคำถามถึงคุณครูได้ด้านล่าง</div>`;
                return;
            }
            list.innerHTML = msgs.map(m => `
                <div class="p-3 bg-slate-50 dark:bg-darkinput rounded-xl text-xs space-y-1">
                    <div class="font-bold text-indigo-600 dark:text-indigo-400"><i class="fas fa-question-circle mr-1"></i> นักเรียน: ${m.message}</div>
                    ${m.reply ? `<div class="text-emerald-600 dark:text-emerald-400 font-semibold pl-4">↳ คุณครูตอบ: ${m.reply}</div>` : '<div class="text-gray-400 italic pl-4">↳ รอตอบกลับจากคุณครู...</div>'}
                </div>
            `).join('');
        }

        async function sendQaMessage() {
            const msgInput = document.getElementById('qaInput');
            const msg = msgInput.value.trim();
            if (!msg) return;

            const studentId = localStorage.getItem('student_id') || localStorage.getItem('user_id') || localStorage.getItem('user') || 'student';

            const { error } = await mySupabase.from('exam_questions_qa').insert([{
                attempt_id: attemptId,
                student_id: studentId,
                message: msg
            }]);

            if (!error) {
                msgInput.value = '';
                loadQaMessages();
            } else {
                Swal.fire('ส่งข้อความไม่สำเร็จ', error.message, 'error');
            }
        }

        initPage();
    </script>
</body>
</html>
