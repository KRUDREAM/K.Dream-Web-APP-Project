<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS | ระบบตรวจข้อสอบอัตนัย</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Prompt', 'sans-serif'] },
                    colors: { primary: '#0284c7', darkbg: '#020617', darkbox: '#090d16', darkinput: '#0f172a' }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .glass-nav { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(226, 232, 240, 0.8); }
        .dark .glass-nav { background: rgba(2, 6, 23, 0.95); border-bottom: 1px solid rgba(30, 41, 59, 0.8); }
        .hitech-card { background: rgba(255, 255, 255, 0.98); border: 1px solid rgba(226, 232, 240, 1); box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        .dark .hitech-card { background: #090d16; border: 1px solid rgba(30, 41, 59, 0.8); }
    </style>
</head>
<body class="bg-slate-50 dark:bg-darkbg min-h-screen text-slate-900 dark:text-slate-100 pb-16">

    <nav class="glass-nav fixed w-full top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 h-16 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-sky-600 text-white flex items-center justify-center font-bold text-sm shadow-md">
                    <i class="fas fa-check-to-slot"></i>
                </div>
                <h1 class="font-extrabold text-sm sm:text-base text-slate-900 dark:text-white">ระบบตรวจข้อสอบอัตนัย (Subjective Grading)</h1>
            </div>
            <a href="admin.html" class="px-3.5 py-1.5 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5">
                <i class="fas fa-arrow-left"></i> กลับหน้าแอดมิน
            </a>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 pt-24 space-y-6">
        
        <!-- ส่วนเลือกชุดข้อสอบ -->
        <div class="hitech-card p-6 rounded-3xl space-y-4">
            <h2 class="font-bold text-sm text-slate-900 dark:text-white flex items-center gap-2">
                <i class="fas fa-filter text-sky-500"></i> เลือกชุดข้อสอบที่ต้องการตรวจ
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="md:col-span-2">
                    <select id="examSelect" onchange="loadStudentSubmissions()" class="w-full p-3 bg-slate-100 dark:bg-darkinput border border-slate-200 dark:border-slate-800 rounded-xl text-xs font-medium outline-none focus:border-sky-500">
                        <option value="">-- กรุณาเลือกชุดข้อสอบ --</option>
                    </select>
                </div>
                <div>
                    <button onclick="loadStudentSubmissions()" class="w-full py-3 bg-sky-600 hover:bg-sky-500 text-white font-bold text-xs rounded-xl shadow-md transition-all">
                        <i class="fas fa-rotate mr-1"></i> โหลดข้อมูลใหม่
                    </button>
                </div>
            </div>
        </div>

        <!-- รายการคำตอบอัตนัยของนักเรียน -->
        <div id="gradingContainer" class="space-y-4">
            <div class="text-center py-20 text-slate-400 text-xs">กรุณาเลือกชุดข้อสอบด้านบนเพื่อเริ่มตรวจข้อสอบ</div>
        </div>

    </main>

    <script>
        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function initAdminGrading() {
            try {
                const { data: exams, error } = await mySupabase.from('exams').select('id, title, exam_code').order('created_at', { ascending: false });
                if (error) throw error;

                const select = document.getElementById('examSelect');
                select.innerHTML = '<option value="">-- กรุณาเลือกชุดข้อสอบ --</option>' + (exams || []).map(ex => `
                    <option value="${ex.id}">${ex.title} (รหัส: ${ex.exam_code || 'ไม่มี'})</option>
                `).join('');
            } catch (err) {
                console.error("Load exams error:", err);
                Swal.fire('เกิดข้อผิดพลาด', 'ไม่สามารถโหลดรายชื่อข้อสอบได้', 'error');
            }
        }

        async function loadStudentSubmissions() {
            const examId = document.getElementById('examSelect').value;
            const container = document.getElementById('gradingContainer');

            if (!examId) {
                container.innerHTML = `<div class="text-center py-20 text-slate-400 text-xs">กรุณาเลือกชุดข้อสอบด้านบนเพื่อเริ่มตรวจข้อสอบ</div>`;
                return;
            }

            container.innerHTML = `<div class="text-center py-20 text-slate-400 text-xs"><i class="fas fa-spinner fa-spin mr-2"></i> กำลังโหลดคำตอบอัตนัยของนักเรียน...</div>`;

            try {
                // 1. ดึงข้อสอบที่เป็น essay ของข้อสอบชุดนี้
                const { data: essayQuestions } = await mySupabase
                    .from('questions')
                    .select('id, question_number, question_text, max_score')
                    .eq('exam_id', examId)
                    .eq('question_type', 'essay');

                if (!essayQuestions || essayQuestions.length === 0) {
                    container.innerHTML = `<div class="hitech-card p-8 rounded-3xl text-center text-slate-400 text-xs">ชุดข้อสอบนี้ไม่มีคำถามประเภทอัตนัย (Essay) ที่ต้องตรวจ</div>`;
                    return;
                }

                const essayQIds = essayQuestions.map(q => q.id);

                // 2. ดึง attempts ของนักเรียนที่ส่งแล้ว
                const { data: attempts } = await mySupabase
                    .from('exam_attempts')
                    .select('id, student_id, total_score, submission_time')
                    .eq('exam_id', examId)
                    .eq('status', 'submitted');

                if (!attempts || attempts.length === 0) {
                    container.innerHTML = `<div class="hitech-card p-8 rounded-3xl text-center text-slate-400 text-xs">ยังไม่มีนักเรียนส่งข้อสอบชุดนี้</div>`;
                    return;
                }

                const attemptIds = attempts.map(a => a.id);

                // 3. ดึงคำตอบข้ออัตนัยจากตาราง exam_answers
                const { data: answers } = await mySupabase
                    .from('exam_answers')
                    .select('id, attempt_id, question_id, score, subjective_answer')
                    .in('attempt_id', attemptIds)
                    .in('question_id', essayQIds);

                // สร้างแผนผังคำถาม
                const questionMap = {};
                essayQuestions.forEach(q => questionMap[q.id] = q);

                let html = '';

                attempts.forEach((att, idx) => {
                    const studentAnswers = (answers || []).filter(ans => ans.attempt_id === att.id);

                    html += `
                        <div class="hitech-card p-6 rounded-3xl space-y-4">
                            <div class="flex justify-between items-center pb-3 border-b border-slate-200 dark:border-slate-800">
                                <div>
                                    <h3 class="font-bold text-sm text-slate-900 dark:text-white">นักเรียนรหัส/ID: ${att.student_id}</h3>
                                    <p class="text-[11px] text-slate-400">ส่งเมื่อ: ${new Date(att.submission_time).toLocaleString('th-TH')}</p>
                                </div>
                                <span class="px-3 py-1 bg-sky-500/10 text-sky-600 font-bold text-xs rounded-xl border border-sky-500/20">คะแนนรวมปัจจุบัน: ${att.total_score || 0}</span>
                            </div>

                            <div class="space-y-4">
                    `;

                    studentAnswers.forEach(ans => {
                        const qInfo = questionMap[ans.question_id] || {};
                        html += `
                            <div class="p-4 bg-slate-50 dark:bg-darkinput rounded-2xl border border-slate-200 dark:border-slate-800 space-y-3">
                                <div class="flex justify-between items-center">
                                    <span class="font-extrabold text-xs text-amber-600 dark:text-amber-400">ข้อที่ ${qInfo.question_number || '?'} (อัตนัย)</span>
                                    <span class="text-[11px] text-slate-400">คะแนนเต็ม: ${qInfo.max_score || 1} คะแนน</span>
                                </div>
                                <div class="text-xs font-semibold text-slate-800 dark:text-slate-200 bg-white dark:bg-slate-900 p-3 rounded-xl border">
                                    <b>โจทย์:</b> ${qInfo.question_text || '-'}
                                </div>
                                <div class="text-xs text-slate-700 dark:text-slate-300 bg-white dark:bg-slate-900 p-3.5 rounded-xl border whitespace-pre-wrap">
                                    <b>คำตอบของนักเรียน:</b><br>${ans.subjective_answer || '<span class="text-slate-400 italic">ไม่ได้เขียนตอบ</span>'}
                                </div>
                                <div class="flex items-center justify-between pt-2">
                                    <div class="flex items-center gap-2">
                                        <label class="text-xs font-bold text-slate-600 dark:text-slate-300">ให้คะแนน:</label>
                                        <input type="number" id="score-${ans.id}" value="${ans.score !== null ? ans.score : 0}" min="0" max="${qInfo.max_score || 10}" step="0.5" class="w-20 p-2 bg-white dark:bg-slate-900 border rounded-xl text-xs font-bold text-center outline-none focus:border-sky-500" />
                                        <span class="text-xs text-slate-400">คะแนน</span>
                                    </div>
                                    <button onclick="saveEssayScore('${ans.id}', '${att.id}', '${examId}')" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-xl shadow-md transition-all">
                                        <i class="fas fa-save mr-1"></i> บันทึกคะแนนข้อนี้
                                    </button>
                                </div>
                            </div>
                        `;
                    });

                    html += `
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = html;

            } catch (err) {
                console.error("Load submissions error:", err);
                container.innerHTML = `<div class="text-center py-10 text-red-500 text-xs">เกิดข้อผิดพลาดในการโหลดข้อมูล: ${err.message}</div>`;
            }
        }

        async function saveEssayScore(answerId, attemptId, examId) {
            const scoreInput = document.getElementById(`score-${answerId}`);
            const newScore = parseFloat(scoreInput.value) || 0;

            try {
                Swal.fire({ title: 'กำลังบันทึกคะแนน...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

                // 1. อัปเดตคะแนนในตาราง exam_answers
                const { error: updateAnsError } = await mySupabase
                    .from('exam_answers')
                    .update({ score: newScore })
                    .eq('id', answerId);

                if (updateAnsError) throw updateAnsError;

                // 2. คำนวณคะแนนรวมใหม่ทั้งหมดของ attempt นี้ แล้วอัปเดตลง exam_attempts
                const { data: allAnswers } = await mySupabase
                    .from('exam_answers')
                    .select('score')
                    .eq('attempt_id', attemptId);

                const totalNewScore = (allAnswers || []).reduce((sum, item) => sum + (parseFloat(item.score) || 0), 0);

                const { error: updateAttemptError } = await mySupabase
                    .from('exam_attempts')
                    .update({ total_score: totalNewScore })
                    .eq('id', attemptId);

                if (updateAttemptError) throw updateAttemptError;

                Swal.fire({
                    icon: 'success',
                    title: 'บันทึกคะแนนสำเร็จ!',
                    text: `อัปเดตคะแนนเรียบร้อย คะแนนรวมใหม่ของนักเรียนคือ ${totalNewScore} คะแนน`,
                    timer: 1500,
                    showConfirmButton: false
                });

                loadStudentSubmissions();

            } catch (err) {
                console.error("Save score error:", err);
                Swal.fire('เกิดข้อผิดพลาด', err.message, 'error');
            }
        }

        initAdminGrading();
    </script>
</body>
</html>
