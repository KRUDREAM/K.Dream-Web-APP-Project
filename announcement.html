    <!-- AUTH GUARD -->
    <script>
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const urlStudentId = urlParams.get('student_id') || urlParams.get('id');
            if (urlStudentId) {
                localStorage.setItem('student_id', urlStudentId);
                localStorage.setItem('id', urlStudentId);
                localStorage.setItem('role', 'student');
            }

            let hasSession = false;
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith('sb-') && key.endsWith('-auth-token')) {
                    const val = localStorage.getItem(key);
                    if (val && val.includes('access_token')) {
                        hasSession = true;
                        break;
                    }
                }
            }
            const fallbackId = localStorage.getItem('id') || localStorage.getItem('admin_id') || localStorage.getItem('user_id') || localStorage.getItem('student_id');
            if (!hasSession && !fallbackId) {
                window.location.replace('index.html');
            }
        })();
    </script>

    <script>
        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let userRole = 'admin';
        let currentStudentId = null;
        let currentStudentData = null;
        let enrolledCoursesList = [];
        let allAnnouncementsData = [];
        let notificationsDataCache = [];
        let currentFilterMode = 'all';

        const htmlElement = document.documentElement;
        if (localStorage.getItem('theme') === 'dark') htmlElement.classList.add('dark');
        document.getElementById('themeToggle').addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            localStorage.setItem('theme', htmlElement.classList.contains('dark') ? 'dark' : 'light');
        });

        async function initPage() {
            const urlParams = new URLSearchParams(window.location.search);
            currentStudentId = urlParams.get('student_id') || urlParams.get('id') || localStorage.getItem('student_id') || localStorage.getItem('id');
            userRole = localStorage.getItem('role') || (currentStudentId ? 'student' : 'admin');

            // ถ้าเป็น Admin ให้แสดงฟอร์มสร้างประกาศฝั่งซ้าย
            if (userRole !== 'student') {
                document.getElementById('creatorSection').classList.remove('hidden');
                document.getElementById('feedSection').className = 'lg:col-span-7 space-y-5';
            }

            // โหลดข้อมูลนักเรียนและประวัติการอ่านถ้ามี
            if (currentStudentId) {
                const { data: studentData } = await mySupabase.from('profiles').select('*').eq('id', currentStudentId).single();
                if (studentData) {
                    currentStudentData = studentData;
                }
            }

            // โหลดรายชื่อคอร์สทั้งหมดสำหรับฟอร์มสร้าง (Admin)
            const { data: courses } = await mySupabase.from('courses').select('id, title, course_code, name');
            if (courses && document.getElementById('courseCheckboxes')) {
                document.getElementById('courseCheckboxes').innerHTML = courses.map(c => `
                    <label class="flex items-center gap-2 text-xs cursor-pointer p-1">
                        <input type="checkbox" name="courseCheckbox" value="${c.id}" class="rounded text-sky-600">
                        <span class="dark:text-slate-200">${c.title || c.name || c.course_code}</span>
                    </label>
                `).join('');
            }

            // ดึงข้อมูลคอร์สที่นักเรียนลงทะเบียนไว้จากตารางต่างๆ อย่างครอบคลุม
            if (currentStudentId) {
                let enrollments = [];
                const tables = ['course_enrollments', 'enrollments', 'student_courses', 'student_enrollments'];
                for (let t of tables) {
                    const { data } = await mySupabase.from(t).select('*').or(`student_id.eq.${currentStudentId},user_id.eq.${currentStudentId}`);
                    if (data && data.length > 0) enrollments = enrollments.concat(data);
                }
                enrolledCoursesList = enrollments;
            }

            await loadAnnouncements();
            loadStudentNotificationsCount();
        }

        // ตรวจสอบสิทธิ์แบบแม่นยำ (รองรับทั้ง ID, Course Code และชื่อคอร์ส)
        function isAnnouncementForThisStudent(announcement) {
            if (!announcement) return false;
            const targetType = announcement.target_type || 'all';

            // 1. ประกาศทั่วไปสำหรับทุกคน
            if (targetType === 'all' || targetType === 'everyone' || !announcement.target_type) {
                return true;
            }

            // 2. เจาะจงรายบุคคล (Specific ID)
            if (targetType === 'specific') {
                const studentId = String(currentStudentData?.id || currentStudentData?.student_id || currentStudentId || '').trim();
                const targetValue = String(announcement.target_value || '').trim();
                if (!targetValue) return false;
                return targetValue.includes(studentId);
            }

            // 3. ระบุตามคอร์สเรียน (Course)
            if (targetType === 'course') {
                if (userRole !== 'student') return true; // แอดมินเห็นหมด
                if (!Array.isArray(enrolledCoursesList) || enrolledCoursesList.length === 0) return false;

                const targetValue = String(announcement.target_value || '').trim();
                if (!targetValue) return false;

                // รายการ ID คอร์สที่ถูกเลือกตอนโพสต์ประกาศ
                const announcementCourseIds = targetValue.split(',').map(id => id.trim().toLowerCase());

                // รวบรวมข้อมูลคอร์สที่นักเรียนคนนี้ลงทะเบียนไว้ทุกมิติ
                let studentIdentifiers = [];
                enrolledCoursesList.forEach(e => {
                    if (e.course_id) studentIdentifiers.push(String(e.course_id).trim().toLowerCase());
                    if (e.courseid) studentIdentifiers.push(String(e.courseid).trim().toLowerCase());
                    if (e.course_code) studentIdentifiers.push(String(e.course_code).trim().toLowerCase());
                    if (e.title) studentIdentifiers.push(String(e.title).trim().toLowerCase());
                    if (e.name) studentIdentifiers.push(String(e.name).trim().toLowerCase());
                    if (e.id && e.id !== currentStudentId) studentIdentifiers.push(String(e.id).trim().toLowerCase());
                });

                // ตรวจสอบว่ามีคอร์สใดตรงกันบ้าง
                return announcementCourseIds.some(acId => 
                    studentIdentifiers.some(si => si === acId || si.includes(acId) || acId.includes(si))
                );
            }

            return false;
        }

        function renderFeed() {
            const feed = document.getElementById('announcementFeed');
            const searchInput = document.getElementById('annSearchInput');
            const keyword = searchInput ? searchInput.value.toLowerCase().trim() : '';

            // กรองประกาศเฉพาะที่นักเรียนคนนี้มีสิทธิ์มองเห็นตาม target_type
            let displayList = allAnnouncementsData.filter(a => isAnnouncementForThisStudent(a));

            // ถ้านักเรียนกดเลือกปุ่มกรอง "เฉพาะคอร์สฉัน" เพิ่มเติม
            if (currentFilterMode === 'course' && userRole === 'student') {
                displayList = displayList.filter(a => (a.target_type || 'all') === 'course');
            }

            // กรองตามคำค้นหา (Search)
            if (keyword) {
                displayList = displayList.filter(a => 
                    (a.title && a.title.toLowerCase().includes(keyword)) || 
                    (a.content && a.content.toLowerCase().includes(keyword))
                );
            }

            if (displayList.length === 0) {
                feed.innerHTML = `
                    <div class="modern-card p-12 rounded-3xl text-center text-slate-400">
                        <i class="fas fa-bullhorn text-3xl mb-3 text-sky-500"></i>
                        <h4 class="text-base font-bold text-slate-700 dark:text-slate-200 mb-1">ไม่พบประกาศในขณะนี้</h4>
                        <p class="text-xs text-slate-400">ยังไม่มีประกาศที่ตรงกับสิทธิ์และคอร์สที่คุณลงทะเบียนไว้</p>
                    </div>
                `;
                return;
            }

            let readIds = [];
            if (currentStudentData && currentStudentData.read_announcements) {
                readIds = Array.isArray(currentStudentData.read_announcements) ? currentStudentData.read_announcements : [];
            }

            feed.innerHTML = displayList.map(a => {
                const dateStr = new Date(a.created_at).toLocaleString('th-TH', { dateStyle: 'medium', timeStyle: 'short' });
                const titleText = a.title || 'ประกาศจากทางโรงเรียน';
                const category = a.category || 'general';
                const isRead = readIds.includes(a.id);

                let badge = `<span class="bg-sky-50 text-sky-600 text-[10px] font-bold px-2.5 py-1 rounded-lg">ประกาศทั่วไป</span>`;
                if (category === 'exam') badge = `<span class="bg-indigo-50 text-indigo-600 text-[10px] font-bold px-2.5 py-1 rounded-lg">แจ้งเปิดข้อสอบ</span>`;
                if (category === 'consult') badge = `<span class="bg-emerald-50 text-emerald-600 text-[10px] font-bold px-2.5 py-1 rounded-lg">เปิดระบบ Consult</span>`;
                if (category === 'video') badge = `<span class="bg-sky-50 text-sky-600 text-[10px] font-bold px-2.5 py-1 rounded-lg">คลิปบทเรียนใหม่</span>`;

                return `
                    <div onclick="markSingleNotificationRead('${a.id}')" class="modern-card p-7 rounded-3xl space-y-3 cursor-pointer transition-all hover:border-sky-500/50 ${!isRead && userRole === 'student' ? 'border-l-4 border-l-sky-500 bg-sky-50/20 dark:bg-slate-900/40' : ''}">
                        <div class="flex justify-between items-start">
                            <div>
                                <div class="mb-2 flex items-center gap-2">
                                    ${badge}
                                    ${!isRead && userRole === 'student' ? '<span class="px-2 py-0.5 rounded-full bg-sky-500 text-white text-[9px] font-extrabold animate-pulse">ยังไม่อ่าน</span>' : '<span class="text-[10px] text-emerald-500 font-bold"><i class="fas fa-check-circle"></i> อ่านแล้ว</span>'}
                                </div>
                                <h4 class="font-bold text-lg text-slate-900 dark:text-white">${titleText}</h4>
                                <span class="text-xs text-slate-400">${dateStr}</span>
                            </div>
                        </div>
                        <div class="text-slate-700 dark:text-slate-200 text-sm whitespace-pre-line bg-slate-50 dark:bg-darkinput p-4 rounded-2xl">${a.content}</div>
                    </div>
                `;
            }).join('');
        }

        function setFilterMode(mode) {
            currentFilterMode = mode;
            const btnAll = document.getElementById('btnFilterAll');
            const btnCourse = document.getElementById('btnFilterCourse');

            if (mode === 'all') {
                btnAll.className = 'px-4 py-2 rounded-xl text-xs font-bold bg-sky-600 text-white shadow-sm transition-all';
                btnCourse.className = 'px-4 py-2 rounded-xl text-xs font-bold text-slate-600 dark:text-slate-300 hover:text-slate-900 transition-all';
            } else {
                btnCourse.className = 'px-4 py-2 rounded-xl text-xs font-bold bg-sky-600 text-white shadow-sm transition-all';
                btnAll.className = 'px-4 py-2 rounded-xl text-xs font-bold text-slate-600 dark:text-slate-300 hover:text-slate-900 transition-all';
            }

            renderFeed();
        }

        async function loadAnnouncements() {
            const { data: anns, error } = await mySupabase.from('announcements').select('*').order('created_at', { ascending: false });
            
            if (error || !anns) {
                document.getElementById('announcementFeed').innerHTML = `<div class="modern-card p-12 rounded-3xl text-center text-slate-400">ไม่สามารถโหลดข้อมูลประกาศได้</div>`;
                return;
            }

            allAnnouncementsData = anns;
            notificationsDataCache = anns;
            renderFeed();
            loadStudentNotificationsCount();
        }

        // ระบบ Dropdown แจ้งเตือนบน Navbar
        function toggleNotifDropdown(event) {
            if (event) event.stopPropagation();
            const dropdown = document.getElementById('notifDropdownMenu');
            if (!dropdown) return;
            dropdown.classList.toggle('hidden');
            if (!dropdown.classList.contains('hidden')) {
                fetchAndRenderNotificationDropdown();
            }
        }

        window.addEventListener('click', function(e) {
            const dropdown = document.getElementById('notifDropdownMenu');
            if (dropdown && !dropdown.classList.contains('hidden')) {
                if (!e.target.closest('#notifDropdownMenu') && !e.target.closest('button[onclick*="toggleNotifDropdown"]')) {
                    dropdown.classList.add('hidden');
                }
            }
        });

        async function loadStudentNotificationsCount() {
            try {
                if (!allAnnouncementsData || allAnnouncementsData.length === 0) return;
                const badge = document.getElementById('notifBadge');
                
                const myValidAnns = allAnnouncementsData.filter(a => isAnnouncementForThisStudent(a));

                let readIds = [];
                if (currentStudentData && currentStudentData.read_announcements) {
                    readIds = Array.isArray(currentStudentData.read_announcements) ? currentStudentData.read_announcements : [];
                }

                const unread = myValidAnns.filter(a => !readIds.includes(a.id));
                const headerCount = document.getElementById('notifHeaderCount');
                if (headerCount) {
                    headerCount.textContent = `${unread.length} ใหม่`;
                }

                if (badge) {
                    if (unread.length > 0) {
                        badge.textContent = unread.length > 9 ? '9+' : unread.length;
                        badge.classList.remove('hidden');
                    } else {
                        badge.classList.add('hidden');
                    }
                }
            } catch (err) {
                console.warn("Notification count warning:", err);
            }
        }

        async function fetchAndRenderNotificationDropdown() {
            const listContainer = document.getElementById('notifDropdownList');
            if (!listContainer) return;

            try {
                const myValidAnns = allAnnouncementsData.filter(a => isAnnouncementForThisStudent(a));
                if (myValidAnns.length === 0) {
                    listContainer.innerHTML = `<div class="px-4 py-6 text-center text-slate-400 text-xs">ยังไม่มีการแจ้งเตือนสำหรับคุณ</div>`;
                    return;
                }

                let readIds = [];
                if (currentStudentData && currentStudentData.read_announcements) {
                    readIds = Array.isArray(currentStudentData.read_announcements) ? currentStudentData.read_announcements : [];
                }

                listContainer.innerHTML = myValidAnns.slice(0, 10).map(a => {
                    const isRead = readIds.includes(a.id);
                    const dateStr = new Date(a.created_at).toLocaleDateString('th-TH');
                    const category = a.category || 'general';

                    let catIcon = 'fa-bullhorn text-sky-500';
                    if (category === 'exam') catIcon = 'fa-file-pen text-indigo-500';
                    if (category === 'consult') catIcon = 'fa-comments text-emerald-500';
                    if (category === 'video') catIcon = 'fa-play-circle text-rose-500';

                    return `
                        <div onclick="markSingleNotificationRead('${a.id}'); toggleNotifDropdown();" class="px-4 py-3 hover:bg-sky-50 dark:hover:bg-slate-800/85 cursor-pointer transition-all flex items-start gap-3 ${isRead ? 'opacity-70' : 'bg-sky-50/40 dark:bg-slate-900/40 font-bold'}">
                            <div class="w-8 h-8 rounded-xl bg-white dark:bg-darkinput border border-slate-200 dark:border-slate-800 flex items-center justify-center shrink-0 shadow-sm mt-0.5">
                                <i class="fas ${catIcon} text-xs"></i>
                            </div>
                            <div class="flex-1 min-w-0 space-y-0.5">
                                <div class="flex justify-between items-center gap-1">
                                    <h5 class="text-xs text-slate-900 dark:text-white truncate">${a.title || 'ประกาศจากระบบ'}</h5>
                                    ${!isRead ? '<span class="w-2 h-2 rounded-full bg-sky-500 shrink-0"></span>' : ''}
                                </div>
                                <p class="text-[11px] text-slate-500 dark:text-slate-400 font-light line-clamp-1">${a.content || ''}</p>
                                <span class="text-[9px] text-slate-400 block">${dateStr}</span>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                listContainer.innerHTML = `<div class="px-4 py-6 text-center text-rose-500 text-xs">ไม่สามารถโหลดการแจ้งเตือนได้</div>`;
            }
        }

        async function markSingleNotificationRead(annId) {
            if (userRole !== 'student' || !currentStudentId) return;
            let readIds = [];
            if (currentStudentData && currentStudentData.read_announcements) {
                readIds = Array.isArray(currentStudentData.read_announcements) ? [...currentStudentData.read_announcements] : [];
            }

            if (!readIds.includes(annId)) {
                readIds.push(annId);
                if (currentStudentData) currentStudentData.read_announcements = readIds;

                await mySupabase.from('profiles').update({ read_announcements: readIds }).eq('id', currentStudentId);
                loadStudentNotificationsCount();
                renderFeed();
            }
        }

        async function markAllNotificationsRead() {
            if (userRole !== 'student' || !currentStudentId || !notificationsDataCache) return;
            let readIds = [];
            if (currentStudentData && currentStudentData.read_announcements) {
                readIds = Array.isArray(currentStudentData.read_announcements) ? [...currentStudentData.read_announcements] : [];
            }

            notificationsDataCache.forEach(a => {
                if (!readIds.includes(a.id)) readIds.push(a.id);
            });

            if (currentStudentData) currentStudentData.read_announcements = readIds;
            await mySupabase.from('profiles').update({ read_announcements: readIds }).eq('id', currentStudentId);

            loadStudentNotificationsCount();
            renderFeed();
            Swal.fire({ icon: 'success', title: 'อ่านการแจ้งเตือนทั้งหมดแล้ว', timer: 1000, showConfirmButton: false });
        }

        function handleTargetTypeChange() {
            const val = document.getElementById('targetType').value;
            document.getElementById('courseSelectContainer').classList.toggle('hidden', val !== 'course');
        }

        function goBack() {
            window.location.href = currentStudentId ? `student.html?student_id=${currentStudentId}` : 'admin.html';
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const title = document.getElementById('annTitle').value;
            const content = document.getElementById('annContent').value;
            const category = document.getElementById('annCategory').value;
            const targetType = document.getElementById('targetType').value;
            let targetValue = '';

            if (targetType === 'course') {
                targetValue = Array.from(document.querySelectorAll('input[name="courseCheckbox"]:checked')).map(cb => cb.value).join(',');
            }

            Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            const { error } = await mySupabase.from('announcements').insert([{ title, content, category, target_type: targetType, target_value: targetValue }]);
            if (error) {
                Swal.fire('เกิดข้อผิดพลาด', error.message, 'error');
                return;
            }

            Swal.fire({ icon: 'success', title: 'โพสต์สำเร็จ', timer: 1200, showConfirmButton: false });
            document.getElementById('announcementForm').reset();
            loadAnnouncements();
        }

        initPage();
    </script>
</body>
</html>
