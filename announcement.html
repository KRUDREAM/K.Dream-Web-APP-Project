<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <script src="lms_core.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRUDREAM LAND | ศูนย์รวมประกาศและข่าวสาร</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- AUTH GUARD -->
    <script>
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const urlStudentId = urlParams.get('student_id') || urlParams.get('id');
            if (urlStudentId) {
                localStorage.setItem('student_id', urlStudentId);
                localStorage.setItem('id', urlStudentId);
                localStorage.setItem('role', 'student');
            }

            let hasSession = false;
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith('sb-') && key.endsWith('-auth-token')) {
                    const val = localStorage.getItem(key);
                    if (val && val.includes('access_token')) {
                        hasSession = true;
                        break;
                    }
                }
            }
            const fallbackId = localStorage.getItem('id') || localStorage.getItem('admin_id') || localStorage.getItem('user_id') || localStorage.getItem('student_id');
            if (!hasSession && !fallbackId) {
                window.location.replace('index.html');
            }
        })();
    </script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { 
                extend: { 
                    fontFamily: { sans: ['Prompt', 'sans-serif'] }, 
                    colors: { primary: '#0284c7', darkbg: '#020617', darkbox: '#090d16', darkinput: '#0f172a' } 
                } 
            }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .glass-nav { background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(226, 232, 240, 0.8); }
        .dark .glass-nav { background: rgba(2, 6, 23, 0.92); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(30, 41, 59, 0.8); }
        .modern-card { background: #ffffff; border: 1px solid rgba(226, 232, 240, 1); box-shadow: 0 10px 25px -5px rgba(2, 132, 199, 0.08); }
        .dark .modern-card { background: #090d16; border: 1px solid rgba(30, 58, 138, 0.6); }
        .btn-glow { transition: all 0.3s ease; box-shadow: 0 4px 20px rgba(2, 132, 199, 0.25); }
        .btn-glow:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(2, 132, 199, 0.4); }
    </style>
</head>
<body class="bg-slate-50 dark:bg-darkbg min-h-screen text-slate-900 dark:text-slate-100">

    <nav class="glass-nav fixed w-full top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <div class="flex items-center gap-4">
                    <button onclick="goBack()" class="w-11 h-11 flex items-center justify-center rounded-2xl bg-white dark:bg-darkinput text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 hover:bg-primary hover:text-white transition-all shadow-sm">
                        <i class="fas fa-arrow-left text-lg"></i>
                    </button>
                    <div>
                        <h1 class="font-extrabold text-xl text-slate-900 dark:text-white flex items-center gap-2">
                            <span class="w-8 h-8 rounded-xl bg-sky-600 text-white flex items-center justify-center text-sm shadow-md"><i class="fas fa-bullhorn"></i></span>
                            ศูนย์รวมประกาศและข่าวสาร
                        </h1>
                        <p class="text-xs text-slate-500 dark:text-slate-400">ประกาศและข่าวสารแจ้งเตือนทั้งหมดในระบบ</p>
                    </div>
                </div>
                <button id="themeToggle" class="w-11 h-11 flex items-center justify-center rounded-2xl bg-white dark:bg-darkinput text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700">
                    <i class="fas fa-moon text-lg" id="themeIcon"></i>
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-32 pb-20">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            
            <!-- ฟอร์มสร้างประกาศ (สำหรับ Admin) -->
            <div id="creatorSection" class="lg:col-span-5 modern-card p-8 rounded-3xl sticky top-28 hidden">
                <div class="flex items-center gap-4 mb-6 pb-4 border-b border-slate-100 dark:border-slate-800">
                    <div class="w-14 h-14 bg-gradient-to-br from-sky-500 to-indigo-600 text-white rounded-2xl flex items-center justify-center text-2xl shadow-lg shadow-sky-500/30">
                        <i class="fas fa-edit"></i>
                    </div>
                    <div>
                        <h2 class="text-xl font-bold text-slate-900 dark:text-white">สร้างประกาศใหม่</h2>
                        <p class="text-xs text-slate-500 dark:text-slate-400">เลือกประเภทและการแจ้งเตือน</p>
                    </div>
                </div>

                <form id="announcementForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2">ประเภทประกาศ <span class="text-red-500">*</span></label>
                        <select id="annCategory" class="w-full px-4 py-3 bg-slate-50 dark:bg-darkinput border border-slate-200 dark:border-slate-700 rounded-2xl dark:text-white text-sm outline-none font-bold">
                            <option value="general">📢 ประกาศทั่วไป / ข่าวสาร</option>
                            <option value="exam">📝 แจ้งเปิดข้อสอบใหม่</option>
                            <option value="consult">💬 แจ้งเปิดระบบ Consult / ปรึกษา</option>
                            <option value="video">🎬 แจ้งอัปโหลดคลิปบทเรียนใหม่</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2">หัวข้อประกาศ <span class="text-red-500">*</span></label>
                        <input type="text" id="annTitle" required placeholder="เช่น เปิดข้อสอบชุดที่ 1..." class="w-full px-4 py-3 bg-slate-50 dark:bg-darkinput border border-slate-200 dark:border-slate-700 rounded-2xl dark:text-white focus:border-sky-500 outline-none text-sm">
                    </div>

                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2">เนื้อหาประกาศ <span class="text-red-500">*</span></label>
                        <textarea id="annContent" required rows="4" placeholder="พิมพ์รายละเอียดประกาศที่นี่..." class="w-full px-4 py-3 bg-slate-50 dark:bg-darkinput border border-slate-200 dark:border-slate-700 rounded-2xl dark:text-white focus:border-sky-500 outline-none text-sm resize-none"></textarea>
                    </div>

                    <div class="p-4 bg-sky-50/50 dark:bg-slate-800/50 rounded-2xl border border-sky-100 dark:border-slate-700 space-y-3">
                        <label class="block text-xs font-bold uppercase tracking-wider text-sky-700 dark:text-sky-400">
                            <i class="fas fa-bullseye mr-1"></i> เลือกกลุ่มเป้าหมายนักเรียน
                        </label>
                        <select id="targetType" onchange="handleTargetTypeChange()" class="w-full px-4 py-3 bg-white dark:bg-darkinput border border-slate-200 dark:border-slate-700 rounded-xl dark:text-white text-sm outline-none font-medium">
                            <option value="all">📢 ทุกคนในระบบ (ประกาศทั่วไป)</option>
                            <option value="course">📚 ตามคอร์สเรียน (เลือกคอร์ส)</option>
                        </select>

                        <div id="courseSelectContainer" class="hidden space-y-2">
                            <p class="text-[11px] font-bold text-slate-500 dark:text-slate-400">เลือกคอร์สเรียนที่ต้องการ:</p>
                            <div id="courseCheckboxes" class="max-h-40 overflow-y-auto space-y-1.5 p-2 bg-white dark:bg-darkinput rounded-xl border border-slate-200 dark:border-slate-700">
                                <span class="text-xs text-slate-400">กำลังโหลดคอร์ส...</span>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-sky-600 hover:bg-sky-700 text-white py-3.5 rounded-2xl font-bold text-sm transition-all shadow-lg shadow-sky-500/20">
                        โพสต์ประกาศ
                    </button>
                </form>
            </div>

            <!-- Feed ประกาศ -->
            <div id="feedSection" class="lg:col-span-12 space-y-5">
                <div class="modern-card p-6 rounded-3xl flex flex-col sm:flex-row justify-between items-center gap-4">
                    <h3 class="font-bold text-lg text-slate-900 dark:text-white flex items-center gap-3">
                        <span class="w-10 h-10 rounded-xl bg-slate-100 dark:bg-slate-800 text-sky-600 flex items-center justify-center text-sm"><i class="fas fa-bullhorn"></i></span>
                        ประกาศทั้งหมดในระบบ
                    </h3>
                    
                    <!-- ปุ่มสลับโหมดการแสดงผล (ช่วยให้เช็กได้ทันทีว่าติดปัญหาอะไร) -->
                    <div class="flex items-center gap-2 bg-slate-100 dark:bg-darkinput p-1.5 rounded-2xl border border-slate-200 dark:border-slate-700">
                        <button onclick="setFilterMode('all')" id="btnFilterAll" class="px-4 py-2 rounded-xl text-xs font-bold bg-sky-600 text-white shadow-sm transition-all">
                            ดูประกาศทั้งหมด
                        </button>
                        <button onclick="setFilterMode('course')" id="btnFilterCourse" class="px-4 py-2 rounded-xl text-xs font-bold text-slate-600 dark:text-slate-300 hover:text-slate-900 transition-all">
                            เฉพาะคอร์สที่ฉันลง
                        </button>
                    </div>
                </div>

                <div id="announcementFeed" class="space-y-4">
                    <div class="modern-card p-12 rounded-3xl text-center text-slate-400">
                        <i class="fas fa-spinner fa-spin text-3xl mb-3 text-sky-600"></i>
                        <p class="text-sm font-medium">กำลังโหลดประกาศ...</p>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let userRole = 'admin';
        let currentStudentId = null;
        let studentEnrolledCourses = [];
        let allAnnouncementsData = [];
        let currentFilterMode = 'all'; // 'all' หรือ 'course'

        const htmlElement = document.documentElement;
        if (localStorage.getItem('theme') === 'dark') htmlElement.classList.add('dark');
        document.getElementById('themeToggle').addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            localStorage.setItem('theme', htmlElement.classList.contains('dark') ? 'dark' : 'light');
        });

        async function initPage() {
            const urlParams = new URLSearchParams(window.location.search);
            currentStudentId = urlParams.get('student_id') || urlParams.get('id') || localStorage.getItem('student_id') || localStorage.getItem('id');
            userRole = localStorage.getItem('role') || (currentStudentId ? 'student' : 'admin');

            // ถ้าเป็น Admin ให้แสดงฟอร์มสร้างประกาศฝั่งซ้าย
            if (userRole !== 'student') {
                document.getElementById('creatorSection').classList.remove('hidden');
                document.getElementById('feedSection').className = 'lg:col-span-7 space-y-5';
            }

            // โหลดรายชื่อคอร์สทั้งหมดสำหรับฟอร์มสร้าง (Admin)
            const { data: courses } = await mySupabase.from('courses').select('id, title, course_code, name');
            if (courses && document.getElementById('courseCheckboxes')) {
                document.getElementById('courseCheckboxes').innerHTML = courses.map(c => `
                    <label class="flex items-center gap-2 text-xs cursor-pointer p-1">
                        <input type="checkbox" name="courseCheckbox" value="${c.id}" class="rounded text-sky-600">
                        <span class="dark:text-slate-200">${c.title || c.name || c.course_code}</span>
                    </label>
                `).join('');
            }

            // ดึงข้อมูลคอร์สที่นักเรียนลงทะเบียนไว้จากตารางต่างๆ
            if (currentStudentId) {
                let enrollments = [];
                const tables = ['course_enrollments', 'enrollments', 'student_courses', 'student_enrollments'];
                for (let t of tables) {
                    const { data } = await mySupabase.from(t).select('*').or(`student_id.eq.${currentStudentId},user_id.eq.${currentStudentId}`);
                    if (data && data.length > 0) enrollments = enrollments.concat(data);
                }

                studentEnrolledCourses = enrollments.map(e => String(e.course_id || e.courseid || e.id || '').trim().toLowerCase()).filter(Boolean);
            }

            await loadAnnouncements();
        }

        function setFilterMode(mode) {
            currentFilterMode = mode;
            const btnAll = document.getElementById('btnFilterAll');
            const btnCourse = document.getElementById('btnFilterCourse');

            if (mode === 'all') {
                btnAll.className = 'px-4 py-2 rounded-xl text-xs font-bold bg-sky-600 text-white shadow-sm transition-all';
                btnCourse.className = 'px-4 py-2 rounded-xl text-xs font-bold text-slate-600 dark:text-slate-300 hover:text-slate-900 transition-all';
            } else {
                btnCourse.className = 'px-4 py-2 rounded-xl text-xs font-bold bg-sky-600 text-white shadow-sm transition-all';
                btnAll.className = 'px-4 py-2 rounded-xl text-xs font-bold text-slate-600 dark:text-slate-300 hover:text-slate-900 transition-all';
            }

            renderFeed();
        }

        async function loadAnnouncements() {
            const { data: anns, error } = await mySupabase.from('announcements').select('*').order('created_at', { ascending: false });
            
            if (error || !anns) {
                document.getElementById('announcementFeed').innerHTML = `<div class="modern-card p-12 rounded-3xl text-center text-slate-400">ไม่สามารถโหลดข้อมูลประกาศได้</div>`;
                return;
            }

            allAnnouncementsData = anns;
            renderFeed();
        }

        function renderFeed() {
            const feed = document.getElementById('announcementFeed');
            let displayList = allAnnouncementsData;

            // ถ้าเลือกโหมดเฉพาะคอร์สที่ลงทะเบียน
            if (currentFilterMode === 'course' && userRole === 'student') {
                displayList = allAnnouncementsData.filter(a => {
                    const targetType = a.target_type || 'all';
                    if (targetType === 'all' || !a.target_type) return true;
                    if (targetType === 'course') {
                        const targetVal = String(a.target_value || '').toLowerCase();
                        return studentEnrolledCourses.some(sc => targetVal.includes(sc));
                    }
                    return false;
                });
            }

            if (displayList.length === 0) {
                feed.innerHTML = `
                    <div class="modern-card p-12 rounded-3xl text-center text-slate-400">
                        <i class="fas fa-bullhorn text-3xl mb-3 text-sky-500"></i>
                        <h4 class="text-base font-bold text-slate-700 dark:text-slate-200 mb-1">ยังไม่มีประกาศในหมวดหมู่นี้</h4>
                        <p class="text-xs text-slate-400">ลองสลับไปดู "ดูประกาศทั้งหมด" ด้านบนได้ครับ</p>
                    </div>
                `;
                return;
            }

            feed.innerHTML = displayList.map(a => {
                const dateStr = new Date(a.created_at).toLocaleString('th-TH', { dateStyle: 'medium', timeStyle: 'short' });
                const titleText = a.title || 'ประกาศจากทางโรงเรียน';
                const category = a.category || 'general';

                let badge = `<span class="bg-sky-50 text-sky-600 text-[10px] font-bold px-2.5 py-1 rounded-lg">ประกาศทั่วไป</span>`;
                if (category === 'exam') badge = `<span class="bg-indigo-50 text-indigo-600 text-[10px] font-bold px-2.5 py-1 rounded-lg">แจ้งเปิดข้อสอบ</span>`;
                if (category === 'consult') badge = `<span class="bg-emerald-50 text-emerald-600 text-[10px] font-bold px-2.5 py-1 rounded-lg">เปิดระบบ Consult</span>`;
                if (category === 'video') badge = `<span class="bg-sky-50 text-sky-600 text-[10px] font-bold px-2.5 py-1 rounded-lg">คลิปบทเรียนใหม่</span>`;

                return `
                    <div class="modern-card p-7 rounded-3xl space-y-3">
                        <div class="flex justify-between items-start">
                            <div>
                                <div class="mb-2">${badge}</div>
                                <h4 class="font-bold text-lg text-slate-900 dark:text-white">${titleText}</h4>
                                <span class="text-xs text-slate-400">${dateStr}</span>
                            </div>
                        </div>
                        <div class="text-slate-700 dark:text-slate-200 text-sm whitespace-pre-line bg-slate-50 dark:bg-darkinput p-4 rounded-2xl">${a.content}</div>
                    </div>
                `;
            }).join('');
        }

        function handleTargetTypeChange() {
            const val = document.getElementById('targetType').value;
            document.getElementById('courseSelectContainer').classList.toggle('hidden', val !== 'course');
        }

        function goBack() {
            window.location.href = currentStudentId ? `student.html?student_id=${currentStudentId}` : 'admin.html';
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const title = document.getElementById('annTitle').value;
            const content = document.getElementById('annContent').value;
            const category = document.getElementById('annCategory').value;
            const targetType = document.getElementById('targetType').value;
            let targetValue = '';

            if (targetType === 'course') {
                targetValue = Array.from(document.querySelectorAll('input[name="courseCheckbox"]:checked')).map(cb => cb.value).join(',');
            }

            Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            const { error } = await mySupabase.from('announcements').insert([{ title, content, category, target_type: targetType, target_value: targetValue }]);
            if (error) {
                Swal.fire('เกิดข้อผิดพลาด', error.message, 'error');
                return;
            }

            Swal.fire({ icon: 'success', title: 'โพสต์สำเร็จ', timer: 1200, showConfirmButton: false });
            document.getElementById('announcementForm').reset();
            loadAnnouncements();
        }

        initPage();
    </script>
</body>
</html>
