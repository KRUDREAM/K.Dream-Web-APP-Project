    <!-- AUTH GUARD: ป้องกันการเข้าถึงโดยไม่ได้รับอนุญาต -->
    <script>
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const urlStudentId = urlParams.get('student_id') || urlParams.get('id');
            if (urlStudentId) {
                localStorage.setItem('student_id', urlStudentId);
                localStorage.setItem('id', urlStudentId);
                localStorage.setItem('role', 'student');
            }

            let hasSession = false;
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith('sb-') && key.endsWith('-auth-token')) {
                    const val = localStorage.getItem(key);
                    if (val && val.includes('access_token')) {
                        hasSession = true;
                        break;
                    }
                }
            }
            const fallbackId = localStorage.getItem('id') || localStorage.getItem('admin_id') || localStorage.getItem('user_id') || localStorage.getItem('student_id');
            if (!hasSession && !fallbackId) {
                window.location.replace('index.html');
            }
        })();
    </script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { 
                extend: { 
                    fontFamily: { sans: ['Prompt', 'sans-serif'] }, 
                    colors: { primary: '#0284c7', darkbg: '#090d16', darkbox: '#0f172a', darkinput: '#1e293b' } 
                }

        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .glass-nav { background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(226, 232, 240, 0.8); }
        .dark .glass-nav { background: rgba(9, 13, 22, 0.92); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(30, 41, 59, 0.8); }
        div:where(.swal2-container) { font-family: 'Prompt', sans-serif; }

        .dark .modern-card { background: #0f172a; border: 1px solid rgba(30, 41, 59, 1); }
        .btn-glow { transition: all 0.3s ease; box-shadow: 0 4px 20px rgba(2, 132, 199, 0.25); }

<body class="bg-slate-50 dark:bg-darkbg min-h-screen text-slate-900 dark:text-slate-100">

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-32 pb-20">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            
            <!-- ฝั่งซ้าย: ฟอร์มสร้าง/แก้ไขประกาศ (ซ่อนอัตโนมัติสำหรับนักเรียน) -->

                <div class="flex items-center gap-4 mb-6 pb-4 border-b border-slate-100 dark:border-slate-800">

                    </div>
                    <div>
                        <h2 class="text-xl font-bold text-slate-900 dark:text-white" id="formTitle">สร้างประกาศใหม่</h2>
                        <p class="text-xs text-slate-500 dark:text-slate-400">เนื้อหาและไฟล์แนบจะส่งถึงหน้านักเรียนทันที</p>
                    </div>
                </div>

                <form id="announcementForm" onsubmit="handleFormSubmit(event)" class="space-y-5">
                    <input type="hidden" id="editAnnouncementId">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2">หัวข้อประกาศ <span class="text-red-500">*</span></label>
                        <input type="text" id="annTitle" required placeholder="เช่น กำหนดการสอบกลางภาค..." class="w-full px-4 py-3.5 bg-slate-50 dark:bg-darkinput border border-slate-200 dark:border-slate-700 rounded-2xl dark:text-white focus:border-sky-500 outline-none text-sm transition-all shadow-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2">เนื้อหาประกาศ <span class="text-red-500">*</span></label>
                        <textarea id="annContent" required rows="5" placeholder="พิมพ์รายละเอียดประกาศที่นี่..." class="w-full px-4 py-3.5 bg-slate-50 dark:bg-darkinput border border-slate-200 dark:border-slate-700 rounded-2xl dark:text-white focus:border-sky-500 outline-none text-sm resize-none transition-all shadow-sm leading-relaxed"></textarea>
                    </div>
                    <div>

                        <input type="file" id="annFiles" multiple accept="image/*,.pdf,.doc,.docx,.xls,.xlsx" class="w-full text-xs text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-sky-50 file:text-sky-600 hover:file:bg-sky-100 dark:file:bg-slate-800 dark:file:text-sky-400 cursor-pointer">

                    </div>

                    <div class="flex gap-3 pt-2">
                        <button type="submit" id="submitBtn" class="flex-1 bg-gradient-to-r from-sky-600 to-indigo-600 hover:from-sky-700 hover:to-indigo-700 text-white py-4 rounded-2xl font-bold btn-glow transition-all text-sm flex items-center justify-center gap-2">
                            <i class="fas fa-paper-plane"></i> โพสต์ประกาศ
                        </button>
                        <button type="button" id="cancelEditBtn" onclick="resetForm()" class="hidden px-6 py-4 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 rounded-2xl font-bold text-sm hover:bg-slate-200 transition-all">

                </form>
            </div>

            <!-- ฝั่งขวา: Feed ประกาศทั้งหมด -->
            <div id="feedSection" class="lg:col-span-7 space-y-5">
                <div class="flex justify-between items-center modern-card p-6 rounded-3xl">
                    <h3 class="font-bold text-lg text-slate-900 dark:text-white flex items-center gap-3">
                        <span class="w-10 h-10 rounded-xl bg-slate-100 dark:bg-slate-800 text-sky-600 flex items-center justify-center text-sm"><i class="fas fa-history"></i></span>
                        ประวัติประกาศทั้งหมด
                    </h3>
                    <span id="annCount" class="text-xs bg-sky-50 dark:bg-sky-950/80 text-sky-600 dark:text-sky-300 px-4 py-2 rounded-xl font-bold border border-sky-100 dark:border-sky-900/50">0 รายการ</span>

                <div id="announcementFeed" class="space-y-4">

    <!-- Modal สำหรับขยายดูรูปภาพขนาดเต็ม -->
    <div id="imageModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4" onclick="closeImageModal()">

            <button class="absolute -top-10 right-0 text-white text-2xl font-bold hover:text-sky-400" onclick="closeImageModal()"><i class="fas fa-xmark"></i></button>
            <img id="modalImg" src="" class="max-w-full max-h-[85vh] rounded-2xl shadow-2xl object-contain">
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let userRole = 'admin';
        let currentStudentData = null;
        let studentEnrolledCourses = [];
        let coursesMap = {};

        const htmlElement = document.documentElement;
        const themeIcon = document.getElementById('themeIcon');
        if (localStorage.getItem('theme') === 'dark') {
            htmlElement.classList.add('dark');
            themeIcon.classList.replace('fa-moon', 'fa-sun');
        }
        document.getElementById('themeToggle').addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            const isDark = htmlElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeIcon.classList.replace(isDark ? 'fa-moon' : 'fa-sun', isDark ? 'fa-sun' : 'fa-moon');
        });

        async function initPage() {
            // โหลดข้อมูลคอร์สเก็บไว้แปลงชื่อ
            const { data: courses } = await mySupabase.from('courses').select('id, title, course_code');
            if (courses) {
                coursesMap = {};
                courses.forEach(c => {
                    coursesMap[c.id] = c.title;
                    coursesMap[c.course_code] = c.title;
                });
            }

            userRole = localStorage.getItem('role') || localStorage.getItem('user_role') || 'admin';
            const studentId = localStorage.getItem('student_id') || localStorage.getItem('id');

            if (userRole === 'student' || studentId) {
                userRole = 'student';
                const creator = document.getElementById('creatorSection');
                if (creator) creator.style.display = 'none';
                const feed = document.getElementById('feedSection');
                if (feed) feed.className = 'lg:col-span-12 space-y-5';

                if (studentId) {
                    const { data: sData } = await mySupabase.from('profiles').select('*').eq('id', studentId).maybeSingle();
                    currentStudentData = sData;

                    const { data: en1 } = await mySupabase.from('course_enrollments').select('course_id').eq('student_id', studentId);
                    if (en1) {
                        for (let e of en1) {
                            const { data: cData } = await mySupabase.from('courses').select('title, course_code').eq('id', e.course_id).maybeSingle();
                            if (cData) studentEnrolledCourses.push(cData.title || cData.course_code);
                        }
                    }
                }
            }

            loadAnnouncements();
        }

        // ฟังก์ชันแปลง Target Value (หากเป็น ID/Code คอร์ส ให้เปลี่ยนเป็นชื่อคอร์สเต็มๆ)
        function formatCourseTargetValue(targetValue) {
            if (!targetValue) return '-';
            const parts = targetValue.split(',');
            const formattedParts = parts.map(part => {
                const trimmed = part.trim();
                return coursesMap[trimmed] || trimmed;
            });
            return formattedParts.join(', ');
        }

        function goBack() {
            const studentId = localStorage.getItem('student_id') || localStorage.getItem('id');
            if (userRole === 'student' || studentId) {
                window.location.href = studentId ? `student.html?student_id=${studentId}` : 'student.html';
            } else {
                window.location.href = 'admin.html';
            }
        }

        async function loadAnnouncements() {
            const { data: anns, error } = await mySupabase.from('announcements').select('*').order('created_at', { ascending: false });
            
            const feed = document.getElementById('announcementFeed');
            if (error || !anns || anns.length === 0) {
                feed.innerHTML = `
                    <div class="modern-card p-12 rounded-3xl text-center text-slate-400">
                        <div class="w-16 h-16 bg-sky-50 dark:bg-slate-800 text-sky-500 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl">
                            <i class="fas fa-bullhorn"></i>
                        </div>
                        <h4 class="text-base font-bold text-slate-700 dark:text-slate-200 mb-1">ยังไม่มีประกาศในระบบ</h4>
                        <p class="text-xs text-slate-400">ประกาศใหม่จะแสดงขึ้นที่นี่ทันทีเมื่อมีการโพสต์</p>
                    </div>
                `;
                document.getElementById('annCount').textContent = '0 รายการ';
                return;
            }

            let filteredAnns = anns.filter(a => {
                if (userRole !== 'student') return true;
                const tType = a.target_type || 'all';
                const tVal = a.target_value || '';
                const studentId = localStorage.getItem('student_id') || localStorage.getItem('id');

                if (tType === 'all' || !tType) return true;
                if (tType === 'level') {
                    const studentGrade = currentStudentData?.grade_level || currentStudentData?.grade || '';
                    return studentGrade && tVal.toLowerCase().includes(studentGrade.toLowerCase());
                }
                if (tType === 'course') {
                    const targetCourses = tVal.split(',').map(c => c.trim());
                    return studentEnrolledCourses.some(c => targetCourses.includes(c));
                }
                if (tType === 'specific') {
                    const targetStudents = tVal.split(',').map(s => s.trim());
                    return targetStudents.includes(String(studentId)) || (currentStudentData && targetStudents.includes(String(currentStudentData.username)));
                }
                return true;
            });

            document.getElementById('annCount').textContent = `${filteredAnns.length} รายการ`;
            const isStaff = userRole !== 'student';

            if (filteredAnns.length === 0) {
                feed.innerHTML = `
                    <div class="modern-card p-12 rounded-3xl text-center text-slate-400">
                        <div class="w-16 h-16 bg-sky-50 dark:bg-slate-800 text-sky-500 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl">
                            <i class="fas fa-bullhorn"></i>
                        </div>
                        <h4 class="text-base font-bold text-slate-700 dark:text-slate-200 mb-1">ไม่มีประกาศสำหรับคุณในขณะนี้</h4>
                        <p class="text-xs text-slate-400">คุณจะเห็นประกาศที่เกี่ยวข้องกับคุณที่นี่</p>
                    </div>
                `;
                return;
            }

            feed.innerHTML = filteredAnns.map(a => {
                const dateStr = new Date(a.created_at).toLocaleString('th-TH', { dateStyle: 'medium', timeStyle: 'short' });
                const titleText = a.title || 'ประกาศจากทางโรงเรียน';

                let targetBadge = '';
                if (a.target_type === 'level') {
                    targetBadge = `<span class="bg-purple-50 dark:bg-purple-950/80 text-purple-600 dark:text-purple-300 text-[10px] font-bold px-2.5 py-1 rounded-lg border border-purple-200 dark:border-purple-900"><i class="fas fa-layer-group mr-1"></i> ชั้น: ${a.target_value || '-'}</span>`;
                } else if (a.target_type === 'course') {
                    const courseNameDisplay = formatCourseTargetValue(a.target_value);
                    targetBadge = `<span class="bg-amber-50 dark:bg-amber-950/80 text-amber-600 dark:text-amber-300 text-[10px] font-bold px-2.5 py-1 rounded-lg border border-amber-200 dark:border-amber-900"><i class="fas fa-book mr-1"></i> คอร์ส: ${courseNameDisplay}</span>`;
                } else if (a.target_type === 'specific') {
                    targetBadge = `<span class="bg-rose-50 dark:bg-rose-950/80 text-rose-600 dark:text-rose-300 text-[10px] font-bold px-2.5 py-1 rounded-lg border border-rose-200 dark:border-rose-900"><i class="fas fa-user mr-1"></i> รายบุคคล</span>`;
                } else {
                    targetBadge = `<span class="bg-sky-50 dark:bg-sky-950/80 text-sky-600 dark:text-sky-300 text-[10px] font-bold px-2.5 py-1 rounded-lg border border-sky-200 dark:border-sky-900"><i class="fas fa-globe mr-1"></i> ทุกคน</span>`;
                }

                let attachmentsHtml = '';
                if (a.attachments && Array.isArray(a.attachments) && a.attachments.length > 0) {
                    let filesList = a.attachments.map((url, idx) => {
                        const isImage = /\.(jpg|jpeg|png|gif|webp)(\?.*)?$/i.test(url);
                        if (isImage) {
                            return `
                                <div class="preview-image-container relative group/img overflow-hidden rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-100 dark:bg-darkinput cursor-pointer shadow-sm col-span-full" onclick="openImageModal('${url}')">
                                    <img src="${url}" class="w-full h-full object-cover group-hover/img:scale-[1.02] transition-transform duration-300">
                                    <div class="absolute inset-0 bg-black/40 opacity-0 group-hover/img:opacity-100 transition-opacity flex items-center justify-center text-white text-xs font-bold gap-1.5">
                                        <i class="fas fa-magnifying-glass-plus text-base"></i> คลิกเพื่อดูรูปขนาดเต็ม (1920x1080)
                                    </div>
                                </div>`;
                        } else {
                            return `<a href="${url}" target="_blank" class="flex items-center gap-2 p-3.5 bg-slate-50 dark:bg-darkinput rounded-2xl border border-slate-200 dark:border-slate-700 text-xs font-semibold text-sky-600 hover:underline shadow-sm"><i class="fas fa-file-arrow-down text-base text-sky-500"></i> ไฟล์แนบ ${idx + 1}</a>`;
                        }
                    }).join('');
                    attachmentsHtml = `<div class="mt-4 grid grid-cols-1 gap-3">${filesList}</div>`;
                }

                const safeTitle = (a.title || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
                const safeContent = (a.content || '').replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/\r?\n/g, '\\n');

                return `
                    <div class="modern-card p-7 rounded-3xl relative overflow-hidden group">
                        <div class="absolute top-0 left-0 w-2.5 h-full bg-gradient-to-b from-sky-500 to-indigo-600"></div>
                        <div class="flex justify-between items-start mb-4 pl-3">
                            <div>
                                <div class="flex items-center gap-2 mb-1 flex-wrap">
                                    <h4 class="font-bold text-lg text-slate-900 dark:text-white">${titleText}</h4>
                                    ${targetBadge}
                                </div>
                                <span class="text-xs font-medium text-slate-400 flex items-center gap-1.5"><i class="far fa-clock"></i> ${dateStr}</span>
                            </div>
                            ${isStaff ? `
                                <div class="flex gap-2">
                                    <button onclick="prepareEdit('${a.id}', '${safeTitle}', '${safeContent}')" class="action-btn-edit px-3.5 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-sm">
                                        <i class="fas fa-pen-to-square"></i> แก้ไข
                                    </button>
                                    <button onclick="deleteAnnouncement('${a.id}')" class="action-btn-delete px-3.5 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-sm">
                                        <i class="fas fa-trash-can"></i> ลบ
                                    </button>
                                </div>
                            ` : ''}
                        </div>
                        <div class="pl-3">
                            <div class="text-slate-700 dark:text-slate-200 text-sm whitespace-pre-line leading-relaxed bg-slate-50 dark:bg-darkinput/60 p-5 rounded-2xl border border-slate-200 dark:border-slate-800">${a.content}</div>
                            ${attachmentsHtml}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openImageModal(url) {
            document.getElementById('modalImg').src = url;
            document.getElementById('imageModal').classList.remove('hidden');
        }

        function closeImageModal() {
            document.getElementById('imageModal').classList.add('hidden');
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const editId = document.getElementById('editAnnouncementId').value;
            const title = document.getElementById('annTitle').value;
            const content = document.getElementById('annContent').value;
            const fileInput = document.getElementById('annFiles');

            if (fileInput.files.length > 5) {
                Swal.fire('จำกัดจำนวนไฟล์', 'แนบไฟล์ได้สูงสุดไม่เกิน 5 ไฟล์ครับ', 'warning');
                return;
            }

            Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            let attachmentUrls = [];
            if (fileInput.files.length > 0) {
                for (let i = 0; i < fileInput.files.length; i++) {
                    const file = fileInput.files[i];
                    const cleanFileName = file.name.replace(/[^a-zA-Z0-9_.-]/g, '_');
                    const fileName = `ann_${Date.now()}_${i}_${cleanFileName}`;
                    
                    const { error: uploadError } = await mySupabase.storage.from('announcement_files').upload(fileName, file);
                    if (!uploadError) {
                        const { data } = mySupabase.storage.from('announcement_files').getPublicUrl(fileName);
                        if (data && data.publicUrl) attachmentUrls.push(data.publicUrl);
                    }
                }
            }

            let payload = { title, content };
            if (attachmentUrls.length > 0) payload.attachments = attachmentUrls;

            if (editId) {
                if (attachmentUrls.length === 0) delete payload.attachments;
                await mySupabase.from('announcements').update(payload).eq('id', editId);
                Swal.fire({ icon: 'success', title: 'แก้ไขประกาศสำเร็จ', timer: 1500, showConfirmButton: false });
            } else {
                await mySupabase.from('announcements').insert([payload]);
                await mySupabase.from('notifications').insert([{ type: 'announcement', message: `${title}: ${content.substring(0, 50)}...` }]);
                Swal.fire({ icon: 'success', title: 'โพสต์ประกาศสำเร็จ', timer: 1500, showConfirmButton: false });
            }

            resetForm();
            loadAnnouncements();
        }

        function prepareEdit(id, title, content) {
            document.getElementById('editAnnouncementId').value = id;
            document.getElementById('annTitle').value = title;
            document.getElementById('annContent').value = content.replace(/\\n/g, '\n');
            document.getElementById('formTitle').textContent = 'แก้ไขประกาศ';
            document.getElementById('cancelEditBtn').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('announcementForm').reset();
            document.getElementById('editAnnouncementId').value = '';
            document.getElementById('formTitle').textContent = 'สร้างประกาศใหม่';
            document.getElementById('cancelEditBtn').classList.add('hidden');
        }

        async function deleteAnnouncement(id) {
            const res = await Swal.fire({
                title: 'ลบประกาศนี้?',
                text: 'การกระทำนี้จะไม่สามารถกู้คืนได้',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                confirmButtonText: 'ใช่, ลบเลย',
                cancelButtonText: 'ยกเลิก'
            });

            if (res.isConfirmed) {
                await mySupabase.from('announcements').delete().eq('id', id);
                Swal.fire({ icon: 'success', title: 'ลบเรียบร้อย', timer: 1200, showConfirmButton: false });
                loadAnnouncements();
            }
        }

        initPage();
    </script>
</body>
</html>
