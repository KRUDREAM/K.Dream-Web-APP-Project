<!DOCTYPE html>
<html lang="th" class="light select-none">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS | ผลการสอบ</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: { fontFamily: { sans: ['Prompt', 'sans-serif'] } }
            }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; user-select: none; -webkit-user-select: none; }
        .glass-nav { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid #e2e8f0; }
        .dark .glass-nav { background: rgba(15, 23, 42, 0.9); border-bottom: 1px solid #1e293b; }
        .card-box { background: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .dark .card-box { background: #0f172a; border: 1px solid #1e293b; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2); }
        .result-bubble {
            width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 11px; border: 2px solid #cbd5e1; background-color: #ffffff; color: #334155; flex-shrink: 0;
        }
        .dark .result-bubble { border-color: #334155; background-color: #0f172a; color: #94a3b8; }
        .result-bubble.student-choice { border-color: #0284c7 !important; color: #0284c7 !important; background-color: rgba(2, 132, 199, 0.15) !important; }
        .result-bubble.correct-choice { background-color: #10b981 !important; color: #ffffff !important; border-color: #10b981 !important; }
        .result-bubble.wrong-choice { background-color: #ef4444 !important; color: #ffffff !important; border-color: #ef4444 !important; }
        .hide-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .hide-scrollbar::-webkit-scrollbar-thumb { background: rgba(2, 132, 199, 0.3); border-radius: 9999px; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 min-h-screen text-slate-900 dark:text-slate-100 pb-20" oncontextmenu="return false;">

    <!-- Navbar -->
    <nav class="glass-nav fixed w-full top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 h-16 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <button onclick="goBackPortal()" class="w-9 h-9 flex items-center justify-center rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-sky-600 hover:text-white transition-all shadow-sm">
                    <i class="fas fa-arrow-left text-xs"></i>
                </button>
                <h1 class="font-bold text-sm sm:text-base" id="resultTitleNav">ผลการสอบ</h1>
            </div>
            <button id="themeToggle" class="w-9 h-9 flex items-center justify-center rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200">
                <i class="fas fa-moon text-xs" id="themeIcon"></i>
            </button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 pt-24 space-y-6">
        
        <!-- Header Banner -->
        <div class="card-box p-6 rounded-2xl flex flex-col md:flex-row items-start md:items-center justify-between gap-4 border-l-4 border-sky-500">
            <div class="space-y-1">
                <span class="px-2.5 py-1 bg-emerald-500/10 text-emerald-600 font-bold text-xs rounded-full">ตรวจผลคะแนนเรียบร้อย</span>
                <h2 class="text-lg sm:text-2xl font-extrabold pt-1" id="examTitleHeader">กำลังโหลดชื่อชุดข้อสอบ...</h2>
                <div class="flex flex-wrap items-center gap-4 text-xs text-slate-500 pt-1">
                    <span id="submissionTimeText"><i class="fas fa-clock mr-1 text-sky-500"></i> เวลาส่ง: --</span>
                    <span id="studentNameDisplay" class="text-sky-600 dark:text-sky-400 font-bold"><i class="fas fa-user-graduate mr-1"></i> ผู้สอบ: กำลังโหลด...</span>
                </div>
            </div>
            
            <div class="flex items-center gap-4 bg-slate-100 dark:bg-slate-900 p-4 rounded-xl border border-slate-200 dark:border-slate-800">
                <div class="text-center px-3 border-r border-slate-300 dark:border-slate-700">
                    <span class="text-[10px] text-slate-400 block font-bold uppercase">คะแนนที่ได้</span>
                    <span class="text-2xl font-extrabold text-emerald-600" id="scoreDisplay">--</span>
                </div>
                <div class="text-center px-3">
                    <span class="text-[10px] text-slate-400 block font-bold uppercase">คะแนนเต็ม</span>
                    <span class="text-2xl font-extrabold" id="totalScoreDisplay">--</span>
                </div>
            </div>
        </div>

        <!-- Questions & PDF Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            <div id="pdfViewerCard" class="hidden lg:col-span-6 card-box p-4 rounded-2xl space-y-3 lg:sticky lg:top-24">
                <h3 class="font-bold text-sm text-red-600 flex items-center gap-2"><i class="fas fa-file-pdf"></i> เอกสารข้อสอบ</h3>
                <div id="pdfContainer" class="w-full h-[70vh] bg-slate-100 dark:bg-slate-900 rounded-xl overflow-y-auto border p-2 flex flex-col items-center gap-2">
                    <div class="text-slate-400 text-xs py-10"><i class="fas fa-spinner fa-spin"></i> กำลังโหลดเอกสาร...</div>
                </div>
            </div>

            <div id="rightResultCard" class="lg:col-span-12 card-box p-6 rounded-2xl space-y-4">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 pb-3 border-b border-slate-200 dark:border-slate-800">
                    <h3 class="font-bold text-sm flex items-center gap-2"><i class="fas fa-list-check text-sky-500"></i> เฉลยคำตอบรายข้อ</h3>
                    
                    <div class="flex items-center gap-1 bg-slate-100 dark:bg-slate-900 p-1 rounded-xl border text-xs">
                        <button onclick="setFilter('all')" id="filter-all" class="px-3 py-1 rounded-lg font-bold bg-sky-600 text-white">ทั้งหมด (<span id="count-all">0</span>)</button>
                        <button onclick="setFilter('correct')" id="filter-correct" class="px-3 py-1 rounded-lg font-bold text-slate-600 dark:text-slate-300">ถูก (<span id="count-correct">0</span>)</button>
                        <button onclick="setFilter('wrong')" id="filter-wrong" class="px-3 py-1 rounded-lg font-bold text-slate-600 dark:text-slate-300">ผิด (<span id="count-wrong">0</span>)</button>
                    </div>
                </div>

                <div id="resultsContainer" class="space-y-3 max-h-[70vh] overflow-y-auto pr-1 hide-scrollbar">
                    <div class="text-center py-12 text-slate-400 text-xs"><i class="fas fa-spinner fa-spin mr-1"></i> กำลังโหลดเฉลยข้อสอบ...</div>
                </div>
            </div>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        if (typeof pdfjsLib !== 'undefined') {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }

        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        
        let mySupabase = null;
        try {
            if (window.supabase && typeof window.supabase.createClient === 'function') {
                mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            }
        } catch (e) {
            console.error('Supabase init error:', e);
        }

        const urlParams = new URLSearchParams(window.location.search);
        const attemptId = urlParams.get('attempt_id') || urlParams.get('id');

        let globalQuestions = [];
        let globalRawAnswers = {};
        let currentFilter = 'all';

        function goBackPortal() {
            if (window.history.length > 1) window.history.back();
            else window.location.href = 'student.html';
        }

        const htmlElement = document.documentElement;
        const themeIcon = document.getElementById('themeIcon');
        if (localStorage.getItem('theme') === 'dark') {
            htmlElement.classList.add('dark');
            if (themeIcon) themeIcon.classList.replace('fa-moon', 'fa-sun');
        }
        document.getElementById('themeToggle').addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            const isDark = htmlElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            if (themeIcon) themeIcon.classList.replace(isDark ? 'fa-moon' : 'fa-sun', isDark ? 'fa-sun' : 'fa-moon');
        });

        function escapeHtml(text) {
            if (!text) return '';
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;')
                .replace(/`/g, '&#96;');
        }

        function parseChoiceIndex(val) {
            if (val === null || val === undefined || val === '') return null;
            if (typeof val === 'number') return val;
            if (!isNaN(val)) return parseInt(val);
            const str = String(val).trim().toUpperCase();
            if (['ก', 'A', '0'].includes(str)) return 0;
            if (['ข', 'B', '1'].includes(str)) return 1;
            if (['ค', 'C', '2'].includes(str)) return 2;
            if (['ง', 'D', '3'].includes(str)) return 3;
            if (['จ', 'E', '4'].includes(str)) return 4;
            return null;
        }

        function getQuestionOptions(q) {
            if (!q || !q.options) return ['ก', 'ข', 'ค', 'ง'];
            let opts = q.options;
            if (typeof opts === 'string') {
                try { opts = JSON.parse(opts); } catch(e) { opts = null; }
            }
            return Array.isArray(opts) && opts.length > 0 ? opts : ['ก', 'ข', 'ค', 'ง'];
        }

        function getUserAnswer(q, rawAnswers) {
            if (!rawAnswers || typeof rawAnswers !== 'object') return '-';
            let ans = rawAnswers[q.id] || rawAnswers[String(q.id)] || rawAnswers[q.question_number] || rawAnswers[String(q.question_number)];
            if (ans === undefined || ans === null) {
                const idx = globalQuestions.indexOf(q);
                if (Array.isArray(rawAnswers)) ans = rawAnswers[idx] !== undefined ? rawAnswers[idx] : rawAnswers[idx+1];
            }
            return ans !== undefined && ans !== null ? ans : '-';
        }

        function isAnswerCorrect(q, userAns) {
            if (userAns === null || userAns === undefined || userAns === '-' || userAns === '') return false;
            const correctAns = q.correct_answer !== undefined && q.correct_answer !== null ? String(q.correct_answer).trim() : '';
            const userAnsStr = String(userAns).trim();
            if (userAnsStr === correctAns) return true;
            const uIdx = parseChoiceIndex(userAnsStr);
            const cIdx = parseChoiceIndex(correctAns);
            if (uIdx !== null && cIdx !== null && uIdx === cIdx) return true;
            return false;
        }

        async function initResultPage() {
            try {
                if (!mySupabase) throw new Error('ไม่สามารถเชื่อมต่อ Supabase ได้');

                let attempt = null;
                if (attemptId) {
                    let res = await mySupabase.from('exam_attempts').select('*').eq('id', attemptId).maybeSingle();
                    if (!res.data) res = await mySupabase.from('exam_attempts').select('*').eq('attempt_id', attemptId).maybeSingle();
                    attempt = res.data;
                }

                if (!attempt) {
                    let studentId = localStorage.getItem('id') || localStorage.getItem('student_id');
                    if (studentId) {
                        let { data } = await mySupabase.from('exam_attempts').select('*').eq('student_id', studentId).order('submission_time', { ascending: false }).limit(1);
                        if (data && data.length > 0) attempt = data[0];
                    }
                }

                if (!attempt) {
                    document.getElementById('examTitleHeader').textContent = 'ไม่พบข้อมูลการสอบ';
                    document.getElementById('resultsContainer').innerHTML = '<div class="text-center py-12 text-amber-500 text-xs">ไม่พบข้อมูลผลการสอบ</div>';
                    return;
                }

                const examRef = attempt.exam_id || attempt.exam_uuid || attempt.quiz_id;
                let exam = null;
                if (examRef) {
                    const exRes = await mySupabase.from('exams').select('*').eq('id', examRef).maybeSingle();
                    exam = exRes.data;
                }

                const examTitle = exam ? exam.title : 'ชุดข้อสอบออนไลน์';
                document.getElementById('examTitleHeader').textContent = examTitle;
                document.getElementById('resultTitleNav').textContent = examTitle;
                document.getElementById('submissionTimeText').innerHTML = '<i class="fas fa-clock mr-1 text-sky-500"></i> เวลาส่ง: ' + new Date(attempt.submission_time || attempt.submitted_at || Date.now()).toLocaleString('th-TH');

                // Student name lookup
                let studentIdRef = attempt.student_id || attempt.student_uuid;
                let studentName = 'นักเรียน';
                if (studentIdRef) {
                    let pRes = await mySupabase.from('profiles').select('full_name, name, username').eq('id', studentIdRef).maybeSingle();
                    if (pRes.data) {
                        const p = pRes.data;
                        studentName = p.full_name || p.name || p.username || 'นักเรียน';
                    }
                }
                document.getElementById('studentNameDisplay').innerHTML = '<i class="fas fa-user-graduate mr-1"></i> ผู้สอบ: ' + studentName;

                // PDF Viewer
                if (exam && exam.pdf_url) {
                    document.getElementById('pdfViewerCard').classList.remove('hidden');
                    document.getElementById('rightResultCard').className = 'lg:col-span-6 card-box p-6 rounded-2xl space-y-4';
                    renderPDF(exam.pdf_url);
                } else {
                    document.getElementById('pdfViewerCard').classList.add('hidden');
                    document.getElementById('rightResultCard').className = 'lg:col-span-12 card-box p-6 rounded-2xl space-y-4';
                }

                // Questions
                let questions = [];
                if (examRef) {
                    let qRes = await mySupabase.from('questions').select('*').eq('exam_id', examRef).order('question_number', { ascending: true });
                    if (!qRes.data || qRes.data.length === 0) {
                        qRes = await mySupabase.from('questions').select('*').eq('exam_uuid', examRef).order('question_number', { ascending: true });
                    }
                    questions = qRes.data || [];
                }
                globalQuestions = questions;

                let rawAns = attempt.answer_saved || attempt.answers || attempt.user_answers || {};
                if (typeof rawAns === 'string') {
                    try { rawAns = JSON.parse(rawAns); } catch(e) { rawAns = {}; }
                }
                globalRawAnswers = rawAns;

                let score = 0;
                globalQuestions.forEach(q => {
                    if (isAnswerCorrect(q, getUserAnswer(q, globalRawAnswers))) score++;
                });
                if (score === 0 && (attempt.total_score !== undefined || attempt.score !== undefined)) {
                    score = Number(attempt.total_score !== undefined ? attempt.total_score : attempt.score);
                }

                document.getElementById('scoreDisplay').textContent = score;
                document.getElementById('totalScoreDisplay').textContent = globalQuestions.length;

                updateCountsAndRender();

            } catch (err) {
                console.error(err);
                document.getElementById('resultsContainer').innerHTML = '<div class="text-center py-12 text-red-500 text-xs">เกิดข้อผิดพลาดในการโหลดข้อมูล</div>';
            }
        }

        async function renderPDF(url) {
            const container = document.getElementById('pdfContainer');
            try {
                const loadingTask = pdfjsLib.getDocument(url);
                const pdfDoc = await loadingTask.promise;
                container.innerHTML = '';
                for (let i = 1; i <= pdfDoc.numPages; i++) {
                    const page = await pdfDoc.getPage(i);
                    const viewport = page.getViewport({ scale: 1.5 });
                    const canvas = document.createElement('canvas');
                    canvas.className = 'shadow rounded-lg mb-2 bg-white w-full';
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;
                    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
                    container.appendChild(canvas);
                }
            } catch (e) {
                container.innerHTML = '<div class="text-amber-500 text-xs py-6 text-center"><a href="' + escapeHtml(url) + '" target="_blank" class="underline font-bold">คลิกเพื่อเปิดไฟล์ PDF</a></div>';
            }
        }

        function setFilter(type) {
            currentFilter = type;
            ['all', 'correct', 'wrong'].forEach(f => {
                const btn = document.getElementById('filter-' + f);
                if (btn) {
                    btn.className = f === type ? 'px-3 py-1 rounded-lg font-bold bg-sky-600 text-white' : 'px-3 py-1 rounded-lg font-bold text-slate-600 dark:text-slate-300';
                }
            });
            renderResults();
        }

        function updateCountsAndRender() {
            let correct = 0, wrong = 0;
            globalQuestions.forEach(q => {
                if (isAnswerCorrect(q, getUserAnswer(q, globalRawAnswers))) correct++;
                else wrong++;
            });
            document.getElementById('count-all').textContent = globalQuestions.length;
            document.getElementById('count-correct').textContent = correct;
            document.getElementById('count-wrong').textContent = wrong;
            renderResults();
        }

        function renderResults() {
            const container = document.getElementById('resultsContainer');
            const filtered = globalQuestions.filter(q => {
                const isCorrect = isAnswerCorrect(q, getUserAnswer(q, globalRawAnswers));
                if (currentFilter === 'correct') return isCorrect;
                if (currentFilter === 'wrong') return !isCorrect;
                return true;
            });

            if (filtered.length === 0) {
                container.innerHTML = '<div class="text-center py-10 text-slate-400 text-xs">ไม่มีรายการในหมวดหมู่นี้</div>';
                return;
            }

            container.innerHTML = filtered.map((q, idx) => {
                const qNum = q.question_number || (globalQuestions.indexOf(q) + 1);
                const userAns = getUserAnswer(q, globalRawAnswers);
                const isCorrect = isAnswerCorrect(q, userAns);
                const opts = getQuestionOptions(q);
                const studentIdx = parseChoiceIndex(userAns);
                const correctIdx = parseChoiceIndex(q.correct_answer);

                const bubbles = opts.map((optText, optIdx) => {
                    let bClass = 'result-bubble';
                    let icon = '';
                    const isPicked = studentIdx === optIdx;
                    const isRight = correctIdx === optIdx;

                    if (isPicked && isRight) { bClass += ' correct-choice'; icon = '<i class="fas fa-check text-[10px] ml-auto"></i>'; }
                    else if (isPicked && !isRight) { bClass += ' wrong-choice'; icon = '<i class="fas fa-times text-[10px] ml-auto"></i>'; }
                    else if (!isPicked && isRight) { bClass += ' correct-choice'; icon = '<i class="fas fa-check text-[10px] ml-auto opacity-60"></i>'; }
                    else if (isPicked) { bClass += ' student-choice'; }

                    return `
                        <div class="flex items-center gap-2.5 p-2 rounded-xl bg-white dark:bg-slate-900 border border-slate-100 dark:border-slate-800">
                            <div class="${bClass}">${String.fromCharCode(65 + optIdx)}</div>
                            <span class="text-xs text-slate-700 dark:text-slate-300 truncate">${escapeHtml(optText)}</span>
                            ${icon}
                        </div>
                    `;
                }).join('');

                const badge = isCorrect 
                    ? '<span class="px-2.5 py-0.5 bg-emerald-500/10 text-emerald-600 rounded-lg text-[10px] font-bold"><i class="fas fa-check-circle mr-1"></i> ถูก (+1)</span>'
                    : '<span class="px-2.5 py-0.5 bg-red-500/10 text-red-600 rounded-lg text-[10px] font-bold"><i class="fas fa-times-circle mr-1"></i> ผิด (0)</span>';

                return `
                    <div class="p-4 bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 space-y-3">
                        <div class="flex justify-between items-center">
                            <span class="font-bold text-xs text-sky-600">ข้อที่ ${qNum}</span>
                            ${badge}
                        </div>
                        <div class="text-xs sm:text-sm font-semibold text-slate-800 dark:text-slate-200">${escapeHtml(q.question_text || q.content || '')}</div>
                        <div class="grid grid-cols-1 gap-1.5 bg-slate-50 dark:bg-slate-950 p-2 rounded-xl border">${bubbles}</div>
                    </div>
                `;
            }).join('');
        }

        document.addEventListener('DOMContentLoaded', initResultPage);
    </script>
</body>
</html>
