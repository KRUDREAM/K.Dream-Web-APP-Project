<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <script src="lms_core.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS | ศูนย์จัดการคอร์สเรียนระดับโปร</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        (function() {
            let hasSession = false;
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith('sb-') && key.endsWith('-auth-token')) {
                    const val = localStorage.getItem(key);
                    if (val && val.includes('access_token')) { hasSession = true; break; }
                }
            }
            const fallbackId = localStorage.getItem('id') || localStorage.getItem('admin_id') || localStorage.getItem('user_id');
            if (!hasSession && !fallbackId) { window.location.replace('index.html'); }
        })();
    </script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Prompt', 'sans-serif'] },
                    colors: { primary: '#0284c7', darkbg: '#020617', darkbox: '#090d16', darkinput: '#0f172a' }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .glass-nav { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(186, 230, 253, 0.5); }
        .dark .glass-nav { background: rgba(2, 6, 23, 0.88); border-bottom: 1px solid rgba(30, 58, 138, 0.4); }
        .hitech-card { background: rgba(255, 255, 255, 0.95); border: 1px solid rgba(186, 230, 253, 0.8); box-shadow: 0 10px 30px -10px rgba(2, 132, 199, 0.08); transition: all 0.25s ease; }
        .dark .hitech-card { background: rgba(9, 13, 22, 0.95); border: 1px solid rgba(30, 58, 138, 0.5); box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5); }
        div:where(.swal2-container) { font-family: 'Prompt', sans-serif; }
        .dark .swal2-popup { background-color: #090d16 !important; color: #f8fafc !important; border: 1px solid #1e293b !important; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-darkbg min-h-screen text-slate-900 dark:text-slate-100 pb-24">

    <!-- Navbar -->
    <nav class="glass-nav fixed w-full top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-3">
                    <button onclick="window.location.href='admin.html'" class="w-9 h-9 flex items-center justify-center rounded-xl bg-white dark:bg-darkinput text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-800 hover:bg-sky-600 hover:text-white transition-all shadow-sm">
                        <i class="fas fa-arrow-left text-sm"></i>
                    </button>
                    <h1 class="font-extrabold text-base text-slate-900 dark:text-white flex items-center gap-2">
                        <span class="w-7 h-7 rounded-lg bg-gradient-to-r from-purple-500 to-indigo-600 text-white flex items-center justify-center text-xs shadow-md"><i class="fas fa-graduation-cap"></i></span>
                        ศูนย์จัดการคอร์สเรียน (Course Hub)
                    </h1>
                </div>
                <button id="themeToggle" class="w-9 h-9 flex items-center justify-center rounded-xl bg-white dark:bg-darkinput text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-800">
                    <i class="fas fa-moon text-sm" id="themeIcon"></i>
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 pt-24 space-y-6">
        
        <!-- Header Banner -->
        <div class="hitech-card p-6 rounded-3xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <h2 class="font-extrabold text-lg text-slate-900 dark:text-white flex items-center gap-2">
                    <i class="fas fa-book-bookmark text-purple-500"></i> จัดการคอร์สเรียนสเกลใหญ่
                </h2>
                <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">คลิกเข้าสู่ "เจาะลึกจัดการภายในคอร์ส" เพื่อควบคุมข้อสอบ, วิดีโอ และจัดการรายชื่อนักเรียนในคอร์สนั้นๆ</p>
            </div>
            <button onclick="openCourseModal()" class="px-4 py-2.5 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-extrabold text-xs rounded-xl shadow-md transition-all flex items-center gap-2">
                <i class="fas fa-plus-circle"></i> สร้างคอร์สเรียนใหม่
            </button>
        </div>

        <!-- Courses Grid -->
        <div id="coursesGridContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="hitech-card p-12 rounded-3xl text-center text-slate-400 text-xs col-span-full">
                <i class="fas fa-spinner fa-spin mr-2"></i> กำลังโหลดข้อมูลคอร์สเรียน...
            </div>
        </div>

    </main>

    <script>
        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let coursesList = [];
        let enrollmentsList = [];
        let validStudentIds = new Set();
        let countdownTimer = null;

        const htmlElement = document.documentElement;
        const themeIcon = document.getElementById('themeIcon');
        if (localStorage.getItem('theme') === 'dark') {
            htmlElement.classList.add('dark');
            themeIcon.classList.replace('fa-moon', 'fa-sun');
        }
        document.getElementById('themeToggle').addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            const isDark = htmlElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeIcon.classList.replace(isDark ? 'fa-moon' : 'fa-sun', isDark ? 'fa-sun' : 'fa-moon');
        });

        async function initPage() {
            try {
                const [coursesRes, enrollRes, altEnrollRes, profilesRes, studentsRes] = await Promise.all([
                    mySupabase.from('courses').select('*').order('created_at', { ascending: false }),
                    mySupabase.from('course_enrollments').select('*'),
                    mySupabase.from('enrollments').select('*'),
                    mySupabase.from('profiles').select('id'),
                    mySupabase.from('students').select('id')
                ]);

                coursesList = coursesRes.data || [];
                const primaryEnrolls = enrollRes.data || [];
                const secondaryEnrolls = altEnrollRes.data || [];
                
                enrollmentsList = [...primaryEnrolls];
                secondaryEnrolls.forEach(se => {
                    if (!enrollmentsList.some(pe => String(pe.id) === String(se.id) || (String(pe.course_id) === String(se.course_id) && String(pe.student_id || pe.user_id) === String(se.student_id || se.user_id)))) {
                        enrollmentsList.push(se);
                    }
                });

                validStudentIds = new Set();
                if (profilesRes.data) {
                    profilesRes.data.forEach(p => validStudentIds.add(String(p.id)));
                }
                if (studentsRes && studentsRes.data) {
                    studentsRes.data.forEach(s => validStudentIds.add(String(s.id)));
                }

                renderCoursesGrid();
                startCountdownInterval();
            } catch (err) {
                console.error("Init Page Error:", err);
            }
        }

        function renderCoursesGrid() {
            const container = document.getElementById('coursesGridContainer');
            if (coursesList.length === 0) {
                container.innerHTML = `
                    <div class="hitech-card p-12 rounded-3xl text-center text-slate-400 text-xs col-span-full space-y-3">
                        <i class="fas fa-folder-open text-3xl text-purple-400"></i>
                        <div>ยังไม่มีคอร์สเรียนในระบบ กดปุ่ม "สร้างคอร์สเรียนใหม่" ด้านบนได้เลย</div>
                    </div>
                `;
                return;
            }

            container.innerHTML = coursesList.map(c => {
                const courseEnrollments = enrollmentsList.filter(e => String(e.course_id) === String(c.id));
                const uniqueStudentSet = new Set();
                courseEnrollments.forEach(e => {
                    const sId = String(e.student_id || e.user_id || '');
                    if (sId && (validStudentIds.size === 0 || validStudentIds.has(sId))) {
                        uniqueStudentSet.add(sId);
                    }
                });
                const enrolledCount = uniqueStudentSet.size;

                const coverImg = c.image_url || 'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=600&auto=format&fit=crop&q=80';
                
                const type = c.course_type || 'normal';
                let typeBadge = `<span class="px-2.5 py-1 bg-purple-500/10 text-purple-600 dark:text-purple-400 font-bold text-[10px] rounded-lg">📚 คอร์สปกติ</span>`;
                if (type === 'trial') {
                    typeBadge = `<span class="px-2.5 py-1 bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 font-bold text-[10px] rounded-lg">🚀 คอร์สทดลองเรียน</span>`;
                } else if (type === 'bonus') {
                    typeBadge = `<span class="px-2.5 py-1 bg-amber-500/10 text-amber-600 dark:text-amber-400 font-bold text-[10px] rounded-lg">🎁 คอร์สแถม</span>`;
                }

                let expiryHtml = `<span class="text-slate-400">♾️ ไม่จำกัดระยะเวลา</span>`;
                if (c.expires_at) {
                    const expiryDateStr = new Date(c.expires_at).toLocaleString('th-TH', { dateStyle: 'medium', timeStyle: 'short' });
                    expiryHtml = `
                        <div class="flex items-center justify-between text-[11px] pt-1 border-t border-slate-200 dark:border-slate-800">
                            <span class="text-slate-400"><i class="fas fa-clock mr-1 text-purple-500"></i> หมดอายุ: ${expiryDateStr}</span>
                            <span class="font-mono font-bold text-rose-500 countdown-badge" data-expires="${c.expires_at}">กำลังคำนวณ...</span>
                        </div>
                    `;
                }

                return `
                    <div class="hitech-card rounded-3xl overflow-hidden flex flex-col justify-between group border border-purple-500/20">
                        <div>
                            <div class="aspect-video w-full relative overflow-hidden bg-slate-200 dark:bg-slate-800">
                                <img src="${coverImg}" alt="${c.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                                <div class="absolute top-3 left-3 bg-slate-900/80 backdrop-blur-md text-white font-mono font-bold text-[10px] px-3 py-1 rounded-full border border-white/10">
                                    ${c.course_code || 'COURSE'}
                                </div>
                                <div class="absolute top-3 right-3">
                                    ${typeBadge}
                                </div>
                            </div>
                            <div class="p-5 space-y-2.5">
                                <h3 class="font-extrabold text-base text-slate-900 dark:text-white line-clamp-1">${c.title}</h3>
                                <p class="text-xs text-slate-500 dark:text-slate-400 leading-relaxed line-clamp-2">${c.description || 'ไม่มีรายละเอียดคอร์ส'}</p>
                                
                                ${expiryHtml}

                                <div class="pt-1 flex items-center justify-between text-xs font-bold">
                                    <a href="admin_course_detail.html?id=${c.id}" class="text-purple-600 dark:text-purple-400 hover:underline flex items-center gap-1.5">
                                        <i class="fas fa-users"></i> นักเรียนลงทะเบียน ${enrolledCount} คน <i class="fas fa-arrow-right text-[10px]"></i>
                                    </a>
                                </div>
                            </div>
                        </div>
                        <div class="p-5 pt-0 grid grid-cols-2 gap-2">
                            <button onclick="window.location.href='admin_course_detail.html?id=${c.id}'" class="col-span-2 py-2.5 bg-purple-600 hover:bg-purple-500 text-white font-extrabold rounded-xl text-xs shadow-md transition-all flex items-center justify-center gap-1.5">
                                <i class="fas fa-chalkboard-user"></i> เจาะลึกจัดการภายในคอร์ส
                            </button>
                            <button onclick="openCourseModal('${c.id}')" class="py-2 bg-sky-500/10 text-sky-600 hover:bg-sky-500 hover:text-white font-bold rounded-xl text-xs transition-all">
                                <i class="fas fa-pen mr-1"></i> แก้ไข
                            </button>
                            <button onclick="deleteCourse('${c.id}')" class="py-2 bg-rose-500/10 text-rose-600 hover:bg-rose-500 hover:text-white font-bold rounded-xl text-xs transition-all">
                                <i class="fas fa-trash mr-1"></i> ลบ
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            updateCountdowns();
        }

        function startCountdownInterval() {
            if (countdownTimer) clearInterval(countdownTimer);
            countdownTimer = setInterval(updateCountdowns, 1000);
        }

        function updateCountdowns() {
            const badges = document.querySelectorAll('.countdown-badge');
            const now = new Date().getTime();

            badges.forEach(badge => {
                const expiresStr = badge.getAttribute('data-expires');
                const targetTime = new Date(expiresStr).getTime();
                const distance = targetTime - now;

                if (distance < 0) {
                    badge.innerHTML = `<span class="px-2 py-0.5 bg-rose-500/20 text-rose-500 rounded-lg text-[10px]">❌ คอร์สหมดอายุแล้ว</span>`;
                } else {
                    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                    let timeText = '';
                    if (days > 0) timeText += `${days}วัน `;
                    timeText += `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                    badge.textContent = `⏳ เหลือเวลา ${timeText}`;
                }
            });
        }

        async function openCourseModal(courseId = null) {
            let course = { course_code: '', title: '', description: '', image_url: '', expires_at: '', course_type: 'normal', bonus_rule_type: 'any', prerequisite_course_ids: [] };
            let isEdit = false;
            if (courseId) {
                isEdit = true;
                course = coursesList.find(c => String(c.id) === String(courseId)) || course;
            }

            // กรองเฉพาะ "คอร์สปกติ" (normal) เท่านั้นสำหรับเอามาทำเป็นเงื่อนไขคอร์สแถม (ไม่เอาคอร์สทดลองและคอร์สแถมมาเป็นเงื่อนไข)
            const normalCourses = coursesList.filter(c => (c.course_type || 'normal') === 'normal' && String(c.id) !== String(courseId));

            let formattedExpiry = '';
            if (course.expires_at) {
                const d = new Date(course.expires_at);
                const year = d.getFullYear();
                const month = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                const hours = String(d.getHours()).padStart(2, '0');
                const minutes = String(d.getMinutes()).padStart(2, '0');
                formattedExpiry = `${year}-${month}-${day}T${hours}:${minutes}`;
            }

            const isDark = document.documentElement.classList.contains('dark');

            const { value: formValues } = await Swal.fire({
                title: isEdit ? '✏️ แก้ไขข้อมูลคอร์สเรียน' : '➕ สร้างคอร์สเรียนใหม่',
                width: '650px',
                html: `
                    <div id="swalErrorMsg" class="hidden mb-3 p-2 bg-rose-500/25 border border-rose-500 text-rose-500 rounded-xl text-xs font-bold text-center"></div>
                    <div class="space-y-3 text-left text-xs">
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block font-bold mb-1">รหัสคอร์ส (Course Code) <span class="text-red-500">*</span></label>
                                <input id="swalCode" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border rounded-xl outline-none font-mono font-bold" value="${course.course_code || ''}" placeholder="เช่น CS-M3">
                            </div>
                            <div>
                                <label class="block font-bold mb-1">ประเภทคอร์ส <span class="text-red-500">*</span></label>
                                <select id="swalCourseType" onchange="toggleBonusSection(this.value)" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border rounded-xl outline-none font-bold">
                                    <option value="normal" ${(course.course_type || 'normal') === 'normal' ? 'selected' : ''}>📚 คอร์สปกติ (ต้องลงทะเบียน)</option>
                                    <option value="trial" ${course.course_type === 'trial' ? 'selected' : ''}>🚀 คอร์สทดลองเรียน (ฟรี)</option>
                                    <option value="bonus" ${course.course_type === 'bonus' ? 'selected' : ''}>🎁 คอร์สแถม (ตามเงื่อนไข)</option>
                                </select>
                            </div>
                        </div>
                        <div>
                            <label class="block font-bold mb-1">ชื่อคอร์สเรียน <span class="text-red-500">*</span></label>
                            <input id="swalTitle" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border rounded-xl outline-none font-bold" value="${course.title || ''}" placeholder="เช่น ค่ายคอมพิวเตอร์ สอวน. ม.3">
                        </div>

                        <!-- ส่วนตั้งค่าเงื่อนไขคอร์สแถม -->
                        <div id="bonusRulesSection" class="${course.course_type === 'bonus' ? '' : 'hidden'} space-y-3 p-3.5 bg-amber-500/5 border border-amber-500/20 rounded-xl">
                            <h4 class="font-extrabold text-amber-600 dark:text-amber-400"><i class="fas fa-gift mr-1"></i> เงื่อนไขการปลดล็อกคอร์สแถม</h4>
                            <div>
                                <label class="block font-bold mb-1">รูปแบบเงื่อนไข</label>
                                <select id="swalBonusRuleType" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border rounded-xl outline-none font-bold">
                                    <option value="any" ${course.bonus_rule_type === 'any' ? 'selected' : ''}>ลงทะเบียน "1 ในคอร์สด้านล่างนี้" (อย่างน้อย 1)</option>
                                    <option value="all" ${course.bonus_rule_type === 'all' ? 'selected' : ''}>ลงทะเบียน "ครบทุกคอร์สด้านล่างนี้" (ทั้งหมด)</option>
                                </select>
                            </div>
                            <div>
                                <label class="block font-bold mb-1">เลือกคอร์สปกติที่เป็นเงื่อนไข:</label>
                                <div class="max-h-36 overflow-y-auto space-y-1 border p-2 rounded-xl bg-white dark:bg-slate-900">
                                    ${normalCourses.length === 0 ? '<div class="text-slate-400 text-center py-2">ยังไม่มีคอร์สปกติอื่นในระบบ</div>' : normalCourses.map(nc => {
                                        const isChecked = (course.prerequisite_course_ids || []).includes(String(nc.id)) ? 'checked' : '';
                                        return `
                                            <label class="flex items-center gap-2 p-1 hover:bg-slate-100 dark:hover:bg-slate-800 rounded cursor-pointer">
                                                <input type="checkbox" name="swalPrereqCourse" value="${nc.id}" ${isChecked} class="w-4 h-4 text-purple-600 rounded">
                                                <span class="font-bold text-[11px]">[${nc.course_code}] ${nc.title}</span>
                                            </label>
                                        `;
                                    }).join('')}
                                </div>
                            </div>
                        </div>

                        <div>
                            <label class="block font-bold mb-1">กำหนดวัน-เวลาหมดอายุของคอร์ส (ปล่อยว่างถ้าไม่จำกัด)</label>
                            <input type="datetime-local" id="swalExpires" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border rounded-xl outline-none font-mono" value="${formattedExpiry}">
                        </div>
                        <div>
                            <label class="block font-bold mb-1">รูปภาพปกคอร์ส</label>
                            <div class="flex items-center gap-3 p-3 bg-slate-50 dark:bg-slate-800/50 rounded-2xl border border-slate-200 dark:border-slate-700">
                                <div class="w-20 aspect-video rounded-xl bg-slate-200 dark:bg-slate-700 overflow-hidden flex items-center justify-center shrink-0 border">
                                    <img id="swalCoverPreview" src="${course.image_url || ''}" class="w-full h-full object-cover ${course.image_url ? '' : 'hidden'}">
                                    <i class="fas fa-image text-slate-400 text-base ${course.image_url ? 'hidden' : ''}" id="swalCoverPlaceholder"></i>
                                </div>
                                <div class="flex-1 min-w-0">
                                    <input type="file" id="swalImageFile" accept="image/*" onchange="previewCourseCover(this)" class="w-full text-xs text-slate-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-purple-600 file:text-white hover:file:bg-purple-500 cursor-pointer">
                                </div>
                            </div>
                            <input type="hidden" id="swalImageUrl" value="${course.image_url || ''}">
                        </div>
                        <div>
                            <label class="block font-bold mb-1">รายละเอียดคอร์ส</label>
                            <textarea id="swalDesc" rows="2" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border rounded-xl outline-none" placeholder="คำอธิบายสั้นๆ...">${course.description || ''}</textarea>
                        </div>
                    </div>
                `,
                showCancelButton: true,
                confirmButtonText: 'บันทึก',
                cancelButtonText: 'ยกเลิก',
                confirmButtonColor: '#9333ea',
                background: isDark ? '#090d16' : '#ffffff',
                color: isDark ? '#f1f5f9' : '#1e293b',
                preConfirm: async () => {
                    const code = document.getElementById('swalCode').value.trim();
                    const title = document.getElementById('swalTitle').value.trim();
                    const courseType = document.getElementById('swalCourseType').value;
                    const bonusRuleType = document.getElementById('swalBonusRuleType').value;
                    const expiresVal = document.getElementById('swalExpires').value;
                    const desc = document.getElementById('swalDesc').value.trim();
                    const fileInput = document.getElementById('swalImageFile');
                    let imageUrl = document.getElementById('swalImageUrl').value.trim();
                    const errBox = document.getElementById('swalErrorMsg');

                    let prereqIds = [];
                    if (courseType === 'bonus') {
                        const checkedCheckboxes = document.querySelectorAll('input[name="swalPrereqCourse"]:checked');
                        checkedCheckboxes.forEach(cb => prereqIds.push(cb.value));
                    }

                    if (!code || !title) {
                        errBox.textContent = '⚠️ กรุณากรอกรหัสคอร์สและชื่อคอร์สให้ครบถ้วน';
                        errBox.classList.remove('hidden');
                        return false;
                    }

                    let expiresIso = null;
                    if (expiresVal) {
                        const localDate = new Date(expiresVal);
                        expiresIso = localDate.toISOString();
                    }

                    if (fileInput.files && fileInput.files[0]) {
                        const file = fileInput.files[0];
                        const fileExt = file.name.split('.').pop();
                        const fileName = `course_${Date.now()}_${Math.random().toString(36).substring(2, 7)}.${fileExt}`;
                        const filePath = `covers/${fileName}`;

                        Swal.showLoading();
                        const { data: uploadData, error: uploadError } = await mySupabase.storage
                            .from('course-covers')
                            .upload(filePath, file);

                        if (uploadError) {
                            const { data: fallbackData, error: fallbackError } = await mySupabase.storage
                                .from('public')
                                .upload(filePath, file);
                            
                            if (fallbackError) {
                                errBox.textContent = '⚠️ อัปโหลดรูปภาพไม่สำเร็จ: ' + (uploadError.message || fallbackError.message);
                                errBox.classList.remove('hidden');
                                return false;
                            } else {
                                const { data: publicUrlData } = mySupabase.storage.from('public').getPublicUrl(filePath);
                                imageUrl = publicUrlData.publicUrl;
                            }
                        } else {
                            const { data: publicUrlData } = mySupabase.storage.from('course-covers').getPublicUrl(filePath);
                            imageUrl = publicUrlData.publicUrl;
                        }
                    }

                    return { 
                        course_code: code, 
                        title: title, 
                        course_type: courseType,
                        bonus_rule_type: bonusRuleType,
                        prerequisite_course_ids: prereqIds,
                        expires_at: expiresIso,
                        image_url: imageUrl, 
                        description: desc 
                    };
                }
            });

            if (formValues) {
                Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                let error = null;
                if (isEdit) {
                    const res = await mySupabase.from('courses').update(formValues).eq('id', courseId);
                    error = res.error;

                    if (!error && typeof logSystemAction === 'function') {
                        await logSystemAction('ADMIN_UPDATE_COURSE', `แอดมินแก้ไขคอร์สเรียน: ${formValues.title} (${formValues.course_code})`, { course_id: courseId, course_code: formValues.course_code, title: formValues.title });
                    }
                } else {
                    const res = await mySupabase.from('courses').insert([formValues]);
                    error = res.error;

                    if (!error && typeof logSystemAction === 'function') {
                        await logSystemAction('ADMIN_CREATE_COURSE', `แอดมินสร้างคอร์สเรียนใหม่: ${formValues.title} (${formValues.course_code})`, { course_code: formValues.course_code, title: formValues.title });
                    }
                }

                if (!error) {
                    Swal.fire({ icon: 'success', title: 'บันทึกสำเร็จ!', timer: 1200, showConfirmButton: false });
                    initPage();
                } else {
                    Swal.fire('เกิดข้อผิดพลาด', error.message, 'error');
                }
            }
        }

        function toggleBonusSection(val) {
            const section = document.getElementById('bonusRulesSection');
            if (section) {
                if (val === 'bonus') {
                    section.classList.remove('hidden');
                } else {
                    section.classList.add('hidden');
                }
            }
        }

        function previewCourseCover(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('swalCoverPreview');
                    const placeholder = document.getElementById('swalCoverPlaceholder');
                    if (preview && placeholder) {
                        preview.src = e.target.result;
                        preview.classList.remove('hidden');
                        placeholder.classList.add('hidden');
                    }
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        async function deleteCourse(courseId) {
            const { isConfirmed } = await Swal.fire({
                title: 'ยืนยันการลบคอร์สเรียน?',
                text: 'การลบคอร์สจะยกเลิกการลงทะเบียนทั้งหมด',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'ลบคอร์ส',
                cancelButtonText: 'ยกเลิก',
                confirmButtonColor: '#ef4444'
            });

            if (isConfirmed) {
                Swal.fire({ title: 'กำลังลบ...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                const { error } = await mySupabase.from('courses').delete().eq('id', courseId);

                if (!error && typeof logSystemAction === 'function') {
                    await logSystemAction('ADMIN_DELETE_COURSE', `แอดมินลบคอร์สเรียน ID: ${courseId}`, { course_id: courseId });
                }

                Swal.fire({ icon: 'success', title: 'ลบคอร์สสำเร็จ!', timer: 1000, showConfirmButton: false });
                initPage();
            }
        }

        initPage();
    </script>
</body>
</html>
